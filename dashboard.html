<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --merah:#C8102E; --merah-hover:#A00D25; --merah-tua:#8B0000;
    --emas:#F59E0B; --emas-muda:#FBBF24; --emas-bg:#FFFBEB;
    --putih:#FFFFFF; --abu-bg:#F9FAFB; --text:#1F2937; --text-lembut:#6B7280;
    --hijau:#059669; --hijau-bg:#ECFDF5; --kuning:#B45309; --kuning-bg:#FEF3C7;

  html{ scroll-behavior:smooth; }
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    background:var(--abu-bg); color:var(--text);
    min-height:100dvh; padding-bottom:86px;
    overflow-x:hidden;
  }

  /* ============ HEADER ============ */
  #appHeader{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:linear-gradient(135deg,#C8102E,#8B0000);
    color:#fff; box-shadow:0 4px 16px -4px rgba(139,0,0,.55);
    padding:10px 14px;
  }
  .header-inner{
    max-width:1100px; margin:0 auto;
    display:flex; align-items:center; gap:11px;
  }
  .header-logo{
    width:40px; height:40px; border-radius:50%; flex:0 0 40px;
    background:linear-gradient(135deg,#C8102E,#8B0000);
    border:2px solid #FBBF24; color:#FBBF24;
    font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    letter-spacing:.5px;
    box-shadow:0 0 14px rgba(251,191,36,.45);
  }
  .header-info{ flex:1; min-width:0; }
  .header-info .nama{
    font-size:14px; font-weight:700; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-info .jabatan{
    font-size:11px; opacity:.9; font-weight:500; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-aksi{ display:flex; gap:7px; }
  .header-aksi button{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    color:#fff; border-radius:9px; padding:8px 10px; cursor:pointer;
    font-size:15px; line-height:1; transition:.16s;
  }
  .header-aksi button:hover{ background:rgba(255,255,255,.28); }
  .badge-demo{
    display:inline-block; margin-top:3px;
    background:#FBBF24; color:#111827;
    font-size:9.5px; font-weight:800; letter-spacing:.5px;
    padding:2px 7px; border-radius:20px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.6} }

  /* ============ MAIN ============ */
  #appContent{
    max-width:1100px; margin:0 auto;
    padding:14px 14px 20px;
    padding-top:74px;
  }

  .judul-halaman{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .judul-halaman .ikon-hal{
    width:38px; height:38px; border-radius:11px; flex:0 0 38px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#C8102E,#8B0000); color:#FBBF24;
    font-size:18px; border:1.5px solid #FBBF24;
    box-shadow:0 4px 10px -3px rgba(200,16,46,.6);
  }
  .judul-halaman h2{ font-size:17px; font-weight:700; line-height:1.15; }
  .judul-halaman .sub{ font-size:11.5px; color:var(--text-lembut); font-weight:500; }

  /* ============ MENU GRID ============ */
  .menu-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:11px;
  }
  @media(min-width:640px){ .menu-grid{ grid-template-columns:repeat(3,1fr); } }
  @media(min-width:1024px){ .menu-grid{ grid-template-columns:repeat(4,1fr); } }

  .menu-kartu{
    background:var(--putih); border-radius:14px; padding:16px 12px;
    border:1px solid #EEF0F3; cursor:pointer; text-align:center;
    transition:.18s; box-shadow:0 2px 6px rgba(0,0,0,.04);
    position:relative; overflow:hidden;
  }
  .menu-kartu::after{
    content:''; position:absolute; bottom:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,#C8102E,#FBBF24);
    transform:scaleX(0); transition:transform .22s;
  }
  .menu-kartu:hover{ transform:translateY(-3px); box-shadow:0 10px 22px -8px rgba(139,0,0,.35); border-color:#FDE68A; }
  .menu-kartu:hover::after{ transform:scaleX(1); }
  .menu-kartu .ikon{
    width:46px; height:46px; margin:0 auto 9px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; color:#fff;
    background:linear-gradient(135deg,#C8102E,#8B0000);
    box-shadow:0 5px 12px -4px rgba(200,16,46,.7);
  }
  .menu-kartu .label{ font-size:12.5px; font-weight:700; line-height:1.25; }
  .menu-kartu .ket{ font-size:10.5px; color:var(--text-lembut); font-weight:500; margin-top:2px; }

  /* ============ KARTU / PANEL ============ */
  .panel{
    background:var(--putih); border-radius:14px; padding:16px;
    border:1px solid #EEF0F3; box-shadow:0 2px 8px rgba(0,0,0,.04);
    margin-bottom:14px;
  }
  .panel h3{
    font-size:14.5px; font-weight:700; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .panel h3::before{
    content:''; width:4px; height:17px; border-radius:3px;
    background:linear-gradient(180deg,#C8102E,#FBBF24);
  }

  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:640px){ .stat-grid{ grid-template-columns:repeat(4,1fr); } }
  .stat-kartu{
    background:linear-gradient(135deg,#fff,#FAFAFB);
    border:1px solid #EEF0F3; border-radius:13px; padding:13px;
  }
  .stat-kartu .angka{ font-size:19px; font-weight:800; color:var(--merah); line-height:1.15; }
  .stat-kartu .ket{ font-size:10.5px; color:var(--text-lembut); font-weight:600; margin-top:3px; text-transform:uppercase; letter-spacing:.3px; }

  /* ============ FORM ============ */
  .form-grup{ margin-bottom:13px; }
  .form-grup label{
    display:block; font-size:12.5px; font-weight:600;
    margin-bottom:6px; color:#374151;
  }
  .form-grup input, .form-grup select, .form-grup textarea{
    width:100%; padding:11px 13px;
    border:1.5px solid #E5E7EB; border-radius:10px;
    font-family:inherit; font-size:13.5px; color:var(--text);
    background:#FCFCFD; transition:.16s;
  }
  .form-grup input:focus, .form-grup select:focus, .form-grup textarea:focus{
    outline:none; border-color:var(--merah);
    background:#fff; box-shadow:0 0 0 3px rgba(200,16,46,.1);
  }
  .form-grup input[readonly], .form-grup input:disabled, .form-grup select:disabled{
    background:#F3F4F6; color:#6B7280; cursor:not-allowed;
  }
  .form-baris{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:520px){ .form-baris{ grid-template-columns:1fr; } }

  .toggle-grup{ display:flex; gap:9px; margin-bottom:14px; }
  .toggle-btn{
    flex:1; padding:11px; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:700;
    border:1.5px solid #E5E7EB; background:#fff; color:#6B7280;
    transition:.16s;
  }
  .toggle-btn.aktif{
    background:linear-gradient(135deg,#C8102E,#8B0000); color:#fff;
    border-color:transparent; box-shadow:0 5px 12px -4px rgba(200,16,46,.7);
  }

  .preview-box{
    background:var(--emas-bg); border:1.5px dashed #FCD34D;
    border-radius:11px; padding:12px 14px; margin-bottom:13px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .preview-box .label{ font-size:11.5px; font-weight:600; color:#92400E; }
  .preview-box .nilai{ font-size:17px; font-weight:800; color:#B45309; }

  .btn{
    border:0; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:13.5px; font-weight:700;
    padding:12px 16px; transition:.16s; letter-spacing:.2px;
  }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:linear-gradient(135deg,#C8102E,#8B0000); color:#fff; box-shadow:0 5px 14px -5px rgba(200,16,46,.75); }
  .btn-primary:hover:not(:disabled){ background:linear-gradient(135deg,#A00D25,#700000); transform:translateY(-1px); }
  .btn-emas{ background:linear-gradient(135deg,#FBBF24,#F59E0B); color:#422006; box-shadow:0 5px 14px -5px rgba(245,158,11,.8); }
  .btn-emas:hover:not(:disabled){ background:linear-gradient(135deg,#F59E0B,#D97706); transform:translateY(-1px); }
  .btn-outline{ background:#fff; color:#B45309; border:1.8px solid var(--emas-muda); }
  .btn-outline:hover:not(:disabled){ background:var(--emas-bg); }
  .btn-abu{ background:#F3F4F6; color:#4B5563; }
  .btn-abu:hover:not(:disabled){ background:#E5E7EB; }
  .btn-sm{ font-size:11.5px; padding:7px 11px; border-radius:8px; }
  .btn-block{ width:100%; }
  .btn-baris{ display:flex; gap:9px; flex-wrap:wrap; margin-top:6px; }

  /* ============ TABEL ============ */
  .tabel-wrap{ overflow-x:auto; border-radius:11px; border:1px solid #EEF0F3; }
  table.data{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px; }
  table.data thead th{
    background:linear-gradient(135deg,#C8102E,#8B0000); color:#fff;
    font-size:11px; font-weight:700; text-align:left; padding:10px 11px;
    text-transform:uppercase; letter-spacing:.3px; white-space:nowrap;
  }
  table.data tbody td{ padding:10px 11px; border-bottom:1px solid #F1F2F4; vertical-align:middle; }
  table.data tbody tr:last-child td{ border-bottom:0; }
  table.data tbody tr:hover{ background:#FCFAF7; }
  .td-kanan{ text-align:right; }
  .td-pusat{ text-align:center; }
  .td-hijau{ background:var(--hijau-bg); color:var(--hijau); font-weight:800; }

  .badge{
    display:inline-block; font-size:10px; font-weight:800;
    padding:3px 9px; border-radius:20px; letter-spacing:.3px;
    text-transform:uppercase; white-space:nowrap;
  }
  .badge-hijau{ background:var(--hijau-bg); color:var(--hijau); }
  .badge-abu{ background:#F3F4F6; color:#6B7280; }
  .badge-merah{ background:var(--merah-bg); color:#B91C1C; }
  .badge-kuning{ background:var(--kuning-bg); color:var(--kuning); }
  .badge-biru{ background:#EFF6FF; color:var(--biru); }
  .badge-emas{ background:var(--emas-bg); color:#B45309; }

  .aksi-baris{ display:flex; gap:5px; flex-wrap:wrap; }
  .aksi-baris button{
    background:#F9FAFB; border:1px solid #E5E7EB; border-radius:7px;
    padding:5px 7px; cursor:pointer; font-size:13px; line-height:1;
    transition:.14s;
  }
  .aksi-baris button:hover{ background:var(--emas-bg); border-color:var(--emas-muda); }
  .aksi-baris button:disabled{ opacity:.4; cursor:not-allowed; }

  /* ============ SEARCH/FILTER ============ */
  .filter-baris{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:12px; }
  .filter-baris input, .filter-baris select{
    flex:1; min-width:130px; padding:10px 12px;
    border:1.5px solid #E5E7EB; border-radius:10px;
    font-family:inherit; font-size:13px; background:#FCFCFD;
  }
  .filter-baris input:focus, .filter-baris select:focus{
    outline:none; border-color:var(--merah); box-shadow:0 0 0 3px rgba(200,16,46,.1);
  }

  .kosong{
    text-align:center; padding:30px 16px; color:var(--text-lembut);
    font-size:13px;
  }
  .kosong .ikon{ font-size:40px; margin-bottom:8px; opacity:.55; }

  .loading{
    text-align:center; padding:26px; color:var(--text-lembut); font-size:13px;
  }
  .loading .spinner{
    width:30px; height:30px; margin:0 auto 10px;
    border:3px solid #F3F4F6; border-top-color:var(--merah);
    border-radius:50%; animation:putar .8s linear infinite;
  }
  @keyframes putar{ to{ transform:rotate(360deg); } }

  /* ============ BOTTOM NAV ============ */
  #bottomNav{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:#fff; border-top:1px solid #E5E7EB;
    box-shadow:0 -4px 16px -6px rgba(0,0,0,.12);
    display:flex; overflow-x:auto; scrollbar-width:none;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  #bottomNav::-webkit-scrollbar{ display:none; }
  .nav-item{
    flex:1 0 auto; min-width:66px;
    background:transparent; border:0; cursor:pointer;
    font-family:inherit; font-size:9.5px; font-weight:700;
    color:#9CA3AF; padding:7px 4px; border-radius:11px;

  .nav-item .ikon{ font-size:19px; line-height:1; }
  .nav-item.aktif{ color:var(--merah); background:var(--merah-bg); }
  .nav-item:hover{ color:var(--merah); }

  /* ============ TOAST ============ */
  #toastBox{
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    z-index:200; width:calc(100% - 28px); max-width:400px;
    display:flex; flex-direction:column; gap:8px; pointer-events:none;
  }
  .toast{
    padding:12px 15px; border-radius:11px; color:#fff;
    font-size:13px; font-weight:600;
    box-shadow:0 10px 26px -8px rgba(0,0,0,.45);
    animation:toastMasuk .3s cubic-bezier(.2,.8,.3,1) both;
    display:flex; align-items:center; gap:9px;

  .toast.hilang{ animation:toastKeluar .28s ease both; }
  @keyframes toastMasuk{ from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastKeluar{ to{opacity:0;transform:translateY(-12px)} }
  .toast-sukses{ background:linear-gradient(135deg,#059669,#047857); }
  .toast-error{ background:linear-gradient(135deg,#DC2626,#B91C1C); }
  .toast-warning{ background:linear-gradient(135deg,#F59E0B,#D97706); color:#422006; }
  .toast-info{ background:linear-gradient(135deg,#2563EB,#1D4ED8); }

  /* ============ MODAL ============ */
  #modalOverlay{
    position:fixed; inset:0; z-index:150; display:none;
    background:rgba(17,24,39,.66); backdrop-filter:blur(3px);
    align-items:center; justify-content:center; padding:16px;
    overflow-y:auto;
  }
  #modalOverlay.tampil{ display:flex; }
  .modal-kotak{
    background:#fff; border-radius:16px; width:100%; max-width:480px;
    box-shadow:0 26px 60px -16px rgba(0,0,0,.55);
    animation:modalNaik .26s ease both;
    max-height:92dvh; display:flex; flex-direction:column;
    margin:auto;
  }
  @keyframes modalNaik{ from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  .modal-head{
    padding:16px 18px; border-bottom:1px solid #EEF0F3;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:relative;
  }
  .modal-head::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,#C8102E,#FBBF24);
    border-radius:16px 16px 0 0;
  }
  .modal-head h3{ font-size:15px; font-weight:700; }
  .modal-head button{
    background:#F3F4F6; border:0; width:32px; height:32px; border-radius:9px;
    cursor:pointer; font-size:16px; color:#4B5563; line-height:1;
  }
  .modal-head button:hover{ background:#E5E7EB; }
  .modal-isi{ padding:17px 18px; overflow-y:auto; flex:1; }
  .modal-kaki{
    padding:13px 18px; border-top:1px solid #EEF0F3;
    display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap;
  }

  .info-garis{
    display:flex; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px dashed #EEF0F3; font-size:13px;
  }
  .info-garis:last-child{ border-bottom:0; }
  .info-garis .k{ color:var(--text-lembut); font-weight:600; }
  .info-garis .v{ font-weight:700; text-align:right; }

  .peringatan{
    background:var(--merah-bg); border:1px solid #FECACA; color:#B91C1C;
    padding:11px 13px; border-radius:10px; font-size:12.5px;
    font-weight:600; margin-bottom:13px; line-height:1.45;
  }
  .info-box{
    background:#EFF6FF; border:1px solid #BFDBFE; color:#1E40AF;
    padding:11px 13px; border-radius:10px; font-size:12.5px;
    font-weight:600; margin-bottom:13px; line-height:1.45;
  }
  .tooltip-kecil{
    font-size:11px; color:var(--text-lembut); margin-top:4px; font-weight:500;
  }

  .divider{ height:1px; background:#EEF0F3; margin:14px 0; }

  @media(max-width:640px){
    .header-info .nama{ font-size:13px; }
    .header-info .jabatan{ font-size:10.5px; }
    #appContent{ padding-top:72px; }
  }
</style>
</head>
<body>

<main id="appContent"></main>
<nav id="bottomNav"></nav>
<div id="toastBox"></div>

<div id="modalOverlay">

</div>

  /* ══════════════════════════════════════════════
     HELPER UMUM
     ══════════════════════════════════════════════ */
  function $(id){ return document.getElementById(id); }

  function escapeHtml(t){
    if(t === null || t === undefined) return '-';
    return String(t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function v(x){ return (x === null || x === undefined || x === '') ? '-' : x; }

  function formatRupiah(angka){
    const n = Number(angka) || 0;
    const neg = n < 0;
    const s = Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    return (neg ? '-Rp ' : 'Rp ') + s;
  }

  function formatTanggal(date){
    if(!date) return '-';
    let d;
    if(typeof date === 'string' && /^\d{4}-\d{2}-\d{2}/.test(date)){
      const p = date.substring(0,10).split('-');
      d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    } else {
      d = new Date(date);
    }
    if(isNaN(d.getTime())) return String(date);
    const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
  }

  function formatTanggalISO(date){
    const d = date ? new Date(date) : new Date();
    if(isNaN(d.getTime())) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const t = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + t;
  }

  function hariIni(){ return formatTanggalISO(new Date()); }

  function generateUUID(){
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      const r = Math.random()*16|0;
      const val = c === 'x' ? r : (r & 0x3 | 0x8);
      return val.toString(16);
    });
  }

  function showToast(pesan, tipe){
    const box = $('toastBox');
    if(!box) return;
    const t = tipe || 'info';
    const ikon = { sukses:'✅', error:'❌', warning:'⚠️', info:'ℹ️' }[t] || 'ℹ️';
    const el = document.createElement('div');
    el.className = 'toast toast-' + t;
    el.innerHTML = '<span>' + ikon + '</span><span>' + escapeHtml(pesan) + '</span>';
    box.appendChild(el);
    setTimeout(function(){
      el.classList.add('hilang');
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, 3000);
  }

     MODAL
     ══════════════════════════════════════════════ */
  let modalKakiHandler = null;

  function showModal(judul, konten, opsi){
    opsi = opsi || {};
    $('modalJudul').textContent = judul;
    $('modalIsi').innerHTML = konten;

    const kaki = $('modalKaki');
    kaki.innerHTML = '';

    const tombol = opsi.tombol || [];
    if(tombol.length){
      tombol.forEach(function(tb){
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn ' + (tb.kelas || 'btn-abu');
        b.textContent = tb.teks || 'OK';
        if(tb.id) b.id = tb.id;
        b.addEventListener('click', function(){
          if(typeof tb.aksi === 'function') tb.aksi();
          if(tb.tutup !== false) tutupModal();
        });
        kaki.appendChild(b);
      });
    } else {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-abu'; b.textContent = 'Tutup';
      b.addEventListener('click', tutupModal);
      kaki.appendChild(b);
    }

    $('modalOverlay').classList.add('tampil');
    if(typeof opsi.setelah === 'function') setTimeout(opsi.setelah, 40);
  }

  function tutupModal(){
    $('modalOverlay').classList.remove('tampil');
    $('modalIsi').innerHTML = '';
    $('modalKaki').innerHTML = '';

  function konfirmasi(judul, pesan, onYa, teksYa, kelasYa){
    showModal(judul,
      '<div class="peringatan">' + escapeHtml(pesan) + '</div>',
      {
        tombol: [
          { teks:'Batal', kelas:'btn-abu', aksi: function(){} },
          { teks: teksYa || 'Ya, Lanjutkan', kelas: kelasYa || 'btn-primary',
            aksi: function(){ if(typeof onYa === 'function') onYa(); } }
        ]
      }
    );
  }

  /* ══════════════════════════════════════════════
     SESSION
     ══════════════════════════════════════════════ */
  function getSession(){
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      const s = JSON.parse(raw);
      if(!s || !s.user_id) return null;
      const batas = s.is_demo ? 15*60*1000 : 8*60*60*1000;
      if(s.login_time && (Date.now() - s.login_time) > batas){
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
      return s;
    } catch(e){
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
  }

  function logout(){
    konfirmasi('Keluar', 'Yakin ingin keluar dari aplikasi?', function(){
      localStorage.removeItem(SESSION_KEY);
      window.location.replace('index.html');
    }, 'Ya, Keluar', 'btn-primary');
  }

  function isDemo(){
    const s = getSession();
    return !!(s && s.is_demo === true);
  }

  /* ══════════════════════════════════════════════
     API WRAPPER
     ══════════════════════════════════════════════ */
  async function apiPost(action, data){
    try {
      const res = await fetch(BACKEND_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain' },
        body: JSON.stringify(Object.assign({ action:action, token:TOKEN }, data || {})),
        redirect:'follow'
      });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, pesan:'Respons tidak valid' }; }
    } catch(e){
      return { ok:false, pesan:'Gagal terhubung ke server' };
    }
  }

  function normalisasiHasil(res){
    if(!res) return { ok:false, pesan:'Tidak ada respons', data:[] };
    if(res.ok === true){
      let d = res.data;
      if(d === null || d === undefined) d = [];
      if(!Array.isArray(d)){
        if(Array.isArray(d.data)) d = d.data;
        else d = [d];
      }
      return { ok:true, pesan:res.pesan || 'OK', data:d };
    }
    return { ok:false, pesan:res.pesan || 'Terjadi kesalahan', data:[] };
  }

  async function ambilData(sheet){
    if(isDemo()){
      return { ok:true, pesan:'Mode demo', data: DUMMY_DATA[sheet] ? DUMMY_DATA[sheet].slice() : [] };
    }
    const res = await apiPost('baca', { sheet:sheet });
    return normalisasiHasil(res);
  }

  async function simpanData(sheet, data){
    if(isDemo()){
      showToast('Mode demo — tidak bisa menyimpan', 'warning');
      return { ok:false, pesan:'Mode demo' };
    }
    const res = await apiPost('tulis', { sheet:sheet, data:data });
    return normalisasiHasil(res);
  }

  async function updateData(sheet, row, data){
    if(isDemo()){
      showToast('Mode demo — tidak bisa mengubah', 'warning');
      return { ok:false, pesan:'Mode demo' };
    }
    const res = await apiPost('update', { sheet:sheet, row:row, data:data });
    return normalisasiHasil(res);
  }

  async function hapusData(sheet, row){
    if(isDemo()){
      showToast('Mode demo — tidak bisa menghapus', 'warning');
      return { ok:false, pesan:'Mode demo' };
    }
    const res = await apiPost('hapus', { sheet:sheet, row:row });
    return normalisasiHasil(res);
  }

        '<div class="label">' + m.meta.label + '</div>' +
        '<div class="ket">' + m.meta.ket + '</div>' +

    });
    html += '</div>';

    const main = $('appContent');
    main.innerHTML = html;
    main.querySelectorAll('.menu-kartu').forEach(function(k){

          else if(aksi === 'password') formResetPassword(user, function(){ renderHalamanManusia(SESSION); });
          else if(aksi === 'hapus') formHapusUser(user, function(){ renderHalamanManusia(SESSION); });
        });
      });
    }
    pasangEvent();
  }

  function ambilDaftarCabang(users){
    const set = new Set();
    (users || []).forEach(function(u){
      if(u && u.kode_cabang && u.kode_cabang !== '-' && String(u.kode_cabang).trim() !== ''){
        set.add(String(u.kode_cabang));
      }
    });
    return Array.from(set).sort();
  }

  function butuhCabang(jabatan){
    const j = String(jabatan || '').toLowerCase();
    return j === 'kepala toko' || j === 'kepala_toko' || j === 'karyawan';
  }

  function pilihanJabatan(selected){
    return ['Owner','Admin','Kepala Toko','Karyawan'].map(function(j){
      return '<option value="' + j + '"' + (selected === j ? ' selected' : '') + '>' + j + '</option>';
    }).join('');
  }

  let pendapatanState = { masuk:true };

  async function renderHalamanPendapatan(session){
    const demo = isDemo();
    const main = $('appContent');
    main.innerHTML = kerangka('Pendapatan Harian', 'Input & lihat pendapatan',

        '<div class="form-grup"><label>Unit</label><input type="number" id="pUnit" min="0" value="0"></div>' +
        '<div class="form-grup"><label>Tips (Rp)</label><input type="number" id="pTips" min="0" value="0"></div>' +
      '</div>' +
      '<div class="form-baris">' +
        '<div class="form-grup"><label>Kasbon (Rp)</label><input type="number" id="pKasbon" min="0" value="0"></div>' +
        '<div class="form-grup"><label>WiFi (Rp)</label><input type="number" id="pWifi" value="1000" readonly></div>' +
      '</div>' +
      '<div class="form-grup" id="wrapAlasan" style="display:none"><label>Alasan</label><select id="pAlasan">' +
        '<option value="">Pilih alasan…</option>' +
        '<option value="izin_istirahat">Izin Istirahat</option>' +
        '<option value="izin_sakit">Izin Sakit</option>' +
        '<option value="libur">Libur</option>' +
        '<option value="mangkir">Mangkir</option>' +
        '<option value="lainnya">Lainnya</option>' +
      '</select></div>' +
      '<div class="preview-box"><span class="label">Total Diterima</span><span class="nilai" id="pPreview">Rp 0</span></div>' +
      '<button type="button" class="btn btn-primary btn-block" id="pSubmit"' + (demo ? ' disabled' : '') + '>Simpan Pendapatan</button>' +
    '</div>';

    const hariIniArr = semuaPend.filter(function(d){
      return String(d.tanggal || '').substring(0,10) === hari;
    });

    html += '<div class="panel"><h3>Pendapatan Hari Ini (' + hariIniArr.length + ')</h3>';
    if(!hariIniArr.length){
      html += '<div class="kosong"><div class="ikon">📭</div>Belum ada data hari ini.</div>';
    } else {
      html += '<div class="tabel-wrap"><table class="data"><thead><tr>' +
        '<th>Nama</th><th>Unit</th><th>Tips</th><th>Bonus</th><th>Kasbon</th><th>WiFi</th><th>Total</th>' +
        '</tr></thead><tbody>';
      hariIniArr.forEach(function(d){
        const unit = Number(d.unit)||0, tips = Number(d.tips)||0, bonus = Number(d.bonus)||0;
        const kasbon = Number(d.kasbon)||0, wifi = Number(d.wifi)||0;
        const total = unit + tips + bonus - kasbon - wifi;
        const tembus = String(d.tembus_target||'').toLowerCase() === 'ya';
        html += '<tr>' +
          '<td>' + escapeHtml(v(d.nama_karyawan)) + (tembus ? ' <span class="badge badge-emas">TEMBUS</span>' : '') + '</td>' +
          '<td>' + unit + '</td><td>' + formatRupiah(tips) + '</td>' +
          '<td class="' + (bonus > 0 ? 'td-hijau' : '') + '">' + formatRupiah(bonus) + '</td>' +
          '<td>' + formatRupiah(kasbon) + '</td><td>' + formatRupiah(wifi) + '</td>' +
          '<td><strong>' + formatRupiah(total) + '</strong></td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    main.innerHTML = kerangka('Pendapatan Harian', 'Input & lihat pendapatan', html, '📈');
    renderNavBawah(session);

    /* --- setup interaktif --- */
    const selCabang = $('pCabang');
    const selKaryawan = $('pKaryawan');

    function isiKaryawan(){
      const cab = selCabang.value;
      const arr = semuaUsers.filter(function(u){
        const uCab = String(u.kode_cabang||'').toUpperCase();
        const uJab = String(u.jabatan||'').toLowerCase();
        return cab && uCab === cab && uJab !== 'owner' && String(u.status||'aktif').toLowerCase() === 'aktif';
      });
      if(!arr.length){
        selKaryawan.innerHTML = '<option value="">Tidak ada karyawan</option>';
        return;
      }
      selKaryawan.innerHTML = '<option value="">Pilih karyawan…</option>' +
        arr.map(function(u){ return '<option value="' + escapeHtml(u.id) + '">' + escapeHtml(u.nama) + '</option>'; }).join('');
    }

    selCabang.addEventListener('change', isiKaryawan);

    const tgMasuk = $('tgMasuk'), tgTidak = $('tgTidak');
    const wrapAlasan = $('wrapAlasan');
    const inUnit = $('pUnit'), inTips = $('pTips'), inKasbon = $('pKasbon'), inWifi = $('pWifi');

    function hitungPreview(){
      const unit = Number(inUnit.value)||0;
      const tips = Number(inTips.value)||0;
      const kasbon = Number(inKasbon.value)||0;
      const wifi = Number(inWifi.value)||0;
      let total;
      if(pendapatanState.masuk) total = unit + tips - kasbon - wifi;
      else total = -kasbon - wifi;
      $('pPreview').textContent = formatRupiah(total);
    }

    function setModeMasuk(masuk){
      pendapatanState.masuk = masuk;
      if(masuk){
        tgMasuk.classList.add('aktif'); tgTidak.classList.remove('aktif');
        inUnit.disabled = false; inTips.disabled = false;
        wrapAlasan.style.display = 'none';
      } else {
        tgTidak.classList.add('aktif'); tgMasuk.classList.remove('aktif');
        inUnit.value = 0; inTips.value = 0;
        inUnit.disabled = true; inTips.disabled = true;
        wrapAlasan.style.display = 'block';
      }
      hitungPreview();
    }

    tgMasuk.addEventListener('click', function(){ setModeMasuk(true); });
    tgTidak.addEventListener('click', function(){ setModeMasuk(false); });
    [inUnit, inTips, inKasbon].forEach(function(el){
      el.addEventListener('input', hitungPreview);
    });

    $('pSubmit').addEventListener('click', async function(){
      if(demo) return;
      const tanggal = $('pTanggal').value || hari;
      const cabang = selCabang.value;
      const idKaryawan = selKaryawan.value;
      const kasbon = Number(inKasbon.value)||0;
      const wifi = 1000;

      if(!cabang){ showToast('Pilih cabang dulu', 'error'); return; }
      if(!idKaryawan){ showToast('Pilih karyawan dulu', 'error'); return; }
      if(!pendapatanState.masuk && !$('pAlasan').value){ showToast('Pilih alasan tidak masuk', 'error'); return; }

      const karyawan = semuaUsers.find(function(u){ return String(u.id) === String(idKaryawan); });
      if(!karyawan){ showToast('Karyawan tidak ditemukan', 'error'); return; }

      // anti-dobel
      const dobel = semuaPend.some(function(d){
        return String(d.tanggal||'').substring(0,10) === String(tanggal).substring(0,10) &&
               String(d.id_karyawan) === String(idKaryawan);
      });
      if(dobel){ showToast('Data karyawan ini sudah ada di tanggal tersebut', 'warning'); return; }

      const unit = pendapatanState.masuk ? (Number(inUnit.value)||0) : 0;
      const tips = pendapatanState.masuk ? (Number(inTips.value)||0) : 0;

      const data = {

      };

      const hasil = await simpanData('Pendapatan_Harian', data);
      if(hasil.ok){

  async function cekTembusTarget(tanggal, cabang){
    const resPend = await ambilData('Pendapatan_Harian');
    if(!resPend.ok) return;
    const semua = resPend.data;
    const barisTanggal = semua.filter(function(d){
      return String(d.tanggal||'').substring(0,10) === String(tanggal).substring(0,10) &&
             String(d.kode_cabang) === String(cabang);
    });
    const totalUnit = barisTanggal.reduce(function(a,d){ return a + (Number(d.unit)||0); }, 0);

    const resTarget = await ambilData('Target_Cabang');
    const targetArr = resTarget.ok ? resTarget.data : [];
    const target = targetArr.find(function(t){ return String(t.kode_cabang) === String(cabang); });
    const targetHarian = target ? (Number(target.target_harian)||0) : 0;

    if(targetHarian > 0 && totalUnit >= targetHarian){
      // ambil bonus dari pengaturan
      const resSet = await ambilData('Pengaturan');
      const setArr = resSet.ok ? resSet.data : [];
      function ambilSet(key, def){
        const f = setArr.find(function(s){ return String(s.key) === key; });
        return f ? (Number(f.value)||def) : def;
      }
      const bonusKT = ambilSet('bonus_kepala_toko', 10000);
      const bonusKry = ambilSet('bonus_karyawan', 5000);

      let totalBonusDiberikan = 0;
      for(const d of barisTanggal){
        const jab = (d.jabatan || '').toLowerCase();
        let b = bonusKry;
        // cari jabatan user
        const resU = await ambilData('Users');
        const us = resU.ok ? resU.data : [];
        const u = us.find(function(x){ return String(x.id) === String(d.id_karyawan); });
        if(u && String(u.jabatan||'').toLowerCase().indexOf('kepala') !== -1) b = bonusKT;

        if(Number(d.bonus) !== b || String(d.tembus_target) !== 'ya'){
          await updateData('Pendapatan_Harian', d._row, { bonus:b, tembus_target:'ya' });
        }
        totalBonusDiberikan += b;
      }
      showToast('🎉 Tembus target! Total bonus Rp ' + totalBonusDiberikan.toLocaleString('id-ID'), 'sukses');
    }
  }

  function formGeneratePayroll(session){
    if(isDemo()){ showToast('Mode demo — tidak bisa generate', 'warning'); return; }
    const html =
      '<div class="form-grup"><label>Periode</label>' +
        '<input type="text" id="pyPeriode" value="' + hariIni().substring(0,7) + '-P1" placeholder="2026-01-P1"></div>' +
      '<div class="form-grup"><label>Kode Cabang</label>' +
        '<input type="text" id="pyCabang" placeholder="Contoh: GROBOGAN" value="' + escapeHtml(session.user_kode_cabang !== '-' ? session.user_kode_cabang : '') + '"></div>';
    showModal('Generate Payroll', html, {
      tombol: [
        { teks:'Batal', kelas:'btn-abu' },
        { teks:'Generate', kelas:'btn-primary', tutup:false, aksi: async function(){
            const periode = $('pyPeriode').value.trim();
            const cabang = $('pyCabang').value.trim().toUpperCase();
            if(!periode || !cabang){ showToast('Periode & cabang wajib diisi', 'error'); return; }

            const resUsers = await ambilData('Users');
            if(!resUsers.ok){ showToast('Gagal ambil data user', 'error'); return; }
            const users = resUsers.data.filter(function(u){
              return String(u.kode_cabang) === cabang && String(u.status||'aktif').toLowerCase() === 'aktif';
            });
            if(!users.length){ showToast('Tidak ada karyawan di cabang ini', 'warning'); return; }

            const resPend = await ambilData('Pendapatan_Harian');
            const pend = resPend.ok ? resPend.data : [];

            let totalSeluruh = 0;
            for(const u of users){
              const baris = pend.filter(function(d){
                return String(d.id_karyawan) === String(u.id) && String(d.periode||'').trim() === ''; // ambil semua
              });
              let unit=0, tips=0, bonus=0, kasbon=0, wifi=0;
              baris.forEach(function(d){
                unit += Number(d.unit)||0; tips += Number(d.tips)||0; bonus += Number(d.bonus)||0;
                kasbon += Number(d.kasbon)||0; wifi += Number(d.wifi)||0;
              });
              const total = unit + tips + bonus - kasbon - wifi;
              totalSeluruh += total;
              await simpanData('Payroll', {
                periode: periode, id_karyawan: u.id, nama_karyawan: u.nama,
                total_payroll: total, status:'draft'
              });
            }
            showToast('Payroll digenerate. Total: ' + formatRupiah(totalSeluruh), 'sukses');
            tutupModal();
            renderHalamanPayroll(session);
          }
        }
      ]
    });
  }

        '<div class="form-grup"><label>Tanggal</label><input type="date" id="lTanggal" value="' + hariIni() + '"></div>' +

        '<button type="button" class="btn btn-primary btn-block" id="lKirim"' + (demo ? ' disabled' : '') + '>Kirim Laporan</button>' +
      '</div>';
    }

    html += '<div class="panel"><h3>Daftar Laporan (' + daftar.length + ')</h3>';
    if(!daftar.length){
      html += '<div class="kosong"><div class="ikon">📭</div>Belum ada laporan.</div>';
    } else {
      html += '<div class="tabel-wrap"><table class="data"><thead><tr>' +
        '<th>Tanggal</th><th>Cabang</th><th>Isi</th><th>Status</th>' +
        '</tr></thead><tbody>';
      daftar.forEach(function(l){
        html += '<tr><td>' + formatTanggal(l.tanggal) + '</td><td>' + escapeHtml(v(l.kode_cabang)) +
          '</td><td>' + escapeHtml(v(l.isi_laporan)) + '</td>' +
          '<td><span class="badge badge-biru">' + escapeHtml(v(l.status)) + '</span></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    main.innerHTML = kerangka('Laporan', 'Laporan harian', html, '📊');
    renderNavBawah(session);

    const btn = $('lKirim');
    if(btn) btn.addEventListener('click', async function(){
      if(demo) return;
      const isi = $('lIsi').value.trim();
      if(!isi){ showToast('Isi laporan wajib', 'error'); return; }
      const data = {
        id_laporan: 'LAP-' + generateUUID().substring(0,6).toUpperCase(),
        tanggal: $('lTanggal').value || hariIni(),
        kode_cabang: session.user_kode_cabang || '-',
        id_karyawan: session.user_id,
        nama_karyawan: session.user_nama,
        isi_laporan: isi, status:'dikirim'
      };
      const hasil = await simpanData('Laporan', data);
      if(hasil.ok){
        showToast('Laporan terkirim', 'sukses');
        renderHalamanLaporan(session);
      } else showToast(hasil.pesan || 'Gagal', 'error');
    });
  }

  /* ══════════════════════════════════════════════
     HALAMAN: PENGATURAN
     ══════════════════════════════════════════════ */
  async function renderHalamanPengaturan(session){
    const demo = isDemo();
    const main = $('appContent');
    main.innerHTML = kerangka('Pengaturan', 'Target & bonus',
      '<div class="loading"><div class="spinner"></div>Memuat…</div>', '⚙️');

    const hasilSet = await ambilData('Pengaturan');
    const hasilTarget = await ambilData('Target_Cabang');
    const setArr = hasilSet.ok ? hasilSet.data : [];
    const targetArr = hasilTarget.ok ? hasilTarget.data : [];

    function ambilSet(key, def){
      const f = setArr.find(function(s){ return String(s.key) === key; });
      return f ? String(f.value) : def;
    }

    let html = '<div class="panel"><h3>Pengaturan Bonus & WiFi</h3>';
    if(demo) html += '<div class="info-box">Mode demo — tidak bisa mengubah.</div>';
    html +=
      '<div class="form-grup"><label>Bonus Kepala Toko (Rp)</label><input type="number" id="setBonusKT" value="' + escapeHtml(ambilSet('bonus_kepala_toko','10000')) + '"></div>' +
      '<div class="form-grup"><label>Bonus Karyawan (Rp)</label><input type="number" id="setBonusKry" value="' + escapeHtml(ambilSet('bonus_karyawan','5000')) + '"></div>' +
      '<div class="form-grup"><label>WiFi Harian (Rp)</label><input type="number" id="setWifi" value="' + escapeHtml(ambilSet('wifi_harian','1000')) + '"></div>' +
      '<button type="button" class="btn btn-primary btn-block" id="setSimpan"' + (demo ? ' disabled' : '') + '>Simpan Pengaturan</button>' +
    '</div>';

    html += '<div class="panel"><h3>Target Cabang</h3>';
    targetArr.forEach(function(t, idx){
      html += '<div class="form-baris" style="margin-bottom:8px">' +
        '<div class="form-grup"><label>' + escapeHtml(v(t.kode_cabang)) + '</label>' +
          '<input type="number" id="tgt_' + idx + '" value="' + escapeHtml(t.target_harian||0) + '"' + (demo?' disabled':'') + '></div>' +
        '<div class="form-grup"><label>&nbsp;</label>' +
          '<button type="button" class="btn btn-abu btn-sm btn-block" data-tgt="' + idx + '"' + (demo?' disabled':'') + '>Simpan</button></div>' +
      '</div>';
    });
    html += '</div>';

    main.innerHTML = kerangka('Pengaturan', 'Target & bonus', html, '⚙️');
    renderNavBawah(session);

    const btn = $('setSimpan');
    if(btn) btn.addEventListener('click', async function(){
      if(demo) return;
      const items = [
        { key:'bonus_kepala_toko', value: $('setBonusKT').value },
        { key:'bonus_karyawan', value: $('setBonusKry').value },
        { key:'wifi_harian', value: $('setWifi').value }
      ];
      // cari _row
      for(const it of items){
        const f = setArr.find(function(s){ return String(s.key) === it.key; });
        if(f) await updateData('Pengaturan', f._row, { value: it.value });
        else await simpanData('Pengaturan', it);
      }
      showToast('Pengaturan tersimpan', 'sukses');
      renderHalamanPengaturan(session);
    });

    main.querySelectorAll('[data-tgt]').forEach(function(b){
      b.addEventListener('click', async function(){
        if(demo) return;
        const idx = b.getAttribute('data-tgt');
        const t = targetArr[idx];
        const val = $('tgt_' + idx).value;
        const hasil = await updateData('Target_Cabang', t._row, { target_harian: Number(val)||0 });
        if(hasil.ok){ showToast('Target diperbarui', 'sukses'); renderHalamanPengaturan(session); }
        else showToast(hasil.pesan || 'Gagal', 'error');
      });
    });
  }

  /* ══════════════════════════════════════════════
     HALAMAN: PROFIL
     ══════════════════════════════════════════════ */
  function renderHalamanProfil(session){
    const main = $('appContent');
    const demo = session.is_demo === true;
    const html =
      '<div class="panel"><h3>Data Akun</h3>' +
        '<div class="info-garis"><span class="k">ID Pengguna</span><span class="v">' + escapeHtml(v(session.user_id)) + '</span></div>' +
        '<div class="info-garis"><span class="k">Nama</span><span class="v">' + escapeHtml(v(session.user_nama)) + '</span></div>' +
        '<div class="info-garis"><span class="k">Jabatan</span><span class="v">' + escapeHtml(v(session.user_jabatan)) + '</span></div>' +
        '<div class="info-garis"><span class="k">Cabang</span><span class="v">' + escapeHtml(v(session.user_kode_cabang)) + '</span></div>' +
        '<div class="info-garis"><span class="k">Mode</span><span class="v">' + (demo ? 'DEMO' : 'AKUN RESMI') + '</span></div>' +
        '<div class="info-garis"><span class="k">Waktu Login</span><span class="v">' + (session.login_time ? new Date(session.login_time).toLocaleString('id-ID') : '-') + '</span></div>' +
      '</div>' +
      '<div class="panel"><h3>Keamanan</h3>' +
        '<button type="button" class="btn btn-outline btn-block" id="profKeluar">🚪 Keluar dari Akun</button>' +
      '</div>';

    main.innerHTML = kerangka('Profil', 'Data akun Anda', html, '👤');
    renderNavBawah(session);
    $('profKeluar').addEventListener('click', logout);
  }

  /* ══════════════════════════════════════════════
     INISIALISASI
     ══════════════════════════════════════════════ */
  document.addEventListener('DOMContentLoaded', function(){
    const session = getSession();
    if(!session){
      localStorage.removeItem(SESSION_KEY);
      window.location.replace('index.html');
      return;
    }
    SESSION = session;
    renderHeader(session);
    renderMenu(session);
  });

  /* tombol tutup modal */
  document.addEventListener('DOMContentLoaded', function(){
    const overlay = $('modalOverlay');
    if(overlay){
      overlay.addEventListener('click', function(ev){ if(ev.target === overlay) tutupModal(); });
      const btn = $('modalTutup');
      if(btn) btn.addEventListener('click', tutupModal);
    }
  });

})();
</script>
</body>
</html>
