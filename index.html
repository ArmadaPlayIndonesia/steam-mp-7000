<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STEAM MP 7000 — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://omg10.com/4/11785165"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(160deg,#C8102E 0%,#8B0000 35%,#ffffff 35.1%,#F9FAFB 100%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:#1F2937;
}
.logo-svg{
  display:block;
  margin:0 auto 16px;
  filter:drop-shadow(0 4px 12px rgba(200,16,46,0.3)) drop-shadow(0 0 20px rgba(251,191,36,0.3));
  transition:transform 0.3s;
}
.logo-svg:hover{transform:scale(1.05)}
.card{
  background:#fff;
  width:100%;
  max-width:400px;
  border-radius:16px;
  padding:28px 22px 24px;
  box-shadow:0 10px 40px rgba(0,0,0,0.18),0 2px 8px rgba(0,0,0,0.08);
  animation:fadeUp 0.5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.title{
  font-size:22px;
  font-weight:800;
  color:#C8102E;
  text-align:center;
  letter-spacing:0.5px;
}
.tagline{
  font-size:11px;
  color:#6B7280;
  text-align:center;
  margin-top:4px;
  margin-bottom:22px;
  font-weight:500;
  font-style:italic;
  line-height:1.4;
}
.field{margin-bottom:16px;position:relative}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:#374151;
  margin-bottom:6px;
  letter-spacing:0.3px;
}
.field input{
  width:100%;
  padding:14px 44px 14px 14px;
  font-size:16px;
  font-family:'Poppins',sans-serif;
  border:1.5px solid #E5E7EB;
  border-radius:8px;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
  background:#F9FAFB;
  color:#1F2937;
  min-height:48px;
}
.field input:focus{
  border-color:#C8102E;
  background:#fff;
  box-shadow:0 0 0 3px rgba(200,16,46,0.1);
}
.toggle-pass{
  position:absolute;
  right:8px;
  bottom:6px;
  width:36px;
  height:36px;
  border:none;
  background:transparent;
  font-size:18px;
  cursor:pointer;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6B7280;
}
.toggle-pass:active{background:#F3F4F6}
.btn{
  width:100%;
  padding:14px;
  font-size:15px;
  font-weight:700;
  font-family:'Poppins',sans-serif;
  border-radius:8px;
  border:none;
  cursor:pointer;
  transition:all 0.2s;
  min-height:48px;
  letter-spacing:0.5px;
}
.btn-primary{
  background:linear-gradient(135deg,#C8102E,#A00D25);
  color:#fff;
  box-shadow:0 4px 14px rgba(200,16,46,0.35);
}
.btn-primary:active{transform:scale(0.98)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-outline{
  background:#fff;
  color:#B45309;
  border:2px solid #F59E0B;
  margin-top:10px;
}
.btn-outline:active{background:#FEF3C7}
.error-msg{
  background:#FEF2F2;
  color:#B91C1C;
  font-size:12px;
  padding:10px 12px;
  border-radius:8px;
  margin-bottom:14px;
  border-left:3px solid #C8102E;
  display:none;
  font-weight:500;
}
.error-msg.show{display:block;animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.footer{
  margin-top:22px;
  font-size:11px;
  color:#9CA3AF;
  text-align:center;
  font-weight:500;
}
.spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,0.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:16px;
  backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;
  border-radius:16px;
  width:100%;
  max-width:400px;
  padding:22px;
  animation:fadeUp 0.3s ease;
  max-height:90vh;
  overflow-y:auto;
}
.modal h3{
  font-size:17px;
  color:#C8102E;
  margin-bottom:4px;
  font-weight:700;
}
.modal p.sub{
  font-size:12px;
  color:#6B7280;
  margin-bottom:16px;
}
.role-list{display:flex;flex-direction:column;gap:10px}
.role-btn{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border:1.5px solid #E5E7EB;
  border-radius:10px;
  background:#fff;
  cursor:pointer;
  transition:all 0.2s;
  text-align:left;
  font-family:'Poppins',sans-serif;
  min-height:56px;
}
.role-btn:active{border-color:#F59E0B;background:#FFFBEB}
.role-ico{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#C8102E,#8B0000);
  color:#FBBF24;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.role-info{flex:1}
.role-info .rn{font-size:14px;font-weight:700;color:#1F2937}
.role-info .rd{font-size:11px;color:#6B7280;margin-top:2px}
.modal-close{
  margin-top:14px;
  width:100%;
  padding:12px;
  background:#F3F4F6;
  border:none;
  border-radius:8px;
  font-family:'Poppins',sans-serif;
  font-size:14px;
  font-weight:600;
  color:#374151;
  cursor:pointer;
  min-height:44px;
}
@media(min-width:641px){
  .card{padding:34px 30px 28px}
  .title{font-size:26px}
  .tagline{font-size:12px}
  .logo-svg{width:90px;height:90px}
}
@media(min-width:1025px){
  body{background:linear-gradient(135deg,#C8102E 0%,#8B0000 40%,#ffffff 40.1%,#F9FAFB 100%)}
}
</style>
</head>
<body>

<!-- LOGO SVG INLINE -->
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#gradLogo)" stroke="url(#gradGold)" stroke-width="3"/>
  <g fill="url(#gradGold)">
    <path d="M20 50 Q20 42 28 42 L32 42 L35 38 L45 38 L48 42 L52 42 Q60 42 60 50 L60 54 Q60 58 56 58 L24 58 Q20 58 20 54 Z"/>
    <circle cx="26" cy="58" r="6" fill="none" stroke="url(#gradGold)" stroke-width="2"/>
    <circle cx="26" cy="58" r="2" fill="url(#gradGold)"/>
    <circle cx="54" cy="58" r="6" fill="none" stroke="url(#gradGold)" stroke-width="2"/>
    <circle cx="54" cy="58" r="2" fill="url(#gradGold)"/>
    <path d="M32 38 L30 30 L36 30" stroke="url(#gradGold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M48 42 Q52 35 56 32" stroke="url(#gradGold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="56" cy="32" r="2.5" fill="url(#gradGold)"/>
    <circle cx="58" cy="26" r="2" fill="#FBBF24" opacity="0.7"/>
    <circle cx="62" cy="24" r="1.5" fill="#FBBF24" opacity="0.5"/>
    <circle cx="60" cy="20" r="1.8" fill="#FBBF24" opacity="0.6"/>
  </g>
</svg>

<div class="card" id="loginCard">
  <h1 class="title">STEAM MP 7000</h1>
  <p class="tagline">Jujur Disiplin Tanggung Jawab<br>HARGA MATI !</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field">
    <label for="inputId">ID Pengguna</label>
    <input type="text" id="inputId" placeholder="Masukkan ID" autocomplete="username" inputmode="text">
  </div>

  <div class="field">
    <label for="inputPass">Password</label>
    <input type="password" id="inputPass" placeholder="Masukkan password" autocomplete="current-password">
    <button class="toggle-pass" id="togglePass" type="button" aria-label="Tampilkan password">👁</button>
  </div>

  <button class="btn btn-primary" id="btnMasuk">MASUK</button>
  <button class="btn btn-outline" id="btnDemo">COBA DEMO</button>

  <p class="footer">Steam MP Manajemen &copy; 2026</p>
</div>

<!-- MODAL DEMO -->
<div class="modal-overlay" id="modalDemo">
  <div class="modal">
    <h3>Pilih Mode Demo</h3>
    <p class="sub">Coba semua fitur tanpa mengubah data. Hanya untuk lihat.</p>
    <div class="role-list">
      <button class="role-btn" data-role="Owner" data-label="Owner">
        <div class="role-ico">OW</div>
        <div class="role-info"><div class="rn">Owner</div><div class="rd">Akses penuh 11 menu</div></div>
      </button>
      <button class="role-btn" data-role="Admin" data-label="Admin">
        <div class="role-ico">AD</div>
        <div class="role-info"><div class="rn">Admin</div><div class="rd">8 menu operasional</div></div>
      </button>
      <button class="role-btn" data-role="Kepala Toko" data-label="Kepala Toko">
        <div class="role-ico">KT</div>
        <div class="role-info"><div class="rn">Kepala Toko</div><div class="rd">8 menu cabang</div></div>
      </button>
      <button class="role-btn" data-role="Karyawan" data-label="Karyawan">
        <div class="role-ico">KR</div>
        <div class="role-info"><div class="rn">Karyawan</div><div class="rd">5 menu harian</div></div>
      </button>
    </div>
    <button class="modal-close" id="closeDemo">Batal</button>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURASI
============================================================ */
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwWiWeesEtkkzsbZrEb4I1WYAj8LPVY73H5ZZo1kB8UjWCcL2v5IbH3WvfZqblkEhMu/exec';
var TOKEN = 'steam-mp-7000-2026';
var SESSION_KEY = 'steam_mp_session';

/* ============================================================
   API WRAPPER
============================================================ */
function apiPost(action, data) {
  return fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ action: action, token: TOKEN }, data)),
    redirect: 'follow'
  })
  .then(function(res){ return res.text(); })
  .then(function(text){
    try { return JSON.parse(text); }
    catch(e){ return { ok:false, pesan:'Respons tidak valid' }; }
  })
  .catch(function(e){
    return { ok:false, pesan:'Gagal terhubung ke server' };
  });
}

/* ============================================================
   SESSION
============================================================ */
function getSession() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.login_time) return null;
    var maxAge = s.is_demo ? (15 * 60 * 1000) : (8 * 60 * 60 * 1000);
    if (Date.now() - s.login_time > maxAge) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s;
  } catch(e) {
    localStorage.removeItem(SESSION_KEY);
    return null;
  }
}

function saveSession(obj) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch(e){}
}

/* ============================================================
   IKLAN
============================================================ */
function tampilkanIklan(jenis) {
  var isWebView = navigator.userAgent.indexOf('wv') > -1 ||
                  typeof window.AndroidAds !== 'undefined';
  try {
    if (isWebView && window.AndroidAds) {
      if (jenis === 'rewarded') {
        window.AndroidAds.showRewarded();
      } else {
        window.AndroidAds.showInterstitial();
      }
    }
    if (jenis === 'interstitial') {
      localStorage.setItem('last_ad', Date.now().toString());
    }
    return true;
  } catch(e) {
    console.error('Iklan error:', e);
    return true;
  }
}

/* ============================================================
   UI HELPERS
============================================================ */
function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

/* ============================================================
   DOM READY
============================================================ */
document.addEventListener('DOMContentLoaded', function() {
  // Cek session SEKALI
  var session = getSession();
  if (session) {
    window.location.replace('dashboard.html');
    return;
  }

  // Toggle password
  document.getElementById('togglePass').addEventListener('click', function() {
    var inp = document.getElementById('inputPass');
    var t = inp.type === 'password' ? 'text' : 'password';
    inp.type = t;
    this.textContent = t === 'password' ? '👁' : '🙈';
  });

  // Enter key
  document.getElementById('inputPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btnMasuk').click();
  });
  document.getElementById('inputId').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('inputPass').focus();
  });

  // ===== LOGIN =====
  document.getElementById('btnMasuk').addEventListener('click', function() {
    var id = document.getElementById('inputId').value.trim();
    var pass = document.getElementById('inputPass').value.trim();
    hideError();

    if (!id) { showError('ID tidak boleh kosong'); return; }
    if (!pass) { showError('Password tidak boleh kosong'); return; }

    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Memeriksa...';

    apiPost('baca', { sheet: 'Users' }).then(function(res) {
      if (!res || !res.ok) {
        btn.disabled = false;
        btn.textContent = 'MASUK';
        showError(res && res.pesan ? res.pesan : 'Gagal memuat data user');
        return;
      }
      var users = res.data || [];
      var found = null;
      for (var i = 0; i < users.length; i++) {
        var u = users[i];
        var uid = String(u.id || '').trim();
        var upass = String(u.password || '').trim();
        var status = String(u.status || '').toLowerCase();
        var dhapus = (u.dihapus === true || String(u.dihapus).toLowerCase() === 'true');
        if (uid === id && upass === pass && status === 'aktif' && !dhapus) {
          found = u;
          break;
        }
      }

      if (!found) {
        btn.disabled = false;
        btn.textContent = 'MASUK';
        showError('ID atau Password salah');
        return;
      }

      var session = {
        user_id: found.id,
        user_nama: found.nama || found.id,
        user_jabatan: found.jabatan || 'Karyawan',
        kode_cabang: found.kode_cabang || '-',
        is_demo: false,
        login_time: Date.now()
      };
      saveSession(session);

      // Iklan interstitial kalau bukan Owner
      if (String(found.jabatan) !== 'Owner') {
        tampilkanIklan('interstitial');
      }

      window.location.replace('dashboard.html');
    });
  });

  // ===== DEMO =====
  var modalDemo = document.getElementById('modalDemo');
  document.getElementById('btnDemo').addEventListener('click', function() {
    modalDemo.classList.add('show');
  });
  document.getElementById('closeDemo').addEventListener('click', function() {
    modalDemo.classList.remove('show');
  });
  modalDemo.addEventListener('click', function(e) {
    if (e.target === modalDemo) modalDemo.classList.remove('show');
  });

  var roleBtns = document.querySelectorAll('.role-btn');
  for (var i = 0; i < roleBtns.length; i++) {
    roleBtns[i].addEventListener('click', function() {
      var role = this.getAttribute('data-role');
      var label = this.getAttribute('data-label');
      var session = {
        user_id: 'demo_' + role.toLowerCase().replace(/\s/g,'_'),
        user_nama: 'Demo ' + label,
        user_jabatan: label,
        kode_cabang: '-',
        is_demo: true,
        login_time: Date.now()
      };
      saveSession(session);
      // TIDAK fetch, TIDAK iklan
      window.location.replace('dashboard.html');
    });
  }
});
</script>
</body>
</html>
