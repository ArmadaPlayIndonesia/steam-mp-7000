/* ============================================================

   ============================================================ */
function getSession() {
  try {
    var raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.login_time || !s.user_id) return null;
    var age = Date.now() - Number(s.login_time);
    var maxAge = s.is_demo ? (5*60*1000) : (8*60*60*1000);
    if (age > maxAge) { hapusSession(); return null; }
    return s;
  } catch (e) { return null; }
}
function hapusSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
}

var S = getSession();
if (!S || !S.user_id) {
  window.location.href = 'index.html';
}

function isDemo()      { return S && S.is_demo === true; }
function isOwner()     { return S && S.user_jabatan === 'Owner'; }
function isAdmin()     { return S && S.user_jabatan === 'Admin'; }
function isKepalaToko(){ return S && S.user_jabatan === 'Kepala Toko'; }

/* ============================================================
   HELPER
   ============================================================ */
function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function todayStr() {
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
function nowISO() { return new Date().toISOString(); }
function fmtRupiah(n) {
  n = Number(n) || 0;
  return 'Rp ' + n.toLocaleString('id-ID');
}
function fmtAngka(n) {
  n = Number(n) || 0;
  return n.toLocaleString('id-ID');
}
function generateSubmissionId(prefix) {
  var t = Date.now().toString(36).toUpperCase();
  var r = Math.random().toString(36).substring(2,6).toUpperCase();
  return (prefix||'SUB') + '-' + t + '-' + r;
}
function showToast(msg, type) {
  var box = document.getElementById('toastBox');
  var t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(function() {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(function(){ t.remove(); }, 320);
  }, 2600);
}
function bukaModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function tutupModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalContent').innerHTML = '';
}

/* ============================================================
   API + CACHE
   ============================================================ */
var CACHE = {};
var CACHE_TTL = 5 * 60 * 1000;

async function apiPost(action, data) {
  try {
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    var res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    });
    var text = await res.text();
    try { return JSON.parse(text); }
    catch (e) { return { ok:false, pesan:'Respon server tidak valid', data:[] }; }
  } catch (e) {
    return { ok:false, pesan:'Koneksi gagal: ' + e.message, data:[] };
  }
}

async function ambilData(sheet, force) {
  if (isDemo()) {
    return { ok:true, data: DUMMY_DATA[sheet] || [], pesan:'demo' };
  }
  var now = Date.now();
  if (!force && CACHE[sheet] && (now - CACHE[sheet].time) < CACHE_TTL) {
    return CACHE[sheet].result;
  }
  var r = await apiPost('baca', { sheet: sheet });
  CACHE[sheet] = { result: r, time: now };
  return r;
}

async function simpanData(sheet, data) {
  if (isDemo()) {
    showToast('Mode demo: data tidak tersimpan', 'warning');
    return { ok:false, pesan:'demo' };
  }
  var r = await apiPost('tulis_unik', { sheet: sheet, data: data });
  if (r && r.ok) CACHE[sheet] = null;
  return r;
}
async function updateData(sheet, row, data) {
  if (isDemo()) {
    showToast('Mode demo: tidak bisa update', 'warning');
    return { ok:false, pesan:'demo' };
  }
  var r = await apiPost('update', { sheet: sheet, row: row, data: data });
  if (r && r.ok) CACHE[sheet] = null;
  return r;
}
async function hapusData(sheet, row) {
  if (isDemo()) {
    showToast('Mode demo: tidak bisa hapus', 'warning');
    return { ok:false, pesan:'demo' };
  }
  var r = await apiPost('hapus', { sheet: sheet, row: row });
  if (r && r.ok) CACHE[sheet] = null;
  return r;
}

function getAccRoleSekarang(jabatanPengaju, status) {
  if (jabatanPengaju === 'Karyawan') {
    if (status === 'menunggu') return 'Kepala Toko';
    if (status === 'disetujui_kt') return 'Admin';
    if (status === 'disetujui_admin') return 'Owner';
  }
  if (jabatanPengaju === 'Kepala Toko') {
    if (status === 'menunggu') return 'Admin';
    if (status === 'disetujui_admin') return 'Owner';
  }
  if (jabatanPengaju === 'Admin') {
    if (status === 'menunggu') return 'Owner';
  }
  return null;
}
function bolehAcc(jabatanUser, jabatanPengaju, status) {
  return getAccRoleSekarang(jabatanPengaju, status) === jabatanUser;
}
function getStatusSetelahAcc(status, jabatanYangAcc) {
  if (jabatanYangAcc === 'Kepala Toko') return 'disetujui_kt';
  if (jabatanYangAcc === 'Admin') return 'disetujui_admin';
  if (jabatanYangAcc === 'Owner') return 'disetujui';
  return status;
}

  var nav = document.getElementById('bottomNav');

  var mapNav = {
    'pendapatan': 'pendapatan',
    'pengajuan': 'pengajuan',
    'profil': 'profil'
  };
  var activeNav = mapNav[activeId] || activeId;
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var isAct = (activeNav === it.id);
    html += '<button class="nav-item' + (isAct?' active':'') + '" onclick="klikNav(\'' + it.id + '\')">' +
      '<span class="nav-icon">' + it.icon + '</span>' +
      '<span class="nav-label">' + esc(it.label) + '</span>' +
    '</button>';
  }
  nav.innerHTML = html;
}

  if (id === 'payroll' && bisaIklan() && HALAMAN_AKTIF !== 'payroll') {
    paksaIklan(function() { navigasi(id); });
    return;
  }
  navigasi(id);
}

  var prom = [];
  var perluMotivasi = isOwner() || isAdmin();
  var perluDana = isOwner() || isAdmin();
  if (perluMotivasi) prom.push(ambilData('Motivasi'));
  if (perluDana) prom.push(ambilData('Dana_Expansi'));
  prom.push(ambilData('Pengaturan'));
  prom.push(ambilData('Pendapatan_Harian'));
  var hasil = await Promise.all(prom);

  var motivasi = null, dana = null, pengaturan = [], pendapatan = [];
  var idx = 0;
  if (perluMotivasi) { motivasi = (hasil[idx].data||[])[0]; idx++; }
  if (perluDana) { dana = (hasil[idx].data||[]); idx++; }
  pengaturan = (hasil[idx].data||[]); idx++;
  pendapatan = (hasil[idx].data||[]);

  // Statistik hari ini

   PENDAPATAN OWNER
   ============================================================ */
async function renderPendapatanOwner() {
  var main = document.getElementById('mainContent');
  var r1 = await ambilData('Pendapatan_Harian');
  var r2 = await ambilData('Pengeluaran');
  var r3 = await ambilData('Target_Cabang');
  var pendapatan = r1.data || [];
  var pengeluaran = r2.data || [];
  var target = r3.data || [];

  var today = todayStr();
  var bulanIni = today.slice(0,7);

  var totalUnit = 0, totalTips = 0;
  var perCabang = {};
  pendapatan.forEach(function(p) {
    if (String(p.dihapus||'').toLowerCase() === 'true') return;
    if (String(p.tanggal||'').slice(0,7) !== bulanIni) return;
    var kc = p.kode_cabang || '-';
    if (!perCabang[kc]) perCabang[kc] = { unit:0, tips:0, pengeluaran:0 };
    perCabang[kc].unit += Number(p.unit)||0;
    perCabang[kc].tips += Number(p.tips)||0;
    totalUnit += Number(p.unit)||0;
    totalTips += Number(p.tips)||0;
  });
  var totalPengeluaran = 0;
  pengeluaran.forEach(function(p) {
    if (String(p.dihapus||'').toLowerCase() === 'true') return;
    if (String(p.tanggal||'').slice(0,7) !== bulanIni) return;
    var kc = p.kode_cabang || '-';
    if (!perCabang[kc]) perCabang[kc] = { unit:0, tips:0, pengeluaran:0 };
    perCabang[kc].pengeluaran += Number(p.jumlah)||0;
    totalPengeluaran += Number(p.jumlah)||0;
  });

  var HARGAPERUNIT_OWNER = 4000;
  var totalOwner = (totalUnit * HARGAPERUNIT_OWNER) - totalPengeluaran;

  var html = '';
  html += '<div class="card"><div class="card-title">📊 Pendapatan Owner — ' + esc(bulanIni) + '</div>';
  html += '<div class="kv-row"><span class="k">Total Unit Cabang</span><span class="v">' + fmtAngka(totalUnit) + '</span></div>';
  html += '<div class="kv-row"><span class="k">Total Tips</span><span class="v">' + fmtRupiah(totalTips) + '</span></div>';
  html += '<div class="kv-row"><span class="k">Total Pengeluaran</span><span class="v">' + fmtRupiah(totalPengeluaran) + '</span></div>';
  html += '<div class="divider"></div>';
  html += '<div class="kv-row"><span class="k">Pendapatan Owner (×' + fmtAngka(HARGAPERUNIT_OWNER) + ')</span><span class="v text-merah">' + fmtRupiah(totalOwner) + '</span></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-title">Per Cabang</div>';
  var kcList = Object.keys(perCabang);
  if (kcList.length === 0) {
    html += '<div class="empty">Belum ada data bulan ini</div>';
  } else {
    html += '<div class="table-wrap"><table class="table"><thead><tr><th>Cabang</th><th>Unit</th><th>Tips</th><th>Pengeluaran</th><th>Owner</th></tr></thead><tbody>';
    kcList.forEach(function(kc) {
      var c = perCabang[kc];
      var own = (c.unit * HARGAPERUNIT_OWNER) - c.pengeluaran;
      html += '<tr><td><strong>' + esc(kc) + '</strong></td><td>' + fmtAngka(c.unit) + '</td><td>' + fmtRupiah(c.tips) + '</td><td>' + fmtRupiah(c.pengeluaran) + '</td><td><strong class="text-merah">' + fmtRupiah(own) + '</strong></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  main.innerHTML = html;
}

function previewOperasional(users, cabangOpts) {
  var tanggal = document.getElementById('opTanggal').value;
  var kode = document.getElementById('opCabang').value;
  var totalUnit = Number(document.getElementById('opTotalUnit').value) || 0;
  var totalTips = Number(document.getElementById('opTotalTips').value) || 0;
  var tembus = document.getElementById('opTembus').value;

  if (!tanggal || !kode) { showToast('Tanggal & cabang wajib', 'error'); return; }
  if (totalUnit <= 0) { showToast('Total unit harus > 0', 'error'); return; }

  // Cari karyawan cabang ini
  var anggota = users.filter(function(u) {
    if (String(u.dihapus||'').toLowerCase() === 'true') return false;
    if (String(u.status||'').toLowerCase() !== 'aktif') return false;
    if (String(u.kode_cabang||'') !== kode) return false;
    var j = u.jabatan;
    return j === 'Karyawan' || j === 'Kepala Toko';
  });

  if (anggota.length === 0) { showToast('Tidak ada anggota di cabang ini', 'error'); return; }

  // Preview: anggap semua masuk
  var jumlahMasuk = anggota.length;
  var unitPer = Math.floor(totalUnit / jumlahMasuk);
  var tipsPer = Math.floor(totalTips / jumlahMasuk);
  var sisaU = totalUnit - (unitPer * jumlahMasuk);
  var sisaT = totalTips - (tipsPer * jumlahMasuk);

  var rows = anggota.map(function(u) {
    var isKT = u.jabatan === 'Kepala Toko';
    var u_ = unitPer + (isKT ? sisaU : 0);
    var t_ = tipsPer + (isKT ? sisaT : 0);
    var bonus = 0;
    if (tembus === 'ya') bonus = isKT ? 10000 : 5000;
    var gajiKotor = (u_ * 3000) + t_ + bonus - 1000;
    return { user: u, unit: u_, tips: t_, bonus: bonus, wifi: 1000, total: gajiKotor };
  });

  var html = '<h3>Preview Pembagian <button class="close" onclick="tutupModal()">✕</button></h3>';
  html += '<div class="text-sm mb-8">Tanggal ' + esc(tanggal) + ' · Cabang ' + esc(kode) + ' · ' + jumlahMasuk + ' orang masuk</div>';
  html += '<div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Jabatan</th><th>Unit</th><th>Tips</th><th>Bonus</th><th>Total</th></tr></thead><tbody>';
  rows.forEach(function(r) {
    html += '<tr><td>' + esc(r.user.nama) + '</td><td>' + esc(r.user.jabatan) + '</td><td>' + r.unit + '</td><td>' + fmtRupiah(r.tips) + '</td><td>' + fmtRupiah(r.bonus) + '</td><td><strong>' + fmtRupiah(r.total) + '</strong></td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="mt-12"><button class="btn btn-primary btn-block" id="btnSimpanOp">💾 Simpan ' + rows.length + ' Baris</button></div>';

  bukaModal(html);

  document.getElementById('btnSimpanOp').addEventListener('click', function() {
    paksaIklan(async function() {
      var subId = generateSubmissionId('PD');
      var sukses = 0, gagal = 0;
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var data = {
          tanggal: tanggal,
          kode_cabang: kode,
          id_karyawan: String(r.user.id),
          nama_karyawan: String(r.user.nama),
          jabatan: String(r.user.jabatan),
          status_masuk: 'ya',
          alasan: '',
          unit: r.unit,
          tips: r.tips,
          bonus: r.bonus,
          kasbon: 0,
          wifi: r.wifi,
          tembus_target: tembus,
          total_unit_cabang: totalUnit,
          total_tips_cabang: totalTips,
          input_by: S.user_id,
          submission_id: subId + '-' + i,
          dihapus: false
        };
        var res = await simpanData('Pendapatan_Harian', data);
        if (res && res.ok) sukses++; else gagal++;
      }
      tutupModal();
      if (gagal === 0) {
        showToast('✅ ' + sukses + ' baris tersimpan', 'success');
      } else {
        showToast('⚠️ ' + sukses + ' sukses, ' + gagal + ' gagal', 'warning');
      }
    });
  });
}

async function generatePayroll() {
  var periode = document.getElementById('prPeriode').value.trim();
  if (!periode) { showToast('Periode wajib', 'error'); return; }
  var bulan = periode.slice(0,7);
  var rP = await ambilData('Pendapatan_Harian');
  var rU = await ambilData('Users');
  var pendapatan = (rP.data||[]).filter(function(p){ return String(p.tanggal||'').slice(0,7) === bulan; });
  var users = (rU.data||[]).filter(function(u){
    return String(u.dihapus||'').toLowerCase() !== 'true' &&
           String(u.status||'').toLowerCase() === 'aktif';
  });
  if (pendapatan.length === 0) { showToast('Belum ada pendapatan bulan ini', 'warning'); return; }

  var rekap = {};
  pendapatan.forEach(function(p){
    var id = String(p.id_karyawan||'');
    if (!id) return;
    if (!rekap[id]) rekap[id] = { unit:0, tips:0, bonus:0, kasbon:0, wifi:0 };
    rekap[id].unit += Number(p.unit)||0;
    rekap[id].tips += Number(p.tips)||0;
    rekap[id].bonus += Number(p.bonus)||0;
    rekap[id].kasbon += Number(p.kasbon)||0;
    rekap[id].wifi += Number(p.wifi)||0;
  });

  if (isDemo()) { showToast('Mode demo: tidak tersimpan', 'warning'); return; }

  paksaIklan(async function() {
    var sukses = 0, gagal = 0;
    for (var i = 0; i < users.length; i++) {
      var u = users[i];
      var rk = rekap[String(u.id)];
      if (!rk) continue;
      var total = (rk.unit*3000) + rk.tips + rk.bonus - rk.kasbon - rk.wifi;
      var subId = generateSubmissionId('PY');
      var data = {
        periode: periode,
        kode_cabang: String(u.kode_cabang||'-'),
        id_karyawan: String(u.id),
        nama_karyawan: String(u.nama||''),
        jabatan: String(u.jabatan||''),
        total_unit: rk.unit, total_tips: rk.tips, total_bonus: rk.bonus,
        total_kasbon: rk.kasbon, total_wifi: rk.wifi,
        total_payroll: total,
        status: 'belum_dibayar', tanggal_dibayar: '',
        diedit_oleh: S.user_id, dihapus: false
      };
      var res = await simpanData('Payroll', data);
      if (res && res.ok) sukses++; else gagal++;
    }
    showToast('✅ ' + sukses + ' payroll dibuat' + (gagal?', '+gagal+' gagal':''), 'success');
    navigasi('payroll');
  });
}

var KELOLA_SHEET = 'Users';
async function renderKelolaData() {
  var main = document.getElementById('mainContent');
  var sheets = ['Users','Target_Cabang','Pendapatan_Harian','Pengeluaran','Pengajuan_Kasbon','Izin_Istirahat','Kerusakan_Kendala','Permintaan_Payroll','Setoran','Laporan_Barang','Laporan_Token','Dana_Expansi','Biaya_Sewa','Persiapan_Cabang','SP_Karyawan','Resign_PHK','Laporan'];
  var opts = '';
  sheets.forEach(function(s){ opts += '<option value="'+s+'"'+(s===KELOLA_SHEET?' selected':'')+'>'+s+'</option>'; });
  var html = '<div class="card"><div class="card-title">🗂️ Kelola Data</div>' +
    '<div class="field"><label>Pilih Sheet</label><select class="select" id="kdSheet" onchange="KELOLA_SHEET=this.value;loadKelolaData()">'+opts+'</select></div>' +
  '</div>';
  html += '<div class="card"><div id="kdBody"><div class="loading-mini">Memuat...</div></div></div>';
  main.innerHTML = html;
  await loadKelolaData();
}

async function loadKelolaData() {
  var body = document.getElementById('kdBody');
  if (!body) return;
  var r = await ambilData(KELOLA_SHEET, true);
  var data = r.data || [];
  if (data.length === 0) {
    body.innerHTML = '<div class="empty">Belum ada data</div>';
    return;
  }
  var keys = Object.keys(data[0]).filter(function(k){ return k !== '_row'; });
  var html = '<div class="table-wrap"><table class="table"><thead><tr>';
  keys.forEach(function(k){ html += '<th>'+esc(k)+'</th>'; });
  html += '<th>Aksi</th></tr></thead><tbody>';
  data.slice(0, 50).forEach(function(row){
    html += '<tr>';
    keys.forEach(function(k){ html += '<td>'+esc(row[k])+'</td>'; });
    html += '<td><button class="btn btn-danger btn-sm" onclick="konfirmHapus(\''+KELOLA_SHEET+'\','+row._row+')">🗑</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  body.innerHTML = html;
}

async function konfirmHapus(sheet, row) {
  if (!confirm('Hapus baris ini?')) return;
  var res = await hapusData(sheet, row);
  if (res && res.ok) { showToast('✅ Dihapus', 'success'); loadKelolaData(); }
  else showToast(res.pesan||'Gagal', 'error');
}

    };
    var res = await simpanData('Laporan', data);
    if (res && res.ok) { showToast('✅ Terkirim', 'success'); navigasi('laporan'); }
    else showToast(res.pesan||'Gagal', 'error');
  });
}

/* ============================================================
   HR
   ============================================================ */
var TAB_HR = 'data';
async function renderHR() {
  var main = document.getElementById('mainContent');
  var tabs = [
    {id:'data', label:'👥 Data'},
    {id:'sp', label:'⚠️ SP'},
    {id:'resign', label:'🚪 Resign/PHK'},
    {id:'hadir', label:'📊 Kehadiran'},
    {id:'evaluasi', label:'⭐ Evaluasi'}
  ];
  var tabHtml = '';
  tabs.forEach(function(t) { tabHtml += '<button class="tab' + (TAB_HR===t.id?' active':'') + '" onclick="gantiTabHR(\'' + t.id + '\')">' + t.label + '</button>'; });
  main.innerHTML = '<div class="tabs">' + tabHtml + '</div><div id="hrBody"><div class="loading-mini">Memuat...</div></div>';
  await loadTabHR();
}
function gantiTabHR(id) { TAB_HR = id; renderHR(); }
async function loadTabHR() {
  var body = document.getElementById('hrBody');
  if (!body) return;
  if (TAB_HR === 'data') return hrData(body);
  if (TAB_HR === 'sp') return hrSP(body);
  if (TAB_HR === 'resign') return hrResign(body);
  if (TAB_HR === 'hadir') return hrHadir(body);
  if (TAB_HR === 'evaluasi') return hrEvaluasi(body);
}
async function hrData(body) {
  var r = await ambilData('Users');
  var data = (r.data||[]).filter(function(u){ return String(u.dihapus||'').toLowerCase() !== 'true'; });
  var html = '<div class="card"><div class="card-title">👥 Data Karyawan (' + data.length + ')</div>';
  html += '<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Nama</th><th>Jabatan</th><th>Cabang</th><th>Status</th></tr></thead><tbody>';
  data.forEach(function(u){
    html += '<tr><td>'+esc(u.id)+'</td><td>'+esc(u.nama)+'</td><td>'+esc(u.jabatan)+'</td><td>'+esc(u.kode_cabang||'-')+'</td><td>'+esc(u.status||'-')+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  body.innerHTML = html;
}
async function hrSP(body) {
  var r = await ambilData('SP_Karyawan');
  var data = r.data||[];
  var html = '<div class="card"><div class="card-title">⚠️ Surat Peringatan (' + data.length + ')</div>';
  if (data.length === 0) html += '<div class="empty">Belum ada SP</div>';
  else {
    html += '<div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Nama</th><th>Tingkat</th><th>Alasan</th></tr></thead><tbody>';
    data.forEach(function(s){ html += '<tr><td>'+esc(s.tanggal)+'</td><td>'+esc(s.nama_karyawan)+'</td><td>'+esc(s.tingkat)+'</td><td>'+esc(s.alasan)+'</td></tr>'; });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  body.innerHTML = html;
}
async function hrResign(body) {
  var r = await ambilData('Resign_PHK');
  var data = r.data||[];
  var html = '<div class="card"><div class="card-title">🚪 Resign/PHK (' + data.length + ')</div>';
  if (data.length === 0) html += '<div class="empty">Belum ada</div>';
  else {
    html += '<div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Jenis</th><th>Efektif</th><th>Status</th></tr></thead><tbody>';
    data.forEach(function(s){ html += '<tr><td>'+esc(s.nama_karyawan)+'</td><td>'+esc(s.jenis)+'</td><td>'+esc(s.tanggal_efektif)+'</td><td>'+esc(s.status||'-')+'</td></tr>'; });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  body.innerHTML = html;
}
async function hrHadir(body) {
  var r = await ambilData('Pendapatan_Harian');
  var data = r.data||[];
  var today = todayStr();
  var hariIni = data.filter(function(p){ return String(p.tanggal||'').slice(0,10) === today; });
  var hadir = hariIni.filter(function(p){ return String(p.status_masuk||'') === 'ya'; });
  var tidak = hariIni.filter(function(p){ return String(p.status_masuk||'') !== 'ya'; });
  var html = '<div class="card"><div class="card-title">📊 Kehadiran Hari Ini</div>';
  html += '<div class="stat-grid">' +
    '<div class="stat-item"><div class="stat-label">Hadir</div><div class="stat-value green">'+hadir.length+'</div></div>' +
    '<div class="stat-item"><div class="stat-label">Tidak Hadir</div><div class="stat-value" style="color:#DC2626;">'+tidak.length+'</div></div>' +
  '</div></div>';
  body.innerHTML = html;
}
async function hrEvaluasi(body) {
  var r = await ambilData('Pendapatan_Harian');
  var data = r.data||[];
  var rekap = {};
  data.forEach(function(p){
    var id = String(p.id_karyawan||'');
    if (!id) return;
    if (!rekap[id]) rekap[id] = { nama: p.nama_karyawan, unit:0, tips:0, hari:0 };
    rekap[id].unit += Number(p.unit)||0;
    rekap[id].tips += Number(p.tips)||0;
    rekap[id].hari++;
  });
  var html = '<div class="card"><div class="card-title">⭐ Evaluasi Kinerja</div>';
  if (Object.keys(rekap).length === 0) html += '<div class="empty">Belum ada data</div>';
  else {
    html += '<div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Hari</th><th>Unit</th><th>Tips</th></tr></thead><tbody>';
    Object.keys(rekap).forEach(function(k){
      var r = rekap[k];
      html += '<tr><td>'+esc(r.nama)+'</td><td>'+r.hari+'</td><td>'+fmtAngka(r.unit)+'</td><td>'+fmtRupiah(r.tips)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  body.innerHTML = html;
}

async function renderProfil() {
  var main = document.getElementById('mainContent');
  var html = '<div class="card"><div class="card-title">👤 Profil</div>';
  html += '<div class="kv-row"><span class="k">ID</span><span class="v">' + esc(S.user_id) + '</span></div>';
  html += '<div class="kv-row"><span class="k">Nama</span><span class="v">' + esc(S.user_nama) + '</span></div>';
  html += '<div class="kv-row"><span class="k">Jabatan</span><span class="v">' + esc(S.user_jabatan) + '</span></div>';
  html += '<div class="kv-row"><span class="k">Cabang</span><span class="v">' + esc(S.kode_cabang) + '</span></div>';
  html += '<div class="kv-row"><span class="k">Mode</span><span class="v">' + (isDemo()?'Demo':'Normal') + '</span></div>';
  html += '<div class="divider"></div>';
  html += '<button class="btn btn-danger btn-block" onclick="logoutApp()">🚪 Logout</button>';
  html += '</div>';
  main.innerHTML = html;
}
function logoutApp() {
  if (!confirm('Yakin logout?')) return;
  hapusSession();
  window.location.href = 'index.html';
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  if (!S || !S.user_id) { window.location.href = 'index.html'; return; }

  document.getElementById('headerNama').textContent = S.user_nama;
  document.getElementById('headerJabatan').textContent = S.user_jabatan + (S.kode_cabang && S.kode_cabang !== '-' ? ' · ' + S.kode_cabang : '');

  document.getElementById('btnProfil').addEventListener('click', function() { navigasi('profil'); });
  document.getElementById('btnLogout').addEventListener('click', logoutApp);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) tutupModal();
  });

  navigasi('home');
})();
</script>
