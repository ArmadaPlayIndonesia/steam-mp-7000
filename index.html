<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — STEAM MP 7000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --merah:#C8102E; --merah-hover:#A00D25; --merah-tua:#8B0000;
    --emas:#F59E0B; --emas-muda:#FBBF24;
    --putih:#FFFFFF; --abu-bg:#F9FAFB; --text:#1F2937; --text-lembut:#6B7280;
  }
  html,body{ height:100%; }
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 0%, rgba(200,16,46,.28), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(251,191,36,.22), transparent 40%),
      linear-gradient(160deg,#7f0a1e 0%,#C8102E 28%,#f3f4f6 78%,#ffffff 100%);
    min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px 16px 32px;
    overflow-x:hidden;
  }
  .login-wrap{ width:100%; max-width:400px; animation:muncul .55s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes muncul{
    from{ opacity:0; transform:translateY(18px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .logo-svg{
    display:block; margin:0 auto 16px;
    filter: drop-shadow(0 4px 12px rgba(200,16,46,0.3))
            drop-shadow(0 0 20px rgba(251,191,36,0.3));
    transition: transform .3s;
  }
  .logo-svg:hover{ transform:scale(1.05); }

  .brand{ text-align:center; margin-bottom:20px; }
  .brand h1{
    font-size:26px; font-weight:800; letter-spacing:.5px;
    background:linear-gradient(90deg,#C8102E,#8B0000 55%,#F59E0B);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.15;
  }
  .brand .tagline{
    margin-top:6px; font-size:11.5px; font-weight:600;
    color:#7f0a1e; letter-spacing:.4px; text-transform:uppercase;
  }
  .brand .tagline span{ color:#B45309; }

  .kartu{
    background:var(--putih); border-radius:18px;
    padding:26px 22px 22px;
    box-shadow:0 18px 40px -12px rgba(139,0,0,.35), 0 2px 8px rgba(0,0,0,.06);
    border:1px solid rgba(245,158,11,.35);
    position:relative; overflow:hidden;
  }
  .kartu::before{
    content:''; position:absolute; inset:0 0 auto 0; height:4px;
    background:linear-gradient(90deg,#C8102E,#FBBF24,#C8102E);
  }
  .kartu h2{ font-size:17px; font-weight:700; margin-bottom:4px; }
  .kartu .sub{ font-size:12.5px; color:var(--text-lembut); margin-bottom:18px; }

  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12.5px; font-weight:600;
    margin-bottom:6px; color:#374151;
  }
  .input-wrap{ position:relative; }
  .field input{
    width:100%; padding:12px 14px;
    border:1.5px solid #E5E7EB; border-radius:10px;
    font-family:inherit; font-size:14px; color:var(--text);
    background:#FCFCFD; transition:.18s;
  }
  .field input:focus{
    outline:none; border-color:var(--merah);
    background:#fff; box-shadow:0 0 0 3px rgba(200,16,46,.12);
  }
  .field input.pw{ padding-right:46px; }
  .toggle-pw{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:0; background:transparent; cursor:pointer;
    font-size:17px; padding:7px 9px; border-radius:8px; line-height:1;
  }
  .toggle-pw:hover{ background:#F3F4F6; }

  .btn{
    width:100%; border:0; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:14.5px; font-weight:700;
    padding:13px 16px; transition:.18s; letter-spacing:.3px;
  }
  .btn:disabled{ opacity:.65; cursor:not-allowed; }
  .btn-primary{
    background:linear-gradient(135deg,#C8102E,#8B0000); color:#fff;
    box-shadow:0 6px 16px -6px rgba(200,16,46,.75);
  }
  .btn-primary:hover:not(:disabled){ background:linear-gradient(135deg,#A00D25,#700000); transform:translateY(-1px); }
  .btn-outline{
    background:transparent; color:#B45309;
    border:1.8px solid var(--emas-muda); margin-top:10px;
  }
  .btn-outline:hover:not(:disabled){ background:#FFFBEB; border-color:var(--emas); }

  .pesan-error{
    display:none; margin-top:12px; padding:10px 12px;
    background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C;
    border-radius:9px; font-size:12.5px; font-weight:600;
    animation:getar .35s;
  }
  .pesan-error.tampil{ display:block; }
  @keyframes getar{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)}
    75%{transform:translateX(5px)}
  }

  .footer{
    text-align:center; margin-top:22px;
    font-size:11.5px; color:#7f0a1e; font-weight:600;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .footer .dot{ color:var(--emas); }

  /* Modal demo */
  .overlay{
    position:fixed; inset:0; background:rgba(17,24,39,.62);
    backdrop-filter:blur(3px); display:none; z-index:100;
    align-items:center; justify-content:center; padding:18px;
  }
  .overlay.tampil{ display:flex; }
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:380px;
    padding:22px; box-shadow:0 24px 50px -12px rgba(0,0,0,.5);
    animation:naik .25s ease both;
  }
  @keyframes naik{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .modal h3{ font-size:16px; font-weight:700; margin-bottom:4px; }
  .modal p{ font-size:12.5px; color:var(--text-lembut); margin-bottom:16px; }
  .role-btn{
    width:100%; text-align:left; display:flex; align-items:center; gap:12px;
    padding:12px 14px; margin-bottom:9px; cursor:pointer;
    background:#F9FAFB; border:1.5px solid #E5E7EB; border-radius:11px;
    font-family:inherit; font-size:13.5px; font-weight:600; color:var(--text);
    transition:.16s;
  }
  .role-btn:hover{ border-color:var(--emas); background:#FFFBEB; transform:translateX(3px); }
  .role-btn .ikon{
    width:34px; height:34px; border-radius:50%; flex:0 0 34px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#C8102E,#8B0000); color:#FBBF24;
    font-size:15px; border:1.5px solid #FBBF24;
  }
  .role-btn small{ display:block; font-weight:500; font-size:11px; color:var(--text-lembut); margin-top:1px; }
  .modal .tutup{
    width:100%; margin-top:6px; padding:11px; border-radius:10px;
    background:#F3F4F6; border:0; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; color:#4B5563;
  }
  .modal .tutup:hover{ background:#E5E7EB; }

  @media (max-width:360px){
    .brand h1{ font-size:22px; }
    .kartu{ padding:22px 17px 18px; }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
      <defs>
        <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#C8102E"/>
          <stop offset="100%" stop-color="#8B0000"/>
        </linearGradient>
        <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FBBF24"/>
          <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
      </defs>
      <circle cx="40" cy="40" r="38" fill="url(#gradLogo)" stroke="url(#gradGold)" stroke-width="3"/>
      <g fill="url(#gradGold)">
        <path d="M20 50 Q20 42 28 42 L32 42 L35 38 L45 38 L48 42 L52 42 Q60 42 60 50 L60 54 Q60 58 56 58 L24 58 Q20 58 20 54 Z"/>
        <circle cx="26" cy="58" r="6" fill="none" stroke="url(#gradGold)" stroke-width="2"/>
        <circle cx="26" cy="58" r="2" fill="url(#gradGold)"/>
        <circle cx="54" cy="58" r="6" fill="none" stroke="url(#gradGold)" stroke-width="2"/>
        <circle cx="54" cy="58" r="2" fill="url(#gradGold)"/>
        <path d="M32 38 L30 30 L36 30" stroke="url(#gradGold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M48 42 Q52 35 56 32" stroke="url(#gradGold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="56" cy="32" r="2.5" fill="url(#gradGold)"/>
        <circle cx="58" cy="26" r="2" fill="#FBBF24" opacity="0.7"/>
        <circle cx="62" cy="24" r="1.5" fill="#FBBF24" opacity="0.5"/>
        <circle cx="60" cy="20" r="1.8" fill="#FBBF24" opacity="0.6"/>
      </g>
    </svg>
    <h1>STEAM MP 7000</h1>
    <div class="tagline">Jujur <span>•</span> Disiplin <span>•</span> Tanggung Jawab <span>•</span> Harga Mati !</div>
  </div>

  <div class="kartu">
    <h2>Selamat Datang</h2>
    <p class="sub">Masuk untuk melanjutkan ke sistem manajemen.</p>

    <form id="formLogin" autocomplete="off">
      <div class="field">
        <label for="inputId">ID Pengguna</label>
        <div class="input-wrap">
          <input type="text" id="inputId" class="pw-none" placeholder="Masukkan ID" inputmode="text">
        </div>
      </div>

      <div class="field">
        <label for="inputPassword">Password</label>
        <div class="input-wrap">
          <input type="password" id="inputPassword" class="pw" placeholder="Masukkan password">
          <button type="button" class="toggle-pw" id="btnTogglePw" aria-label="Tampilkan password">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="btnMasuk">MASUK</button>
      <button type="button" class="btn btn-outline" id="btnDemo">COBA DEMO</button>

      <div class="pesan-error" id="pesanError"></div>
    </form>
  </div>

  <div class="footer">Steam MP Manajemen <span class="dot">•</span> &copy; 2026</div>
</div>

<div class="overlay" id="overlayDemo">
  <div class="modal">
    <h3>Pilih Mode Demo</h3>
    <p>Semua fitur bisa dilihat, tetapi tidak dapat mengubah data.</p>
    <button class="role-btn" data-role="owner">
      <span class="ikon">👑</span>
      <span>Owner<small>11 menu lengkap</small></span>
    </button>
    <button class="role-btn" data-role="admin">
      <span class="ikon">🛠️</span>
      <span>Admin<small>8 menu operasional</small></span>
    </button>
    <button class="role-btn" data-role="kepala_toko">
      <span class="ikon">🏪</span>
      <span>Kepala Toko<small>Cabang GROBOGAN</small></span>
    </button>
    <button class="role-btn" data-role="karyawan">
      <span class="ikon">👷</span>
      <span>Karyawan<small>Cabang GROBOGAN</small></span>
    </button>
    <button class="tutup" id="btnTutupDemo">Batal</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ================= KONFIG ================= */
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwWiWeesEtkkzsbZrEb4I1WYAj8LPVY73H5ZZo1kB8UjWCcL2v5IbH3WvfZqblkEhMu/exec';
  const TOKEN = 'steam-mp-7000-2026';
  const SESSION_KEY = 'steam_mp_session';

  /* ================= API ================= */
  async function apiPost(action, data){
    try {
      const res = await fetch(BACKEND_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain' },
        body: JSON.stringify(Object.assign({ action:action, token:TOKEN }, data || {})),
        redirect:'follow'
      });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, pesan:'Respons tidak valid' }; }
    } catch(e){
      return { ok:false, pesan:'Gagal terhubung ke server' };
    }
  }

  /* ================= SESSION ================= */
  function saveSession(obj){
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch(e){}
  }

  /* ================= UTIL ================= */
  function $(id){ return document.getElementById(id); }

  function tampilkanError(msg){
    const el = $('pesanError');
    el.textContent = msg;
    el.classList.add('tampil');
  }
  function sembunyikanError(){ $('pesanError').classList.remove('tampil'); }

  /* ================= LOGIN ================= */
  async function prosesLogin(e){
    e.preventDefault();
    sembunyikanError();

    const id = $('inputId').value.trim();
    const password = $('inputPassword').value;

    if(!id){ tampilkanError('ID wajib diisi.'); return; }
    if(!password){ tampilkanError('Password wajib diisi.'); return; }

    const btn = $('btnMasuk');
    const teksAsli = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'MEMPROSES...';

    const hasil = await apiPost('baca', { sheet:'Users' });

    if(!hasil || hasil.ok !== true){
      tampilkanError((hasil && hasil.pesan) ? hasil.pesan : 'Gagal membaca data pengguna.');
      btn.disabled = false; btn.textContent = teksAsli; return;
    }

    let daftar = hasil.data;
    if(!Array.isArray(daftar)){
      if(daftar && Array.isArray(daftar.data)) daftar = daftar.data;
      else daftar = [];
    }

    const cocok = daftar.find(function(u){
      if(!u) return false;
      const uId = String(u.id == null ? '' : u.id).trim();
      const uPw = String(u.password == null ? '' : u.password);
      const uStatus = String(u.status == null ? 'aktif' : u.status).toLowerCase();
      const uHapus = (u.dihapus === true || u.dihapus === 'true' || u.dihapus === 'TRUE');
      return uId === id && uPw === password && uStatus === 'aktif' && !uHapus;
    });

    if(!cocok){
      tampilkanError('ID atau Password salah.');
      btn.disabled = false; btn.textContent = teksAsli; return;
    }

    saveSession({
      user_id: String(cocok.id),
      user_nama: cocok.nama || 'Tanpa Nama',
      user_jabatan: cocok.jabatan || 'Karyawan',
      user_kode_cabang: cocok.kode_cabang || '-',
      is_demo: false,
      login_time: Date.now()
    });

    window.location.replace('dashboard.html');
  }

  /* ================= DEMO ================= */
  const LABEL_ROLE = {
    owner:'Owner', admin:'Admin', kepala_toko:'Kepala Toko', karyawan:'Karyawan'
  };
  const ROLE_BUTUH_CABANG = { kepala_toko:true, karyawan:true };

  function pilihDemo(role){
    const label = LABEL_ROLE[role] || 'Pengguna';
    saveSession({
      user_id: 'demo_' + role,
      user_nama: 'Demo ' + label,
      user_jabatan: label,
      user_kode_cabang: ROLE_BUTUH_CABANG[role] ? 'GROBOGAN' : '-',
      is_demo: true,
      login_time: Date.now()
    });
    window.location.replace('dashboard.html');
  }

  function bukaModalDemo(){ $('overlayDemo').classList.add('tampil'); }
  function tutupModalDemo(){ $('overlayDemo').classList.remove('tampil'); }

  /* ================= INIT ================= */
  document.addEventListener('DOMContentLoaded', function(){
    // Cek session SEKALI di awal
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if(raw){
        const s = JSON.parse(raw);
        if(s && s.user_id){
          window.location.replace('dashboard.html');
          return;
        }
      }
    } catch(e){
      localStorage.removeItem(SESSION_KEY);
    }

    // Form login
    $('formLogin').addEventListener('submit', prosesLogin);

    // Toggle password
    $('btnTogglePw').addEventListener('click', function(){
      const inp = $('inputPassword');
      const btn = $('btnTogglePw');
      if(inp.type === 'password'){ inp.type = 'text'; btn.textContent = '🙈'; }
      else { inp.type = 'password'; btn.textContent = '👁'; }
    });

    // Demo
    $('btnDemo').addEventListener('click', bukaModalDemo);
    $('btnTutupDemo').addEventListener('click', tutupModalDemo);
    $('overlayDemo').addEventListener('click', function(ev){
      if(ev.target === this) tutupModalDemo();
    });
    document.querySelectorAll('.role-btn').forEach(function(b){
      b.addEventListener('click', function(){ pilihDemo(b.getAttribute('data-role')); });
    });

    // Enter di field ID → fokus ke password
    $('inputId').addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){ ev.preventDefault(); $('inputPassword').focus(); }
    });

    // Fokus awal
    setTimeout(function(){ $('inputId').focus(); }, 120);
  });

})();
</script>
</body>
</html>
