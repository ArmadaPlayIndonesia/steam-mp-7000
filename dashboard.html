<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - STEAM MP 7000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --merah:#C8102E;
    --merah-dark:#9B0C23;
    --emas:#F59E0B;
    --emas-dark:#B45309;
    --putih:#FFFFFF;
    --hitam:#1F2937;
    --abu:#6B7280;
    --abu-bg:#F3F4F6;
    --hijau:#16A34A;
    --hijau-bg:#DCFCE7;
    --merah-bg:#FEE2E2;
    --biru:#2563EB;
  }
  html,body{height:100%}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    background:var(--abu-bg);
    color:var(--hitam);
    min-height:100vh;
    padding-bottom:78px;
    overflow-x:hidden;
  }

  /* ===== HEADER ===== */
  #appHeader{
    background:linear-gradient(135deg,var(--merah),var(--merah-dark));
    color:#fff;
    padding:14px 16px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
  }
  .hdr-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .hdr-logo{
    width:40px;height:40px;
    border-radius:50%;
    background:linear-gradient(145deg,#F59E0B,#D97706);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;color:#fff;
    border:2px solid rgba(255,255,255,.7);
    flex-shrink:0;
  }
  .hdr-title{
    flex:1;
    min-width:0;
  }
  .hdr-title h1{
    font-size:15px;font-weight:800;letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hdr-title p{
    font-size:11px;opacity:.9;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hdr-actions{display:flex;gap:6px;align-items:center}
  .hdr-btn{
    background:rgba(255,255,255,.18);
    border:none;
    color:#fff;
    width:36px;height:36px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    transition:.18s;
  }
  .hdr-btn:hover{background:rgba(255,255,255,.32)}
  .demo-badge{
    background:var(--emas);
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    padding:3px 7px;
    border-radius:20px;
    letter-spacing:.5px;
    white-space:nowrap;
  }

  /* ===== CONTENT ===== */
  #appContent{
    padding:16px;
    max-width:900px;
    margin:0 auto;
  }

  .page-title{
    font-size:18px;
    font-weight:800;
    color:var(--merah);
    margin-bottom:4px;
  }
  .page-sub{
    font-size:12.5px;
    color:var(--abu);
    margin-bottom:16px;
  }

  /* ===== MENU GRID ===== */
  .menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  .menu-card{
    background:#fff;
    border-radius:16px;
    padding:16px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    cursor:pointer;
    border:none;
    font-family:inherit;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    transition:.2s;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .menu-card::after{
    content:"";
    position:absolute;
    inset:auto 0 0 0;
    height:3px;
    background:linear-gradient(90deg,var(--merah),var(--emas));
    transform:scaleX(0);
    transition:.25s;
  }
  .menu-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(200,16,46,.15)}
  .menu-card:hover::after{transform:scaleX(1)}
  .menu-card .m-ico{
    width:48px;height:48px;
    border-radius:13px;
    background:linear-gradient(145deg,var(--merah),var(--merah-dark));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    box-shadow:0 4px 10px rgba(200,16,46,.28);
  }
  .menu-card .m-label{
    font-size:12px;
    font-weight:700;
    color:var(--hitam);
    line-height:1.3;
  }

  /* ===== CARD / SECTION ===== */
  .card{
    background:#fff;
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    margin-bottom:14px;
  }
  .card h2{
    font-size:15px;
    font-weight:800;
    color:var(--merah);
    margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .back-btn{
    background:none;border:none;
    color:var(--merah);
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    padding:0;
    margin-bottom:12px;
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:hover{text-decoration:underline}

  /* ===== FORM ===== */
  .form-group{margin-bottom:13px}
  .form-group label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    margin-bottom:5px;
    color:var(--hitam);
  }
  .form-group input,
  .form-group select,
  .form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1.5px solid #E5E7EB;
    border-radius:10px;
    font-family:inherit;
    font-size:14px;
    color:var(--hitam);
    background:#fff;
    outline:none;
    transition:.18s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus{
    border-color:var(--merah);
    box-shadow:0 0 0 3px rgba(200,16,46,.1);
  }
  .form-group input:disabled,
  .form-group select:disabled{
    background:var(--abu-bg);
    color:var(--abu);
    cursor:not-allowed;
  }
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .toggle-group{
    display:flex;
    gap:8px;
    margin-bottom:13px;
  }
  .toggle-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1.5px solid #E5E7EB;
    background:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
    color:var(--abu);
    transition:.18s;
  }
  .toggle-btn.active{
    background:var(--merah);
    color:#fff;
    border-color:var(--merah);
  }
  .toggle-btn.active.green{
    background:var(--hijau);
    border-color:var(--hijau);
  }
  .toggle-btn.active.red{
    background:#DC2626;
    border-color:#DC2626;
  }

  .preview-box{
    background:linear-gradient(135deg,#FFF7ED,#FFEDD5);
    border:1.5px dashed var(--emas);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .preview-box .pv-label{
    font-size:11.5px;
    color:var(--emas-dark);
    font-weight:600;
  }
  .preview-box .pv-value{
    font-size:20px;
    font-weight:800;
    color:var(--merah);
    margin-top:2px;
  }

  .btn{
    padding:12px 18px;
    border-radius:11px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    border:none;
    transition:.2s;
    letter-spacing:.3px;
  }
  .btn-primary{
    background:linear-gradient(145deg,var(--merah),var(--merah-dark));
    color:#fff;
    box-shadow:0 4px 12px rgba(200,16,46,.3);
    width:100%;
  }
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-outline{
    background:transparent;
    border:1.5px solid var(--merah);
    color:var(--merah);
  }
  .btn-outline:hover{background:rgba(200,16,46,.07)}
  .btn-gold{
    background:linear-gradient(145deg,var(--emas),var(--emas-dark));
    color:#fff;
    box-shadow:0 4px 12px rgba(245,158,11,.3);
  }
  .btn-gold:hover{filter:brightness(1.06)}
  .btn-sm{
    padding:7px 12px;
    font-size:12px;
    border-radius:9px;
  }
  .btn-ghost{
    background:var(--abu-bg);
    color:var(--hitam);
    border:1px solid #E5E7EB;
  }
  .btn-ghost:hover{background:#E5E7EB}
  .btn-danger{
    background:#FEE2E2;
    color:#991B1B;
    border:1px solid #FCA5A5;
  }
  .btn-danger:hover{background:#FCA5A5}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}

  /* ===== TABLE ===== */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
    min-width:520px;
  }
  table th{
    background:var(--abu-bg);
    color:var(--hitam);
    font-weight:700;
    text-align:left;
    padding:9px 10px;
    border-bottom:2px solid #E5E7EB;
    white-space:nowrap;
    font-size:11.5px;
  }
  table td{
    padding:9px 10px;
    border-bottom:1px solid #F3F4F6;
    vertical-align:middle;
  }
  table tr:hover td{background:#FAFAFA}
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.3px;
  }
  .badge-green{background:var(--hijau-bg);color:#166534}
  .badge-red{background:var(--merah-bg);color:#991B1B}
  .badge-gold{background:#FEF3C7;color:#92400E}
  .badge-blue{background:#DBEAFE;color:#1E40AF}
  .badge-gray{background:#E5E7EB;color:#374151}
  .bonus-cell{color:var(--hijau);font-weight:700}
  .empty-state{
    text-align:center;
    padding:28px 12px;
    color:var(--abu);
    font-size:13px;
  }
  .empty-state .big{font-size:38px;margin-bottom:8px;opacity:.5}

  /* ===== TOAST ===== */
  #toastBox{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:calc(100% - 32px);
    max-width:400px;
    pointer-events:none;
  }
  .toast{
    background:#fff;
    border-radius:12px;
    padding:12px 14px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:10px;
    animation:toastIn .3s ease;
    border-left:4px solid var(--hijau);
    pointer-events:auto;
  }
  .toast.error{border-left-color:#DC2626}
  .toast.info{border-left-color:var(--biru)}
  .toast.gold{border-left-color:var(--emas)}
  @keyframes toastIn{
    from{opacity:0;transform:translateY(-14px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:200;
    backdrop-filter:blur(3px);
    overflow-y:auto;
  }
  .modal-overlay.show{display:flex}
  .modal{
    background:#fff;
    border-radius:18px;
    padding:20px;
    width:100%;
    max-width:440px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    animation:fadeUp .3s ease;
    max-height:92vh;
    overflow-y:auto;
    margin:auto;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }
  .modal h3{
    font-size:16px;
    color:var(--merah);
    margin-bottom:14px;
    font-weight:800;
  }
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .modal-actions .btn{flex:1}

  /* ===== BOTTOM NAV ===== */
  #bottomNav{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    display:flex;
    justify-content:space-around;
    padding:7px 4px 9px;
    box-shadow:0 -3px 14px rgba(0,0,0,.09);
    z-index:60;
    border-top:2px solid var(--emas);
  }
  .nav-item{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:5px;
    cursor:pointer;
    font-family:inherit;
    color:var(--abu);
    font-size:10px;
    font-weight:600;
    border-radius:9px;
    transition:.18s;
  }
  .nav-item .n-ico{font-size:19px;line-height:1}
  .nav-item.active{color:var(--merah);background:rgba(200,16,46,.07)}
  .nav-item:hover{color:var(--merah)}

  /* ===== STAT GRID (dashboard) ===== */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .stat-card{
    background:#fff;
    border-radius:14px;
    padding:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-left:4px solid var(--merah);
  }
  .stat-card.gold{border-left-color:var(--emas)}
  .stat-card.green{border-left-color:var(--hijau)}
  .stat-card.blue{border-left-color:var(--biru)}
  .stat-card .s-label{
    font-size:11px;
    color:var(--abu);
    font-weight:600;
    margin-bottom:4px;
  }
  .stat-card .s-value{
    font-size:19px;
    font-weight:800;
    color:var(--hitam);
  }

  .info-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px dashed #E5E7EB;
    font-size:13px;
  }
  .info-row:last-child{border-bottom:none}
  .info-row .lbl{color:var(--abu);font-weight:500}
  .info-row .val{font-weight:700;color:var(--hitam);text-align:right;max-width:60%}

  .loading-box{
    text-align:center;
    padding:26px;
    color:var(--abu);
    font-size:13px;
  }
  .loading-box .spinner{
    display:inline-block;
    width:26px;height:26px;
    border:3px solid #E5E7EB;
    border-top-color:var(--merah);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin-bottom:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== RESPONSIVE ===== */
  @media(min-width:600px){
    #appContent{padding:22px}
    .menu-grid{grid-template-columns:repeat(4,1fr)}
    .stat-grid{grid-template-columns:repeat(4,1fr)}
    .hdr-title h1{font-size:17px}
  }

  /* Anti-iklan placeholder owner */
  .ad-slot{
    background:repeating-linear-gradient(45deg,#F3F4F6,#F3F4F6 10px,#E5E7EB 10px,#E5E7EB 20px);
    border:1.5px dashed #9CA3AF;
    border-radius:12px;
    padding:20px 12px;
    text-align:center;
    color:#6B7280;
    font-size:12px;
    font-weight:600;
    margin-bottom:14px;
  }
</style>
</head>
<body>

<header id="appHeader"></header>
<main id="appContent"></main>
<nav id="bottomNav"></nav>
<div id="toastBox"></div>
<div class="modal-overlay" id="globalModal">
  <div class="modal" id="globalModalContent"></div>
</div>

<script>
(function(){
  'use strict';

  /* =====================================================
     KONFIG
     ===================================================== */
  var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwWiWeesEtkkzsbZrEb4I1WYAj8LPVY73H5ZZo1kB8UjWCcL2v5IbH3WvfZqblkEhMu/exec';
  var TOKEN = 'steam-mp-7000-2026';
  var SESSION_KEY = 'steam_mp_session';

  /* =====================================================
     SESSION
     ===================================================== */
  function getSession(){
    try{
      var raw = localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      var s = JSON.parse(raw);
      if(!s || !s.user_id) return null;
      return s;
    }catch(e){ return null; }
  }
  function setSession(s){
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){}
  }
  function clearSession(){
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  }

  /* =====================================================
     API WRAPPER
     ===================================================== */
  function apiPost(action, data){
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    return fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json();
    });
  }
  function baca(sheet){ return apiPost('baca', { sheet: sheet }); }
  function tulis(sheet, data){ return apiPost('tulis', { sheet: sheet, data: data }); }
  function update(sheet, row, data){ return apiPost('update', { sheet: sheet, row: row, data: data }); }
  function hapus(sheet, row){ return apiPost('hapus', { sheet: sheet, row: row }); }

  /* =====================================================
     UTIL
     ===================================================== */
  function $(id){ return document.getElementById(id); }
  function esc(s){
    if(s == null) return '-';
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }
  function safe(s){ return (s == null || s === '') ? '-' : s; }
  function todayStr(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function rupiah(n){
    if(n == null || isNaN(n)) n = 0;
    return 'Rp ' + Number(n).toLocaleString('id-ID');
  }
  function num(v){ var n = Number(v); return isNaN(n) ? 0 : n; }
  function uuidv4(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
      return v.toString(16);
    });
  }

  /* =====================================================
     TOAST
     ===================================================== */
  function toast(msg, type){
    type = type || 'success';
    var box = $('toastBox');
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    var ico = type === 'error' ? '❌' : type === 'info' ? 'ℹ️' : type === 'gold' ? '🎉' : '✅';
    el.innerHTML = '<span>' + ico + '</span><span>' + esc(msg) + '</span>';
    box.appendChild(el);
    setTimeout(function(){
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(-12px)';
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
    }, 3000);
  }

  /* =====================================================
     MODAL
     ===================================================== */
  function openModal(html){
    var ov = $('globalModal');
    var c = $('globalModalContent');
    c.innerHTML = html;
    ov.classList.add('show');
  }
  function closeModal(){
    $('globalModal').classList.remove('show');
    $('globalModalContent').innerHTML = '';
  }
  $('globalModal').addEventListener('click', function(e){
    if(e.target === $('globalModal')) closeModal();
  });

  /* =====================================================
     GUARD: SESSION SEKALI DI AWAL
     ===================================================== */
  var session = getSession();
  if(!session){
    clearSession();
    window.location.replace('index.html');
    return;
  }

  var STATE = {
    page: 'menu',
    user: session,
    cache: {}
  };

  /* =====================================================
     MENU DEFINISI (berdasarkan role)
     ===================================================== */
  var MENU_OWNER = [
    { key:'dashboard_pendapatan', label:'Dashboard Pendapatan', ico:'📈' },
    { key:'manajemen_manusia',     label:'Manajemen Manusia',   ico:'👥' },
    { key:'cek_payroll',           label:'Cek Payroll',          ico:'💰' },
    { key:'input_pendapatan',      label:'Pendapatan',           ico:'🧾' },
    { key:'input_pengeluaran',     label:'Input Pengeluaran',    ico:'💸' },
    { key:'kasbon',                label:'Kasbon',               ico:'🏦' },
    { key:'izin',                  label:'Izin',                 ico:'📅' },
    { key:'laporan_cabang',        label:'Laporan Cabang',       ico:'🏪' },
    { key:'pengaturan',            label:'Pengaturan',           ico:'⚙️' },
    { key:'profil',                label:'Profil',               ico:'👤' },
    { key:'keluar',                label:'Keluar',               ico:'🚪' }
  ];
  var MENU_ADMIN = [
    { key:'dashboard_pendapatan', label:'Dashboard Pendapatan', ico:'📈' },
    { key:'cek_payroll',           label:'Cek Payroll',          ico:'💰' },
    { key:'input_pengeluaran',     label:'Input Pengeluaran',    ico:'💸' },
    { key:'kasbon',                label:'Kasbon',               ico:'🏦' },
    { key:'izin',                  label:'Izin',                 ico:'📅' },
    { key:'laporan_cabang',        label:'Laporan Cabang',       ico:'🏪' },
    { key:'profil',                label:'Profil',               ico:'👤' },
    { key:'keluar',                label:'Keluar',               ico:'🚪' }
  ];
  var MENU_KT = [

  function getMenu(){
    var j = String(STATE.user.user_jabatan || '').toLowerCase();
    if(j.indexOf('owner') !== -1) return MENU_OWNER;
    if(j.indexOf('admin') !== -1) return MENU_ADMIN;

    if(j.indexOf('karyawan') !== -1) return MENU_KARYAWAN;
    return MENU_KARYAWAN;
  }
  function canEdit(){
    var j = String(STATE.user.user_jabatan || '').toLowerCase();
    return j.indexOf('owner') !== -1 || j.indexOf('admin') !== -1;
  }
  function isOwner(){
    return String(STATE.user.user_jabatan || '').toLowerCase().indexOf('owner') !== -1;
  }
  function isKT(){
    return String(STATE.user.user_jabatan || '').toLowerCase().indexOf('kepala') !== -1;

  /* =====================================================
     HITUNG-HITUNGAN (frontend)
     ===================================================== */
  function hitungTotal(o){
    // o: {status_masuk, unit, tips, bonus, kasbon, wifi}
    var wifi = num(o.wifi);
    if(wifi === 0) wifi = 1000;
    if(o.status_masuk === 'ya'){
      return num(o.unit) + num(o.tips) + num(o.bonus) - num(o.kasbon) - wifi;
    }else{
      return 0 - num(o.kasbon) - 1000;
    }
  }

  function hitungBatasKasbon(pendapatanBelumDibayar){
    // Batas sederhana: tidak melebihi pendapatan bersih belum dibayar
    return Math.max(0, num(pendapatanBelumDibayar));
  }

  function setNavActive(page){
    var items = $('bottomNav').querySelectorAll('.nav-item');
    items.forEach(function(b){
      if(b.getAttribute('data-page') === page){
        b.classList.add('active');
      }else{
        b.classList.remove('active');
      }
    });
  }

  /* =====================================================
     ROUTER
     ===================================================== */
  function go(page){
    STATE.page = page;
    if(page === 'keluar'){ logout(); return; }
    setNavActive(page);
    var c = $('appContent');
    c.innerHTML = '<div class="loading-box"><div class="spinner"></div><div>Memuat...</div></div>';
    try{
      if(page === 'menu') renderMenuPage();
      else if(page === 'profil') renderProfilPage();
      else if(page === 'dashboard_pendapatan') renderDashboardPendapatan();
      else if(page === 'input_pendapatan') renderInputPendapatan();
      else if(page === 'input_pengeluaran') renderInputPengeluaran();
      else if(page === 'kasbon' || page === 'kasbon_saya') renderKasbon(page);
      else if(page === 'izin' || page === 'izin_saya') renderIzin(page);
      else if(page === 'cek_payroll') renderCekPayroll();
      else if(page === 'payroll_saya') renderPayrollSaya();
      else if(page === 'laporan_cabang') renderLaporanCabang();
      else if(page === 'manajemen_manusia') renderManajemenManusia();
      else if(page === 'pengaturan') renderPengaturan();
      else renderMenuPage();
    }catch(e){
      c.innerHTML = '<div class="card"><div class="empty-state"><div class="big">⚠️</div>Terjadi kesalahan: ' + esc(e.message) + '</div></div>';
    }
  }

  /* =====================================================

  function renderDashboardPendapatan(){
    $('appContent').innerHTML = '' +
      '<button class="back-btn" id="btnBack">← Kembali</button>' +
      '<div class="page-title">📈 Dashboard Pendapatan</div>' +
      '<div class="page-sub" id="dashSub">Memuat data...</div>' +
      '<div class="stat-grid" id="dashStats"></div>' +
      '<div class="card" id="dashDetail"><h2>Detail</h2><div class="loading-box"><div class="spinner"></div><div>Memuat...</div></div></div>';
    $('btnBack').onclick = function(){ go('menu'); };

    baca('Pendapatan_Harian').then(function(res){
      if(!res || !res.ok){ throw new Error((res && res.pesan) || 'Gagal baca data.'); }
      var all = Array.isArray(res.data) ? res.data : [];
      var today = todayStr();
      var cabang = STATE.user.user_kode_cabang;

      var rows = all.filter(function(r){
        var t = String(r.tanggal || '').slice(0,10);
        if(t !== today) return false;
        if(canEdit()) return true;
        if(cabang && cabang !== '-') return String(r.kode_cabang||'') === String(cabang);
        return true;
      });

      var totalUnit = 0, totalTips = 0, totalBonus = 0, totalKasbon = 0, totalWifi = 0, totalNet = 0;
      rows.forEach(function(r){
        totalUnit += num(r.unit);
        totalTips += num(r.tips);
        totalBonus += num(r.bonus);
        totalKasbon += num(r.kasbon);
        totalWifi += num(r.wifi) || 1000;
        totalNet += num(r.total) || hitungTotal(r);
      });

      $('dashSub').textContent = 'Tanggal: ' + today + ' • ' + rows.length + ' baris';
      $('dashStats').innerHTML = '' +
        '<div class="stat-card"><div class="s-label">Unit</div><div class="s-value">' + totalUnit + '</div></div>' +
        '<div class="stat-card blue"><div class="s-label">Tips</div><div class="s-value">' + rupiah(totalTips) + '</div></div>' +
        '<div class="stat-card gold"><div class="s-label">Bonus</div><div class="s-value">' + rupiah(totalBonus) + '</div></div>' +
        '<div class="stat-card green"><div class="s-label">Net Total</div><div class="s-value">' + rupiah(totalNet) + '</div></div>';

      var detail = '<h2>Detail Hari Ini</h2>';
      if(rows.length === 0){
        detail += '<div class="empty-state"><div class="big">📭</div>Belum ada data hari ini</div>';
      }else{
        detail += '<div class="table-wrap"><table><thead><tr>' +
          '<th>Nama</th><th>Unit</th><th>Tips</th><th>Bonus</th><th>Kasbon</th><th>WiFi</th><th>Total</th>' +
          '</tr></thead><tbody>';
        rows.forEach(function(r){
          detail += '<tr>' +
            '<td>' + esc(safe(r.nama_karyawan)) + '</td>' +
            '<td>' + num(r.unit) + '</td>' +
            '<td>' + num(r.tips) + '</td>' +
            '<td class="' + (num(r.bonus) > 0 ? 'bonus-cell' : '') + '">' + num(r.bonus) + '</td>' +
            '<td>' + num(r.kasbon) + '</td>' +
            '<td>' + (num(r.wifi) || 1000) + '</td>' +
            '<td><strong>' + rupiah(num(r.total) || hitungTotal(r)) + '</strong></td>' +
          '</tr>';
        });
        detail += '</tbody></table></div>';
      }
      $('dashDetail').innerHTML = detail;
    }).catch(function(err){
      $('dashSub').textContent = '';
      $('dashDetail').innerHTML = '<div class="empty-state"><div class="big">⚠️</div>' + esc(err.message) + '</div>';
    });

  var submissionId = null;

  function renderInputPendapatan(){

    $('appContent').innerHTML = '' +

            '<button type="button" class="toggle-btn active green" id="btnMasuk">✅ Masuk Kerja</button>' +
            '<button type="button" class="toggle-btn red" id="btnTidakMasuk">❌ Tidak Masuk</button>' +
          '</div>' +
        '</div>' +
        '<div id="wrapMasuk">' +
          '<div class="form-row">' +
            '<div class="form-group"><label>Unit</label><input type="number" id="inpUnit" value="0" min="0"></div>' +
            '<div class="form-group"><label>Tips</label><input type="number" id="inpTips" value="0" min="0"></div>' +
          '</div>' +
        '</div>' +
        '<div id="wrapTidakMasuk" style="display:none">' +
          '<div class="form-group"><label>Alasan Tidak Masuk</label>' +
            '<select id="inpAlasan">' +
              '<option value="izin_istirahat">Izin Istirahat (max 1 hari)</option>' +
              '<option value="izin_sakit">Izin Sakit (max 3 hari)</option>' +
              '<option value="libur">Libur</option>' +
              '<option value="mangkir">Mangkir</option>' +
              '<option value="lainnya">Lainnya</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="form-group"><label>Kasbon (Rp)</label><input type="number" id="inpKasbon" value="0" min="0"></div>' +
        '<div class="form-group"><label>WiFi (Rp)</label><input type="number" id="inpWifi" value="1000" disabled></div>' +
        '<div class="preview-box">' +
          '<div class="pv-label">Perkiraan Total</div>' +
          '<div class="pv-value" id="pvTotal">Rp 0</div>' +
        '</div>' +
        '<button class="btn btn-primary" id="btnSimpan">💾 Simpan Pendapatan</button>' +
      '</div>' +
      '<div class="card" id="listHariIni"><h2>📋 Pendapatan Hari Ini</h2><div class="loading-box"><div class="spinner"></div><div>Memuat...</div></div></div>';

    $('btnBack').onclick = function(){ go('menu'); };

    var statusMasuk = 'ya';
    var cabangSel = $('inpCabang');
    var karSel = $('inpKaryawan');

    function refreshPreview(){
      var total = hitungTotal({
        status_masuk: statusMasuk,
        unit: $('inpUnit').value,
        tips: $('inpTips').value,
        bonus: 0,
        kasbon: $('inpKasbon').value,
        wifi: 1000
      });
      $('pvTotal').textContent = rupiah(total);
    }

    $('btnMasuk').onclick = function(){
      statusMasuk = 'ya';
      $('btnMasuk').classList.add('active','green');
      $('btnTidakMasuk').classList.remove('active','red');
      $('wrapMasuk').style.display = '';
      $('wrapTidakMasuk').style.display = 'none';
      $('inpUnit').disabled = false;
      $('inpTips').disabled = false;
      refreshPreview();
    };
    $('btnTidakMasuk').onclick = function(){
      statusMasuk = 'tidak';
      $('btnTidakMasuk').classList.add('active','red');
      $('btnMasuk').classList.remove('active','green');
      $('wrapMasuk').style.display = 'none';
      $('wrapTidakMasuk').style.display = '';
      $('inpUnit').value = 0;
      $('inpTips').value = 0;
      refreshPreview();
    };

    ['inpUnit','inpTips','inpKasbon'].forEach(function(id){
      $(id).addEventListener('input', refreshPreview);
    });

    // Load cabang + karyawan
    Promise.all([ baca('Target_Cabang'), baca('Users') ]).then(function(arr){
      var resC = arr[0], resU = arr[1];
      var cabangs = (resC && resC.ok && Array.isArray(resC.data)) ? resC.data : [];
      var users = (resU && resU.ok && Array.isArray(resU.data)) ? resU.data : [];

      var myCab = STATE.user.user_kode_cabang;
      if(!canEdit() && myCab && myCab !== '-'){
        cabangs = cabangs.filter(function(c){ return String(c.kode_cabang||'') === String(myCab); });
      }

      var optC = '<option value="">-- pilih cabang --</option>';
      cabangs.forEach(function(c){
        optC += '<option value="' + esc(c.kode_cabang) + '">' + esc(c.kode_cabang) + ' - ' + esc(c.nama_cabang || '') + '</option>';
      });
      cabangSel.innerHTML = optC;
      if(cabangs.length === 1){
        cabangSel.value = cabangs[0].kode_cabang;
        cabangSel.dispatchEvent(new Event('change'));
      }

      cabangSel.addEventListener('change', function(){
        var kode = cabangSel.value;
        var filtered = users.filter(function(u){
          var jab = String(u.jabatan||'').toLowerCase();
          var del = String(u.dihapus||'').toLowerCase();
          var isDel = (del === 'true' || del === 'ya' || del === '1');
          var status = String(u.status||'').toLowerCase();
          if(status !== 'aktif' || isDel) return false;
          if(jab.indexOf('karyawan') === -1 && jab.indexOf('kepala') === -1) return false;
          if(!kode) return true;
          return String(u.kode_cabang||'') === String(kode);
        });
        var optU = '<option value="">-- pilih karyawan --</option>';
        filtered.forEach(function(u){
          optU += '<option value="' + esc(u.id) + '" data-nama="' + esc(u.nama) + '">' + esc(u.id) + ' - ' + esc(u.nama) + ' (' + esc(u.jabatan) + ')</option>';
        });
        karSel.innerHTML = optU;
      });
    }).catch(function(err){
      toast('Gagal load data: ' + err.message, 'error');
    });

    refreshPreview();
    loadListHariIni();

    /* ----- SIMPAN ----- */
    $('btnSimpan').onclick = function(){
      var btn = $('btnSimpan');
      var tanggal = $('inpTanggal').value;
      var kodeCab = cabangSel.value;
      var idKar = karSel.value;

      if(!tanggal){ toast('Tanggal wajib diisi', 'error'); return; }
      if(!kodeCab){ toast('Pilih cabang', 'error'); return; }
      if(!idKar){ toast('Pilih karyawan', 'error'); return; }

      var selOpt = karSel.options[karSel.selectedIndex];
      var namaKar = selOpt.getAttribute('data-nama') || '';

      var payloadBase = {
        tanggal: tanggal,
        kode_cabang: kodeCab,
        id_karyawan: String(idKar).trim(),
        nama_karyawan: String(namaKar).trim(),
        status_masuk: statusMasuk,
        unit: statusMasuk === 'ya' ? num($('inpUnit').value) : 0,
        tips: statusMasuk === 'ya' ? num($('inpTips').value) : 0,
        bonus: 0,
        kasbon: num($('inpKasbon').value),
        wifi: 1000,
        alasan: statusMasuk === 'ya' ? '' : $('inpAlasan').value,
        tembus_target: 'tidak',
        submission_id: submissionId
      };
      payloadBase.total = hitungTotal(payloadBase);

      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      // 1. cek Log_Submisi
      baca('Log_Submisi').then(function(resLog){
        var logs = (resLog && resLog.ok && Array.isArray(resLog.data)) ? resLog.data : [];
        var dup = logs.some(function(l){
          return String(l.submission_id||'') === submissionId;
        });
        if(dup){
          throw new Error('Submisi ini sudah pernah diproses (anti-dobel).');
        }
        // 2. cek Pendapatan_Harian kombinasi tanggal+cabang+karyawan
        return baca('Pendapatan_Harian');
      }).then(function(resP){
        var rows = (resP && resP.ok && Array.isArray(resP.data)) ? resP.data : [];
        var dup2 = rows.some(function(r){
          return String(r.tanggal||'').slice(0,10) === tanggal &&
                 String(r.kode_cabang||'').trim() === String(kodeCab).trim() &&
                 String(r.id_karyawan||'').trim() === String(idKar).trim();
        });
        if(dup2){
          throw new Error('Data untuk karyawan ini di tanggal & cabang yang sama sudah ada.');
        }
        // 3. tulis
        return tulis('Pendapatan_Harian', payloadBase);
      }).then(function(res){
        if(!res || !res.ok){
          throw new Error((res && res.pesan) || 'Gagal menyimpan.');
        }
        // 4. log submission
        return tulis('Log_Submisi', {
          submission_id: submissionId,
          timestamp: new Date().toISOString(),
          user_id: STATE.user.user_id,
          sheet: 'Pendapatan_Harian'
        });
      }).then(function(){
        toast('Data pendapatan tersimpan!', 'success');
        return cekBonusTembus(tanggal, kodeCab);
      }).then(function(){
        submissionId = uuidv4();
        $('inpUnit').value = 0;
        $('inpTips').value = 0;
        $('inpKasbon').value = 0;
        refreshPreview();
        loadListHariIni();
        btn.disabled = false;
        btn.textContent = '💾 Simpan Pendapatan';
      }).catch(function(err){
        toast(err.message || 'Terjadi kesalahan.', 'error');
        btn.disabled = false;
        btn.textContent = '💾 Simpan Pendapatan';
      });
    };
  }

  function cekBonusTembus(tanggal, kodeCab){
    return Promise.all([ baca('Pendapatan_Harian'), baca('Target_Cabang') ]).then(function(arr){
      var resP = arr[0], resT = arr[1];
      var rows = (resP && resP.ok && Array.isArray(resP.data)) ? resP.data : [];
      var targets = (resT && resT.ok && Array.isArray(resT.data)) ? resT.data : [];

      var targetRow = targets.find(function(t){
        return String(t.kode_cabang||'').trim() === String(kodeCab).trim();
      });
      if(!targetRow){ return; }
      var target = num(targetRow.target_harian);
      if(target <= 0) return;

      var filtered = rows.filter(function(r){
        return String(r.tanggal||'').slice(0,10) === tanggal &&
               String(r.kode_cabang||'').trim() === String(kodeCab).trim();
      });
      var sumUnit = filtered.reduce(function(a,b){ return a + num(b.unit); }, 0);

      if(sumUnit < target) return;

      // tembus: update semua
      var bonusKT = 10000, bonusKar = 5000;
      // coba ambil dari Pengaturan (opsional)
      baca('Pengaturan').then(function(resSet){
        var sets = (resSet && resSet.ok && Array.isArray(resSet.data)) ? resSet.data : [];
        sets.forEach(function(s){
          var k = String(s.kunci||'').toLowerCase();
          if(k === 'bonus_kt') bonusKT = num(s.nilai);
          if(k === 'bonus_karyawan') bonusKar = num(s.nilai);
        });
        applyBonus(filtered, bonusKT, bonusKar);
      }).catch(function(){
        applyBonus(filtered, bonusKT, bonusKar);
      });

      function applyBonus(rowsToUpdate, bKT, bKar){
        var promises = [];
        rowsToUpdate.forEach(function(r){
          var jab = String(r.nama_karyawan||'').toLowerCase();
          // Bonus berdasarkan jabatan di Users lebih akurat — untuk demo, pakai 5000 default
          var bonus = bKar;
          var masuk = String(r.status_masuk||'').toLowerCase();
          if(masuk !== 'ya') bonus = 0;
          var newData = {
            bonus: bonus,
            tembus_target: 'ya',
            total: hitungTotal(Object.assign({}, r, { bonus: bonus }))
          };
          promises.push(update('Pendapatan_Harian', r._row, newData));
        });
        return Promise.all(promises).then(function(){
          var totalBonus = rowsToUpdate.length * bKar;
          toast('🎉 TEMBUS TARGET! Total bonus Rp ' + totalBonus.toLocaleString('id-ID'), 'gold');
        });
      }
    });
  }

          var st = String(u.status||'').toLowerCase();
          var del = String(u.dihapus||'').toLowerCase();
          var isDel = (del === 'true' || del === 'ya' || del === '1');
          if(st !== 'aktif' || isDel) return false;
          if(jab.indexOf('karyawan') === -1 && jab.indexOf('kepala') === -1) return false;
          if(canEdit() && cabang && cabang !== '-'){
            return String(u.kode_cabang||'') === String(cabang);
          }
          if(!canEdit() && cabang && cabang !== '-'){
            return String(u.kode_cabang||'') === String(cabang);
          }
          return true;
        });

        var jobs = target.map(function(u){
          var rows = pend.filter(function(r){
            var t = String(r.tanggal||'').slice(0,10);
            return String(r.id_karyawan||'').trim() === String(u.id).trim() &&
                   t >= dari && t <= sampai;
          });
          var sumUnit = rows.reduce(function(a,b){ return a + num(b.unit); }, 0);
          var sumTips = rows.reduce(function(a,b){ return a + num(b.tips); }, 0);
          var sumBonus = rows.reduce(function(a,b){ return a + num(b.bonus); }, 0);
          var sumKasbon = rows.reduce(function(a,b){ return a + num(b.kasbon); }, 0);
          var sumWifi = rows.reduce(function(a,b){ return a + (num(b.wifi) || 1000); }, 0);
          var total = sumUnit + sumTips + sumBonus - sumKasbon - sumWifi;

          return tulis('Payroll', {
            periode_dari: dari,
            periode_sampai: sampai,
            id_karyawan: String(u.id),
            nama_karyawan: u.nama,
            jabatan: u.jabatan,
            kode_cabang: u.kode_cabang,
            total_unit: sumUnit,
            total_tips: sumTips,
            total_bonus: sumBonus,
            total_kasbon: sumKasbon,
            total_wifi: sumWifi,
            total_gaji: total,
            status: 'draft',
            timestamp: new Date().toISOString()
          });
        });

        return Promise.all(jobs);
      }).then(function(){
        toast('Payroll berhasil digenerate!', 'success');
        btn.disabled = false;
        btn.textContent = '⚙️ Generate Payroll';
        loadPr();
      }).catch(function(err){
        toast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = '⚙️ Generate Payroll';
      });
    };

    loadPr();

    function loadPr(){
      baca('Payroll').then(function(res){
        var rows = (res && res.ok && Array.isArray(res.data)) ? res.data : [];
        var filtered = rows;
        if(STATE.user.user_kode_cabang && STATE.user.user_kode_cabang !== '-' && !canEdit()){
          filtered = rows.filter(function(r){ return String(r.kode_cabang||'') === String(STATE.user.user_kode_cabang); });
        }
        filtered = filtered.slice(-50).reverse();
        var html = '<h2>📋 Data Payroll</h2>';
        if(filtered.length === 0){
          html += '<div class="empty-state"><div class="big">📭</div>Belum ada payroll</div>';
        }else{
          html += '<div class="table-wrap"><table><thead><tr><th>Periode</th><th>Nama</th><th>Unit</th><th>Total Gaji</th><th>Status</th></tr></thead><tbody>';
          filtered.forEach(function(r){
            html += '<tr>' +
              '<td>' + esc(String(r.periode_dari||'').slice(0,10)) + ' s/d ' + esc(String(r.periode_sampai||'').slice(0,10)) + '</td>' +
              '<td>' + esc(safe(r.nama_karyawan)) + '</td>' +
              '<td>' + num(r.total_unit) + '</td>' +
              '<td><strong>' + rupiah(num(r.total_gaji)) + '</strong></td>' +
              '<td><span class="badge badge-gray">' + esc(safe(r.status)) + '</span></td>' +
            '</tr>';
          });
          html += '</tbody></table></div>';
        }
        $('listPr').innerHTML = html;
      }).catch(function(err){
        $('listPr').innerHTML = '<h2>📋 Data Payroll</h2><div class="empty-state"><div class="big">⚠️</div>' + esc(err.message) + '</div>';
      });
    }
  }

  /* =====================================================
     LAPORAN CABANG
     ===================================================== */
  function renderLaporanCabang(){
    $('appContent').innerHTML = '' +
      '<button class="back-btn" id="btnBack">← Kembali</button>' +
      '<div class="page-title">🏪 Laporan Cabang</div>' +
      '<div class="page-sub">Rekap data cabang</div>' +
      '<div class="card" id="laporanCab"><div class="loading-box"><div class="spinner"></div><div>Memuat...</div></div></div>';

    $('btnBack').onclick = function(){ go('menu'); };

    Promise.all([ baca('Target_Cabang'), baca('Pendapatan_Harian') ]).then(function(arr){
      var cabangs = (arr[0] && arr[0].ok) ? arr[0].data : [];
      var pend = (arr[1] && arr[1].ok) ? arr[1].data : [];
      var today = todayStr();

      var html = '<h2>📊 Rekap per Cabang (Hari Ini)</h2>';
      cabangs.forEach(function(c){
        var rows = pend.filter(function(r){
          return String(r.kode_cabang||'') === String(c.kode_cabang||'') &&
                 String(r.tanggal||'').slice(0,10) === today;
        });
        var totalUnit = rows.reduce(function(a,b){ return a + num(b.unit); }, 0);
        var target = num(c.target_harian);
        var persen = target > 0 ? Math.min(100, Math.round(totalUnit / target * 100)) : 0;
        var tembus = target > 0 && totalUnit >= target;

        html += '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed #E5E7EB">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
            '<strong style="font-size:13px">' + esc(c.kode_cabang) + ' - ' + esc(safe(c.nama_cabang)) + '</strong>' +
            (tembus ? '<span class="badge badge-green">TEMBUS</span>' : '') +
          '</div>' +
          '<div class="info-row"><span class="lbl">Unit</span><span class="val">' + totalUnit + ' / ' + target + '</span></div>' +
          '<div class="info-row"><span class="lbl">Progress</span><span class="val">' + persen + '%</span></div>' +
          '<div style="height:8px;background:#E5E7EB;border-radius:4px;margin-top:6px;overflow:hidden">' +
            '<div style="height:100%;width:' + persen + '%;background:linear-gradient(90deg,var(--merah),var(--emas));border-radius:4px"></div>' +
          '</div>' +
        '</div>';
      });

      $('laporanCab').innerHTML = html;
    }).catch(function(err){
      $('laporanCab').innerHTML = '<div class="empty-state"><div class="big">⚠️</div>' + esc(err.message) + '</div>';
    });
  }

  /* =====================================================
     MANAJEMEN MANUSIA (OWNER)
     ===================================================== */
  function renderManajemenManusia(){
    $('appContent').innerHTML = '' +
      '<button class="back-btn" id="btnBack">← Kembali</button>' +
      '<div class="page-title">👥 Manajemen Manusia</div>' +
      '<div class="page-sub">Kelola data karyawan</div>' +
      '<button class="btn btn-primary" id="btnAddUser" style="margin-bottom:14px">➕ Tambah User</button>' +
      '<div class="card" id="listUsers"><div class="loading-box"><div class="spinner"></div><div>Memuat...</div></div></div>';

    $('btnBack').onclick = function(){ go('menu'); };
    $('btnAddUser').onclick = function(){ formUser(null); };

    loadUsers();

    function loadUsers(){
      baca('Users').then(function(res){
        var users = (res && res.ok && Array.isArray(res.data)) ? res.data : [];
        var html = '<h2>📋 Daftar User</h2>';
        if(users.length === 0){
          html += '<div class="empty-state"><div class="big">📭</div>Belum ada user</div>';
        }else{
          html += '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Nama</th><th>Jabatan</th><th>Cabang</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';
          users.forEach(function(u){
            var del = String(u.dihapus||'').toLowerCase();
            var isDel = (del === 'true' || del === 'ya' || del === '1');
            if(isDel) return;
            html += '<tr>' +
              '<td><strong>' + esc(safe(u.id)) + '</strong></td>' +
              '<td>' + esc(safe(u.nama)) + '</td>' +
              '<td>' + esc(safe(u.jabatan)) + '</td>' +
              '<td>' + esc(safe(u.kode_cabang)) + '</td>' +
              '<td><span class="badge ' + (String(u.status||'').toLowerCase() === 'aktif' ? 'badge-green' : 'badge-red') + '">' + esc(safe(u.status)) + '</span></td>' +
              '<td style="white-space:nowrap">' +
                '<button class="btn btn-sm btn-ghost" data-edit="' + esc(u.id) + '">✏️</button> ' +
                '<button class="btn btn-sm btn-danger" data-del="' + u._row + '">🗑️</button>' +
              '</td>' +
            '</tr>';
          });
          html += '</tbody></table></div>';
        }
        $('listUsers').innerHTML = html;

        $('listUsers').querySelectorAll('[data-edit]').forEach(function(b){
          b.onclick = function(){
            var uid = b.getAttribute('data-edit');
            var u = users.find(function(x){ return String(x.id) === String(uid); });
            if(u) formUser(u);
          };
        });
        $('listUsers').querySelectorAll('[data-del]').forEach(function(b){
          b.onclick = function(){
            if(!confirm('Yakin hapus user ini? (soft delete)')) return;
            update('Users', b.getAttribute('data-del'), { dihapus: 'true' })
              .then(function(){ toast('User dihapus', 'info'); loadUsers(); })
              .catch(function(e){ toast(e.message, 'error'); });
          };
        });
      }).catch(function(err){
        $('listUsers').innerHTML = '<div class="empty-state"><div class="big">⚠️</div>' + esc(err.message) + '</div>';
      });
    }

    function formUser(u){
      var isEdit = !!u;
      var idVal = isEdit ? String(u.id) : '';
      var namaVal = isEdit ? String(u.nama||'') : '';
      var jabVal = isEdit ? String(u.jabatan||'') : 'Karyawan';
      var cabVal = isEdit ? String(u.kode_cabang||'') : '';
      var passVal = '';
      var statusVal = isEdit ? String(u.status||'aktif') : 'aktif';

      openModal('' +
        '<h3>' + (isEdit ? '✏️ Edit User' : '➕ Tambah User') + '</h3>' +
        '<div class="form-group"><label>ID ' + (isEdit ? '(read-only)' : '') + '</label>' +
          '<input type="text" id="muId" value="' + esc(idVal) + '" ' + (isEdit ? 'disabled' : '') + '></div>' +
        '<div class="form-group"><label>Nama</label><input type="text" id="muNama" value="' + esc(namaVal) + '"></div>' +
        '<div class="form-group"><label>Jabatan</label>' +
          '<select id="muJabatan">' +
            '<option value="Owner"' + (jabVal==='Owner'?' selected':'') + '>Owner</option>' +
            '<option value="Admin"' + (jabVal==='Admin'?' selected':'') + '>Admin</option>' +
            '<option value="Kepala Toko"' + (jabVal==='Kepala Toko'?' selected':'') + '>Kepala Toko</option>' +
            '<option value="Karyawan"' + (jabVal==='Karyawan'?' selected':'') + '>Karyawan</option>' +
          '</select></div>' +
        '<div class="form-group"><label>Kode Cabang</label><input type="text" id="muCabang" value="' + esc(cabVal) + '"></div>' +
        '<div class="form-group"><label>Password ' + (isEdit ? '(kosongkan jika tidak diubah)' : '(min 6 karakter)') + '</label>' +
          '<input type="text" id="muPass" value="' + esc(passVal) + '"></div>' +
        '<div class="form-group"><label>Status</label>' +
          '<select id="muStatus">' +
            '<option value="aktif"' + (statusVal==='aktif'?' selected':'') + '>Aktif</option>' +
            '<option value="nonaktif"' + (statusVal==='nonaktif'?' selected':'') + '>Nonaktif</option>' +
          '</select></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="muCancel">Batal</button>' +
          '<button class="btn btn-primary" id="muSave">Simpan</button>' +
        '</div>'
      );

      $('muCancel').onclick = closeModal;
      $('muSave').onclick = function(){
        var id = isEdit ? idVal : $('muId').value.trim();
        var nama = $('muNama').value.trim();
        var jabatan = $('muJabatan').value;
        var cabang = $('muCabang').value.trim();
        var pass = $('muPass').value.trim();
        var status = $('muStatus').value;

        if(!id || !nama){ toast('ID & Nama wajib', 'error'); return; }
        if(!isEdit && pass.length < 6){ toast('Password min 6 karakter', 'error'); return; }
        if(isEdit && pass && pass.length < 6){ toast('Password min 6 karakter', 'error'); return; }

        var data = {
          id: id, nama: nama, jabatan: jabatan,
          kode_cabang: cabang, status: status
        };
        if(pass) data.password = pass;

        var p;
        if(isEdit){
          p = update('Users', u._row, data);
        }else{
          data.tanggal_masuk = todayStr();
          data.dihapus = 'false';
          p = tulis('Users', data);
        }
        p.then(function(res){
          if(!res || !res.ok) throw new Error((res && res.pesan) || 'Gagal simpan.');
          toast('User disimpan!', 'success');
          closeModal();
          loadUsers();
        }).catch(function(err){ toast(err.message, 'error'); });
      };
    }
  }

  /* =====================================================
     PENGATURAN (OWNER)
     ===================================================== */
  function renderPengaturan(){
    $('appContent').innerHTML = '' +
      '<button class="back-btn" id="btnBack">← Kembali</button>' +
      '<div class="page-title">⚙️ Pengaturan</div>' +
      '<div class="page-sub">Konfigurasi global</div>' +
      '<div class="card">' +
        '<h2>💰 Bonus & WiFi</h2>' +
        '<div class="form-group"><label>Bonus Kepala Toko (Rp)</label><input type="number" id="setBonusKT" value="10000"></div>' +
        '<div class="form-group"><label>Bonus Karyawan (Rp)</label><input type="number" id="setBonusKar" value="5000"></div>' +
        '<div class="form-group"><label>WiFi Harian (Rp)</label><input type="number" id="setWifi" value="1000"></div>' +
        '<button class="btn btn-primary" id="btnSimpanSet" style="width:100%">💾 Simpan Pengaturan</button>' +
      '</div>' +
      '<div class="card" id="setCabang"><h2>🏪 Target Cabang</h2><div class="loading-box"><div class="spinner"></div><div>Memuat...</div></div></div>';

    $('btnBack').onclick = function(){ go('menu'); };

    // load Pengaturan
    baca('Pengaturan').then(function(res){
      var sets = (res && res.ok && Array.isArray(res.data)) ? res.data : [];
      sets.forEach(function(s){
        var k = String(s.kunci||'').toLowerCase();
        if(k === 'bonus_kt') $('setBonusKT').value = num(s.nilai);
        if(k === 'bonus_karyawan') $('setBonusKar').value = num(s.nilai);
        if(k === 'wifi_harian') $('setWifi').value = num(s.nilai);
      });
    }).catch(function(){});

    $('btnSimpanSet').onclick = function(){
      var btn = $('btnSimpanSet');
      btn.disabled = true;
      var jobs = [
        simpanPengaturan('bonus_kt', num($('setBonusKT').value)),
        simpanPengaturan('bonus_karyawan', num($('setBonusKar').value)),
        simpanPengaturan('wifi_harian', num($('setWifi').value))
      ];
      Promise.all(jobs).then(function(){
        toast('Pengaturan tersimpan!', 'success');
        btn.disabled = false;
      }).catch(function(err){
        toast(err.message, 'error');
        btn.disabled = false;
      });
    };

    function simpanPengaturan(kunci, nilai){
      return baca('Pengaturan').then(function(res){
        var sets = (res && res.ok && Array.isArray(res.data)) ? res.data : [];
        var found = sets.find(function(s){ return String(s.kunci||'').toLowerCase() === kunci; });
        if(found){
          return update('Pengaturan', found._row, { kunci: kunci, nilai: nilai });
        }else{
          return tulis('Pengaturan', { kunci: kunci, nilai: nilai });
        }
      });
    }

    // Target cabang
    baca('Target_Cabang').then(function(res){
      var cabs = (res && res.ok && Array.isArray(res.data)) ? res.data : [];
      var html = '<h2>🏪 Target Cabang</h2>';
      if(cabs.length === 0){
        html += '<div class="empty-state"><div class="big">📭</div>Belum ada cabang</div>';
      }else{
        cabs.forEach(function(c){
          html += '<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px">' +
            '<div style="flex:1"><label style="font-size:11px;color:var(--abu);font-weight:600">' + esc(safe(c.kode_cabang)) + ' - ' + esc(safe(c.nama_cabang)) + '</label>' +
            '<input type="number" class="target-input" data-row="' + c._row + '" value="' + num(c.target_harian) + '" style="width:100%;padding:9px;border:1.5px solid #E5E7EB;border-radius:9px;font-family:inherit;font-size:14px"></div>' +
            '<button class="btn btn-sm btn-gold target-save" data-row="' + c._row + '">💾</button>' +
          '</div>';
        });
      }
      $('setCabang').innerHTML = html;

      $('setCabang').querySelectorAll('.target-save').forEach(function(b){
        b.onclick = function(){
          var row = b.getAttribute('data-row');
          var input = $('setCabang').querySelector('.target-input[data-row="' + row + '"]');
          update('Target_Cabang', row, { target_harian: num(input.value) })
            .then(function(){ toast('Target diperbarui', 'success'); })
            .catch(function(e){ toast(e.message, 'error'); });
        };
      });
    }).catch(function(err){
      $('setCabang').innerHTML = '<h2>🏪 Target Cabang</h2><div class="empty-state"><div class="big">⚠️</div>' + esc(err.message) + '</div>';
    });
  }

  /* =====================================================
     BOOT
     ===================================================== */
  renderHeader();
  renderNav();
  go('menu');

})();
</script>
