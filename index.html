<style>
/* ========== RESET ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: linear-gradient(160deg, #C8102E 0%, #8B0000 35%, #ffffff 35.1%, #F9FAFB 100%);
  background-attachment: fixed;
}

/* ========== CARD ========== */
.card {
  background: #ffffff;
  max-width: 400px;
  width: 100%;
  padding: 28px 22px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
  animation: fadeUp 0.5s ease;
  position: relative;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ========== LOGO AREA ========== */
.logo-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 18px;
  position: relative;
  width: 80px;
  height: 80px;
  margin-left: auto;
  margin-right: auto;
}

.logo-svg {
  width: 80px;
  height: 80px;
  animation: glowPulse 2s ease-in-out infinite;
  transition: transform 0.3s ease, filter 0.3s ease;
  position: relative;
  z-index: 2;
}

.logo-svg:hover {
  transform: scale(1.05);
  filter: drop-shadow(0 4px 20px rgba(200, 16, 46, 0.6))
          drop-shadow(0 0 40px rgba(251, 191, 36, 0.8));
}

@keyframes glowPulse {
  0%, 100% {
    filter: drop-shadow(0 4px 12px rgba(200, 16, 46, 0.3))
            drop-shadow(0 0 20px rgba(251, 191, 36, 0.3));
  }
  50% {
    filter: drop-shadow(0 4px 16px rgba(200, 16, 46, 0.5))
            drop-shadow(0 0 32px rgba(251, 191, 36, 0.6));
  }
}

/* ========== SPARKLE ========== */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #FBBF24;
  border-radius: 50%;
  animation: sparkleAnim 2s infinite;
  pointer-events: none;
  z-index: 3;
}

.sp1 { top: 10%; left: 5%; animation-delay: 0s; }
.sp2 { top: 5%; right: 10%; animation-delay: 0.4s; }
.sp3 { bottom: 15%; left: 0%; animation-delay: 0.8s; }
.sp4 { bottom: 5%; right: 5%; animation-delay: 1.2s; }
.sp5 { top: 0%; left: 50%; animation-delay: 1.6s; }

@keyframes sparkleAnim {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1); }
}

/* ========== JUDUL ========== */
.app-title {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  color: #C8102E;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.app-tagline {
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  color: #6B7280;
  margin-bottom: 24px;
  line-height: 1.4;
}

.app-tagline .highlight {
  color: #F59E0B;
  font-weight: 700;
}

/* ========== ERROR ========== */
.error-msg {
  display: none;
  background: #FEF2F2;
  color: #B91C1C;
  border-left: 3px solid #C8102E;
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
  animation: shake 0.4s ease;
}

.error-msg.show {
  display: block;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ========== FIELD ========== */
.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 14px 44px 14px 14px;
  border: 1.5px solid #E5E7EB;
  border-radius: 8px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: #1F2937;
  min-height: 48px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: #fff;
}

.field input:focus {
  border-color: #C8102E;
  box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
}

.field input::placeholder {
  color: #9CA3AF;
}

/* ========== PASSWORD TOGGLE ========== */
.pass-wrapper {
  position: relative;
}

.toggle-pass {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  color: #6B7280;
  transition: color 0.2s;
}

.toggle-pass:hover {
  color: #C8102E;
}

/* ========== TOMBOL ========== */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 700;
  min-height: 48px;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: linear-gradient(135deg, #C8102E, #A00D25);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(200, 16, 46, 0.35);
}

.btn-primary:hover {
  box-shadow: 0 6px 20px rgba(200, 16, 46, 0.45);
}

.btn-primary:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

.btn-outline {
  background: #ffffff;
  border: 2px solid #F59E0B;
  color: #B45309;
  margin-top: 10px;
}

.btn-outline:hover {
  background: #FFFBEB;
}

/* ========== SPINNER ========== */
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========== MODAL DEMO ========== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: #ffffff;
  max-width: 400px;
  width: 100%;
  padding: 22px;
  border-radius: 16px;
  animation: fadeUp 0.3s ease;
}

.modal h3 {
  font-size: 18px;
  font-weight: 700;
  color: #1F2937;
  margin-bottom: 4px;
}

.modal p {
  font-size: 12px;
  color: #6B7280;
  margin-bottom: 16px;
}

.role-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  margin-bottom: 10px;
  transition: all 0.2s;
  font-family: 'Poppins', sans-serif;
  text-align: left;
}

.role-btn:hover {
  border-color: #F59E0B;
  background: #FFFBEB;
}

.role-btn:active {
  transform: scale(0.98);
}

.role-icon {
  font-size: 22px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FEF2F2;
  border-radius: 8px;
  flex-shrink: 0;
}

.role-info strong {
  display: block;
  font-size: 14px;
  font-weight: 700;
  color: #1F2937;
}

.role-info span {
  font-size: 11px;
  color: #6B7280;
}

.modal-close {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: none;
  border-radius: 8px;
  background: #F3F4F6;
  color: #6B7280;
  font-family: 'Poppins', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.modal-close:hover {
  background: #E5E7EB;
}

/* ========== FOOTER ========== */
.footer {
  text-align: center;
  font-size: 11px;
  color: #9CA3AF;
  margin-top: 20px;
  font-weight: 400;
}

/* ========== LOADING IKLAN ========== */
#iklanLoading {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

@keyframes iklanFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.iklan-content {
  text-align: center;
  padding: 24px;
  max-width: 380px;
}

.iklan-spinner {
  width: 60px;
  height: 60px;

  border-radius: 50%;

  margin: 0 auto 24px;
}

@keyframes iklanSpin {

}

.iklan-title {
  color: #ffffff;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
}

.iklan-kata {

  font-size: 13px;
  font-weight: 400;

.iklan-footer {

/* ============================================================
   HELPER: API
   ============================================================ */
function apiPost(action, data) {
  return fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ action: action, token: TOKEN }, data)),
    redirect: 'follow'
  })
  .then(function(res) { return res.text(); })
  .then(function(text) {
    try {
      return JSON.parse(text);
    } catch (e) {
      return { ok: false, pesan: 'Respons server tidak valid' };
    }
  })
  .catch(function(err) {
    console.error('API Error:', err);
    return { ok: false, pesan: 'Gagal terhubung ke server' };
  });
}

/* ============================================================
   HELPER: SESSION
   ============================================================ */
function getSession() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var session = JSON.parse(raw);
    if (!session || !session.login_time) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    var now = Date.now();
    var maxAge = session.is_demo ? (5 * 60 * 1000) : (8 * 60 * 60 * 1000);
    if (now - session.login_time > maxAge) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return session;
  } catch (e) {
    localStorage.removeItem(SESSION_KEY);
    return null;
  }
}

function saveSession(obj) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(obj));
}

/* ============================================================
   HELPER: ERROR
   ============================================================ */
function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'shake 0.4s ease';
}

function hideError() {
  var el = document.getElementById('errorMsg');
  el.classList.remove('show');
  el.textContent = '';
}

/* ============================================================
   HELPER: IKLAN
   ============================================================ */
function getKataIklanRandom(isAdmin) {
  var arr = isAdmin ? KATA_IKLAN_ADMIN : KATA_IKLAN_UMUM;
  var lastIdx = parseInt(localStorage.getItem('last_kata_iklan') || '-1', 10);
  var idx;
  var maxTry = 20;
  do {
    idx = Math.floor(Math.random() * arr.length);
    maxTry--;
  } while (idx === lastIdx && maxTry > 0 && arr.length > 1);
  localStorage.setItem('last_kata_iklan', String(idx));
  return arr[idx];
}

function getUrlIklanRandom() {
  return Math.random() < 0.5 ? IKLAN_URL_MONETAG : IKLAN_URL_ADSTERRA;
}

function tampilkanLoadingIklan(kataIklan) {
  var old = document.getElementById('iklanLoading');
  if (old) old.remove();

  var overlay = document.createElement('div');
  overlay.id = 'iklanLoading';
  overlay.innerHTML =
    '<div class="iklan-content">' +
      '<div class="iklan-spinner"></div>' +
      '<div class="iklan-title">Mohon Tunggu Sebentar</div>' +
      '<div class="iklan-kata">' + kataIklan + '</div>' +
      '<div class="iklan-sub">Sedang memuat iklan...</div>' +
      '<div class="iklan-footer">Iklan wajib · Tidak dapat dilewati</div>' +
    '</div>';
  document.body.appendChild(overlay);
  return overlay;
}

function tutupLoadingIklan() {
  var el = document.getElementById('iklanLoading');
  if (el) el.remove();
}

function triggerIklan() {
  try {
    window.open(getUrlIklanRandom(), '_blank');
  } catch (e) {
    console.error('Gagal buka iklan web:', e);
  }
  try {
    if (typeof AndroidAds !== 'undefined' && AndroidAds && typeof AndroidAds.showInterstitial === 'function') {
      AndroidAds.showInterstitial();
    }
  } catch (e) {
    console.error('Gagal tampilkan iklan Android:', e);
  }
  try {
    localStorage.setItem('last_ad_klik', String(Date.now()));
  } catch (e) {}
}

/* ============================================================
   HANDLE LOGIN
   ============================================================ */
function handleLogin() {
  hideError();

  var idInput = document.getElementById('userId').value.trim();
  var passInput = document.getElementById('userPass').value.trim();

  if (!idInput) {
    showError('ID Pengguna tidak boleh kosong');
    document.getElementById('userId').focus();
    return;
  }
  if (!passInput) {
    showError('Password tidak boleh kosong');
    document.getElementById('userPass').focus();
    return;
  }

  var btn = document.getElementById('btnMasuk');
  var btnText = document.getElementById('btnMasukText');

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Memeriksa...';

  apiPost('baca', { sheet: 'Users' })
    .then(function(res) {
      if (!res || res.ok !== true) {
        throw new Error((res && res.pesan) ? res.pesan : 'Gagal membaca data user');
      }

      var users = res.data || res.rows || res.users || [];
      if (!Array.isArray(users)) users = [];

      var found = null;
      for (var i = 0; i < users.length; i++) {
        var u = users[i];
        if (!u) continue;

        var uid = String(u.id || '').trim();
        var upass = String(u.password || '').trim();
        var ustatus = String(u.status || '').trim().toLowerCase();
        var udihapus = u.dihapus === true || String(u.dihapus).toLowerCase() === 'true';

        if (uid === idInput && upass === passInput && ustatus === 'aktif' && !udihapus) {
          found = u;
          break;
        }
      }

      if (!found) {
        throw new Error('ID atau Password salah');
      }

      var jabatan = String(found.jabatan || 'Karyawan').trim();
      var isOwner = jabatan.toLowerCase() === 'owner';

      var session = {
        user_id: String(found.id || idInput),
        user_nama: String(found.nama || found.id || idInput),
        user_jabatan: jabatan,
        kode_cabang: String(found.kode_cabang || '-'),
        is_demo: false,
        login_time: Date.now()
      };

      saveSession(session);

      if (isOwner) {
        window.location.href = 'dashboard.html';
      } else {
        var isAdmin = jabatan.toLowerCase() === 'admin';
        var kata = getKataIklanRandom(isAdmin);
        tampilkanLoadingIklan(kata);

        triggerIklan();

        setTimeout(function() {
          tutupLoadingIklan();
          window.location.href = 'dashboard.html';
        }, IKLAN_DURASI);
      }
    })
    .catch(function(err) {
      showError(err.message || 'Terjadi kesalahan');
      btn.disabled = false;
      btnText.textContent = 'MASUK';
    });
}

/* ============================================================
   DEMO
   ============================================================ */
function bukaModalDemo() {
  hideError();
  document.getElementById('modalDemo').classList.add('show');
}

function tutupModalDemo() {
  document.getElementById('modalDemo').classList.remove('show');
}

function mulaiDemo(role) {
  tutupModalDemo();

  var session = {
    user_id: 'demo_' + role.toLowerCase().replace(/\s/g, '_'),
    user_nama: 'Demo ' + role,
    user_jabatan: role,
    kode_cabang: '-',
    is_demo: true,
    login_time: Date.now()
  };

  saveSession(session);

  var kata = getKataIklanRandom(false);
  tampilkanLoadingIklan(kata);

  triggerIklan();

  setTimeout(function() {
    tutupLoadingIklan();
    window.location.href = 'dashboard.html';
  }, IKLAN_DURASI);
}

/* ============================================================
   TOGGLE PASSWORD
   ============================================================ */
document.getElementById('togglePass').addEventListener('click', function() {
  var input = document.getElementById('userPass');
  if (input.type === 'password') {
    input.type = 'text';
    this.textContent = '🙈';
  } else {
    input.type = 'password';
    this.textContent = '👁';
  }
});

/* ============================================================
   ENTER KEY
   ============================================================ */
document.getElementById('userId').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('userPass').focus();
  }
});

document.getElementById('userPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    handleLogin();
  }
});

/* ============================================================
   CEK SESSION SAAT LOAD
   ============================================================ */
(function cekSessionAwal() {
  var session = getSession();
  if (session) {
    window.location.href = 'dashboard.html';
  }
})();

/* ============================================================
   MODAL CLOSE ON OVERLAY CLICK
   ============================================================ */
document.getElementById('modalDemo').addEventListener('click', function(e) {
  if (e.target === this) {
    tutupModalDemo();
  }
});
