<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<title>STEAM MP 7000 — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:#F9FAFB;color:#1F2937;
  padding-top:64px;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
:root{
  --primary:#C8102E;--primary-dark:#8B0000;--primary-light:#A00D25;
  --gold:#FBBF24;--gold-dark:#F59E0B;--gold-light:#FFFBEB;
  --bg:#F9FAFB;--card:#FFFFFF;
  --text:#1F2937;--muted:#6B7280;
  --success:#059669;--error:#DC2626;--warning:#D97706;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
/* ============ HEADER ============ */
.header{
  position:fixed;top:0;left:0;right:0;height:64px;z-index:900;
  background:linear-gradient(135deg,#C8102E 0%,#A00D25 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mp{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#FBBF24,#F59E0B);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#7C2D12;letter-spacing:-.5px;
}
.header-info{min-width:0}
.header-info .nama{
  font-size:13.5px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;
}
.header-info .jabatan{font-size:10.5px;color:#FECACA;font-weight:500}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;
  background:rgba(255,255,255,.18);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.3)}
/* ============ MAIN ============ */
.main{padding:16px;max-width:1100px;margin:0 auto}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ============ CARD ============ */
.card{
  background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:14px;border:1px solid #F3F4F6;
}
.card-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .ic{font-size:17px}
/* ============ SAPAAN ============ */
.sapaan{font-size:20px;font-weight:700;margin-bottom:2px;line-height:1.3}
.sapaan-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;font-weight:400}
/* ============ MOTIVASI ============ */
.card-motivasi{
  background:linear-gradient(135deg,#FFFBEB 0%,#FEF3C7 100%);
  border:1.5px solid #F59E0B;border-radius:var(--radius);
  padding:14px;margin-bottom:14px;max-height:100px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;
}
.card-motivasi .mot-head{
  display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;
  color:#92400E;letter-spacing:.6px;margin-bottom:5px;
}
.card-motivasi .mot-isi{
  font-size:12.5px;font-style:italic;color:#78350F;line-height:1.5;
  font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card-motivasi .mot-foot{font-size:10px;color:#B45309;margin-top:5px;font-weight:600}
/* ============ DANA EXPANSI CARD ============ */
.card-expansi{
  background:linear-gradient(135deg,#FEF2F2 0%,#FEE2E2 100%);
  border:1.5px solid #FCA5A5;border-radius:var(--radius);
  padding:14px;margin-bottom:14px;
}
.card-expansi .exp-head{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:#991B1B;letter-spacing:.6px;margin-bottom:6px}
.card-expansi .exp-saldo{font-size:19px;font-weight:800;color:#7F1D1D}
.card-expansi .exp-target{font-size:10.5px;color:#B91C1C;margin-top:2px}
.progress-bar{height:8px;background:#FECACA;border-radius:99px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#FBBF24,#F59E0B);border-radius:99px;transition:width .6s ease}
/* ============ STAT GRID ============ */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);border:1px solid #F3F4F6;
}
.stat-card .st-label{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat-card .st-val{font-size:16px;font-weight:800;margin-top:5px;color:var(--primary)}
.stat-card .st-val.gold{color:#B45309}
/* ============ MENU GRID ============ */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.menu-card{
  background:#fff;border-radius:var(--radius);padding:14px 12px;
  box-shadow:var(--shadow);border:1px solid #F3F4F6;cursor:pointer;
  transition:.18s;display:flex;flex-direction:column;gap:5px;
}
.menu-card:active{transform:scale(.97);background:#FAFAFA}
.menu-card.highlight{
  background:linear-gradient(135deg,#FFFBEB,#FEF3C7);
  border:1.5px solid #FBBF24;
}
.menu-card .mc-ic{font-size:22px}
.menu-card .mc-nama{font-size:12.5px;font-weight:700;line-height:1.25}
.menu-card .mc-desc{font-size:10px;color:var(--muted);line-height:1.3}
/* ============ DONASI ============ */
.card-donasi{
  background:linear-gradient(135deg,#FFFBEB 0%,#FEF9E7 100%);
  border:1.5px dashed #F59E0B;border-radius:var(--radius);
  padding:15px;margin-bottom:14px;text-align:center;
}
.card-donasi .don-head{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;color:#92400E;letter-spacing:.5px;margin-bottom:7px}
.card-donasi .don-teks{font-size:11.5px;color:#78350F;line-height:1.5;margin-bottom:11px;font-style:italic}
/* ============ BUTTONS ============ */
.btn{
  border:none;border-radius:10px;padding:11px 16px;font-family:inherit;
  font-size:12.5px;font-weight:700;cursor:pointer;transition:.18s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  width:100%;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#C8102E,#A00D25);color:#fff;box-shadow:0 3px 10px rgba(200,16,46,.28)}
.btn-gold{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#7C2D12;box-shadow:0 3px 10px rgba(245,158,11,.3)}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-danger{background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff}
.btn-gray{background:#F3F4F6;color:#374151;border:1px solid #E5E7EB}
.btn-sm{padding:8px 12px;font-size:11.5px;width:auto;border-radius:8px}
.btn-xs{padding:6px 10px;font-size:10.5px;width:auto;border-radius:7px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
/* ============ FORM ============ */
.form-group{margin-bottom:12px}
.form-label{font-size:11.5px;font-weight:600;color:#374151;margin-bottom:5px;display:block}
.form-input,.form-select,.form-textarea{
  width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:10px;
  font-family:inherit;font-size:13px;color:var(--text);background:#fff;
  transition:.18s;outline:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px rgba(200,16,46,.08);
}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-hint{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
/* ============ BADGE ============ */
.badge{
  display:inline-block;padding:3px 9px;border-radius:99px;
  font-size:9.5px;font-weight:700;letter-spacing:.2px;
}
.badge-success{background:#D1FAE5;color:#065F46}
.badge-warning{background:#FEF3C7;color:#92400E}
.badge-error{background:#FEE2E2;color:#991B1B}
.badge-info{background:#DBEAFE;color:#1E40AF}
.badge-gray{background:#F3F4F6;color:#4B5563}
.badge-gold{background:#FEF3C7;color:#92400E;border:1px solid #FBBF24}
/* ============ TABLE ============ */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid #F3F4F6}
table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:480px}
thead{background:#F9FAFB}
th{
  padding:9px 10px;text-align:left;font-weight:700;color:#374151;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;
  white-space:nowrap;border-bottom:1.5px solid #E5E7EB;
}
td{padding:9px 10px;border-bottom:1px solid #F3F4F6;color:#4B5563;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:active{background:#FAFAFA}
/* ============ TOTAL BANNER ============ */
.total-banner{
  background:linear-gradient(135deg,#C8102E,#8B0000);color:#fff;
  border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:0 4px 14px rgba(139,0,0,.3);
}
.total-banner .tb-label{font-size:10.5px;opacity:.85;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.total-banner .tb-val{font-size:24px;font-weight:800;margin-top:4px}
.total-banner .tb-sub{font-size:11px;opacity:.8;margin-top:3px}
/* ============ INFO ROW ============ */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F3F4F6;font-size:12.5px}
.info-row:last-child{border-bottom:none}
.info-row .ir-label{color:var(--muted);font-weight:500}
.info-row .ir-val{font-weight:700;color:var(--text);text-align:right}
/* ============ TABS ============ */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:8px 14px;border-radius:99px;border:1.5px solid #E5E7EB;
  background:#fff;font-size:11.5px;font-weight:600;color:var(--muted);
  cursor:pointer;transition:.18s;font-family:inherit;white-space:nowrap;
}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(200,16,46,.25)}
.tab:active{transform:scale(.96)}
/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:900;
  background:#fff;border-top:1px solid #F3F4F6;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px;border:none;background:none;cursor:pointer;
  color:var(--muted);font-family:inherit;transition:.18s;border-radius:10px;
}
.bn-item .bn-ic{font-size:19px;line-height:1}
.bn-item .bn-label{font-size:9.5px;font-weight:600}
.bn-item.active{color:var(--primary)}
.bn-item.active .bn-ic{transform:scale(1.1)}
.bn-item:active{background:#FEF2F2}
/* ============ TOAST ============ */
.toast-box{
  position:fixed;bottom:calc(110px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);z-index:2000;
  background:#1F2937;color:#fff;padding:11px 18px;border-radius:12px;
  font-size:12.5px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center;
}
.toast-box.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-box.success{background:linear-gradient(135deg,#059669,#047857)}
.toast-box.error{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.toast-box.warning{background:linear-gradient(135deg,#D97706,#B45309)}
/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.5);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  animation:slideUp .28s ease;
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:15px;font-weight:700}
.modal-close{
  width:32px;height:32px;border-radius:9px;border:none;background:#F3F4F6;
  font-size:16px;cursor:pointer;color:#4B5563;display:flex;align-items:center;justify-content:center;
}
/* ============ LOADING IKLAN ============ */
.loading-iklan{
  position:fixed;inset:0;z-index:3000;
  background:linear-gradient(135deg,#C8102E 0%,#8B0000 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center;
}
.loading-iklan.show{display:flex}
.li-spinner{
  width:48px;height:48px;border:4px solid rgba(255,255,255,.25);
  border-top-color:#FBBF24;border-radius:50%;animation:spin 1s linear infinite;
  margin-bottom:18px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.li-teks{color:#fff;font-size:13.5px;font-weight:600;line-height:1.6;max-width:340px;font-style:italic}
.li-sub{color:#FECACA;font-size:11px;margin-top:14px;font-weight:500}
.li-bar{width:180px;height:5px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:20px}
.li-bar-fill{height:100%;background:#FBBF24;width:0;animation:loadBar 3s linear forwards}
@keyframes loadBar{from{width:0}to{width:100%}}
/* ============ MISC ============ */
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .em-ic{font-size:38px;display:block;margin-bottom:10px;opacity:.5}
.empty .em-txt{font-size:12.5px;font-weight:500}
.divider{height:1px;background:#F3F4F6;margin:12px 0}
.sec-title{font-size:13px;font-weight:700;margin:16px 0 10px;color:#374151;display:flex;align-items:center;gap:7px}
.role-note{
  background:#FEF3C7;border-left:4px solid #F59E0B;border-radius:8px;
  padding:11px 13px;font-size:11.5px;color:#78350F;line-height:1.5;margin-bottom:14px;
}
.tag-cabang{
  display:inline-block;padding:2px 8px;border-radius:6px;background:#EEF2FF;
  color:#4338CA;font-size:10px;font-weight:700;
}
.mono{font-family:'Courier New',monospace;font-weight:700;letter-spacing:1px}
.code-box{
  background:#F3F4F6;border:1.5px dashed #D1D5DB;border-radius:10px;
  padding:12px;font-family:'Courier New',monospace;font-size:15px;font-weight:800;
  letter-spacing:2px;text-align:center;color:#111827;word-break:break-all;margin:8px 0;
}
.check-row{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.5;color:#374151;cursor:pointer}
.check-row input{width:17px;height:17px;margin-top:1px;accent-color:var(--primary);flex-shrink:0}
@media(min-width:600px){
  .menu-grid{grid-template-columns:repeat(3,1fr)}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:900px){
  .menu-grid{grid-template-columns:repeat(4,1fr)}
  .main{padding:20px}
}
</style>
</head>

function getSession(){
  try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}
}
function isDemo(){var s=getSession();return s&&s.mode==='demo'}
function isOwner(){var s=getSession();return s&&s.jabatan==='Owner'}
function isAdmin(){var s=getSession();return s&&s.jabatan==='Admin'}
function isKepalaToko(){var s=getSession();return s&&s.jabatan==='Kepala Toko'}
function isKaryawan(){var s=getSession();return s&&s.jabatan==='Karyawan'}
function bisaIklan(){return !isOwner()}
function canInputPendapatan(){return isOwner()||isAdmin()||isKepalaToko()}
function canAccIzinTahap1(){return isKepalaToko()}
function canAccIzinTahap2(){return isOwner()||isAdmin()}
function canAksesManusia(){return isOwner()}
function canKelolaData(){return isOwner()||isAdmin()}
function canAksesHR(){return isOwner()||isAdmin()}
function canAksesDanaExpansi(){return isOwner()||isAdmin()}
function canKonfirmasiSetoran(){return isKepalaToko()}
function canAccSetoran(){return isOwner()||isAdmin()}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowISO(){return new Date().toISOString()}
function fmtRupiah(n){n=Number(n)||0;return 'Rp '+n.toLocaleString('id-ID')}
function fmtAngka(n){return (Number(n)||0).toLocaleString('id-ID')}
function generateSubmissionId(prefix){return (prefix||'SUB')+'-'+Date.now()+'-'+Math.floor(Math.random()*9000+1000)}

function showToast(msg,type){
  var t=document.getElementById('toastBox');
  t.textContent=msg;t.className='toast-box show '+(type||'');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.classList.remove('show')},2800);
}

   API
   ═══════════════════════════════════════════════════════════ */
async function apiPost(action,data){
  try{
    var body=Object.assign({action:action,token:TOKEN},data||{});
    var res=await fetch(BACKEND_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body)
    });
    var json=await res.json();
    return json;
  }catch(e){
    return{ok:false,pesan:'Koneksi gagal: '+e.message,data:[]};
  }
}
async function ambilData(sheet){
  if(isDemo()){
    return{ok:true,data:DUMMY_DATA[sheet]||[]};
  }
  var r=await apiPost('baca',{sheet:sheet});
  return r;
}
async function simpanData(sheet,data){
  if(isDemo()){showToast('Mode demo tidak bisa menyimpan','warning');return{ok:false}}
  var r=await apiPost('tulis_unik',{sheet:sheet,data:data});
  return r;
}
async function updateData(sheet,row,data){
  if(isDemo()){showToast('Mode demo tidak bisa mengedit','warning');return{ok:false}}
  var r=await apiPost('update',{sheet:sheet,row:row,data:data});
  return r;
}
async function hapusData(sheet,row){
  if(isDemo()){showToast('Mode demo tidak bisa menghapus','warning');return{ok:false}}
  var r=await apiPost('hapus',{sheet:sheet,row:row});
  return r;
}

function getUrlIklanRandom(){
  return Math.random()<0.5?IKLAN_URL_MONETAG:IKLAN_URL_ADSTERRA;
}
function paksaIklan(callback){
  if(!bisaIklan()){if(callback)callback();return}
  var loading=document.getElementById('loadingIklan');
  var teks=document.getElementById('liTeks');
  var kata;
  if(isAdmin())kata=KATA_IKLAN_ADMIN[Math.floor(Math.random()*KATA_IKLAN_ADMIN.length)];
  else kata=KATA_IKLAN_UMUM[Math.floor(Math.random()*KATA_IKLAN_UMUM.length)];
  teks.textContent=kata;
  loading.classList.add('show');
  var url=getUrlIklanRandom();
  try{
    if(window.AndroidAds&&typeof window.AndroidAds.showAd==='function'){
      window.AndroidAds.showAd(url);
    }else{
      window.open(url,'_blank');
    }
  }catch(e){}
  setTimeout(function(){
    loading.classList.remove('show');
    if(callback)callback();
  },IKLAN_DURASI);
}

  else if(isAdmin())donTeks='Setiap iklan yang kamu tonton bantu keluarga kami sedikit demi sedikit. Terima kasih 🙏';

async function tabOperasional(btn,tab){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  if(btn)btn.classList.add('active');
  var el=document.getElementById('tabOpContent');
  el.innerHTML='<div class="empty"><div class="em-txt">Memuat...</div></div>';
  if(tab==='input')await renderFormInputPendapatan(el);
  else if(tab==='pengeluaran')await renderFormPengeluaran(el);
  else if(tab==='unit')await renderUnitCabang(el);
}

async function previewInputPendapatan(){
  var s=getSession();
  var ru=await ambilData('Users');
  var users=ru.ok?ru.data:[];
  var targetCabang=users.filter(function(u){return u.kode_cabang===s.kode_cabang&&(u.jabatan==='Karyawan'||u.jabatan==='Kepala Toko')});
  var list=document.querySelectorAll('#listKaryawan [data-idx]');
  var inputData=[];
  list.forEach(function(w,i){
    var k=targetCabang[i];
    var masuk=w.querySelector('.inp-masuk').value;
    var unit=Number(w.querySelector('.inp-unit').value||0);
    var tips=Number(w.querySelector('.inp-tips').value||0);
    var kasbon=Number(w.querySelector('.inp-kasbon').value||0);
    var alasan=w.querySelector('.inp-alasan')?w.querySelector('.inp-alasan').value:'';
    if(masuk==='tidak'){unit=0;tips=0}
    if(masuk==='tidak'&&kasbon>20000){showToast('Kasbon max 20.000 saat tidak masuk','error');return}
    inputData.push({id_user:k.id_user,nama:k.nama,jabatan:k.jabatan,kode_cabang:s.kode_cabang,unit:unit,tips:tips,kasbon:kasbon,wifi:1000,status_masuk:masuk,alasan:alasan});
  });
  if(inputData.length===0){showToast('Tidak ada data','error');return}

  var jumlahMasuk=inputData.filter(function(d){return d.status_masuk==='ya'}).length;
  var totalUnit=inputData.reduce(function(a,d){return a+d.unit},0);
  var totalTips=inputData.reduce(function(a,d){return a+d.tips},0);
  if(jumlahMasuk===0){showToast('Minimal 1 orang masuk','error');return}
  var unitPer=Math.floor(totalUnit/jumlahMasuk);
  var tipsPer=Math.floor(totalTips/jumlahMasuk);
  var sisaUnit=totalUnit-(unitPer*jumlahMasuk);
  var sisaTips=totalTips-(tipsPer*jumlahMasuk);

  var targetHarian=30;
  var rt=await ambilData('Target_Cabang');
  if(rt.ok){rt.data.forEach(function(t){if(t.kode_cabang===s.kode_cabang)targetHarian=Number(t.target_harian||30)})}
  var tembus=totalUnit>=targetHarian;

  inputData.forEach(function(d){
    if(d.status_masuk==='ya'){
      if(d.jabatan==='Kepala Toko'){
        d.unit=unitPer+sisaUnit;d.tips=tipsPer+sisaTips;
        d.bonus=tembus?10000:0;
      }else{
        d.unit=unitPer;d.tips=tipsPer;
        d.bonus=tembus?5000:0;
      }
    }else{
      d.unit=0;d.tips=0;d.bonus=0;
    }
    d.tembus_target=tembus?'ya':'tidak';
  });

  var html='<div class="card"><div class="card-title"><span class="ic">🔍</span>Preview Pembagian</div>';
  html+='<div class="info-row"><span class="ir-label">Total Unit</span><span class="ir-val">'+fmtAngka(totalUnit)+'</span></div>';
  html+='<div class="info-row"><span class="ir-label">Total Tips</span><span class="ir-val">'+fmtRupiah(totalTips)+'</span></div>';
  html+='<div class="info-row"><span class="ir-label">Masuk</span><span class="ir-val">'+jumlahMasuk+' orang</span></div>';
  html+='<div class="info-row"><span class="ir-label">Tembus Target</span><span class="ir-val">'+(tembus?'✅ Ya':'❌ Tidak')+'</span></div>';
  html+='<div class="divider"></div>';
  html+='<div class="tbl-wrap"><table><thead><tr><th>Nama</th><th>Unit</th><th>Tips</th><th>Bonus</th><th>Kasbon</th><th>Wifi</th></tr></thead><tbody>';
  inputData.forEach(function(d){
    html+='<tr><td>'+esc(d.nama)+'<br><span style="font-size:9px;color:#9CA3AF">'+esc(d.jabatan)+'</span></td>'+
      '<td>'+d.unit+'</td><td>'+fmtRupiah(d.tips)+'</td><td>'+fmtRupiah(d.bonus)+'</td><td>'+fmtRupiah(d.kasbon)+'</td><td>'+fmtRupiah(d.wifi)+'</td></tr>';
  });
  html+='</tbody></table></div>';
  html+='<div class="divider"></div>';
  html+='<button class="btn btn-primary" onclick="simpanInputPendapatan()">✅ Konfirmasi & Simpan</button>';
  html+='<button class="btn btn-gray" style="margin-top:8px" onclick="navigasi(\'operasional\')">Batal</button>';
  html+='</div>';
  document.getElementById('tabOpContent').innerHTML=html;
  window._previewData=inputData;
  window._previewTanggal=document.getElementById('inpTanggal').value;
}

async function simpanInputPendapatan(){
  var data=window._previewData;
  var tanggal=window._previewTanggal;
  if(!data){showToast('Preview hilang, ulangi','error');return}
  paksaIklan(async function(){
    var ok=0;
    for(var i=0;i<data.length;i++){
      var d=data[i];
      var row=Object.assign({},d,{
        id_pendapatan:generateSubmissionId('PH'),
        tanggal:tanggal,
        createdAt:nowISO()
      });
      delete row.alasan;
      var r=await simpanData('Pendapatan_Harian',row);
      if(r.ok)ok++;
    }
    if(ok>0){
      showToast('Berhasil simpan '+ok+' data','success');
      navigasi('home');
    }else{
      showToast('Gagal menyimpan','error');
    }
  });
}

async function tabACC(btn,tab){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  if(btn)btn.classList.add('active');
  var el=document.getElementById('tabACCContent');
  el.innerHTML='<div class="empty"><div class="em-txt">Memuat...</div></div>';
  var sheetMap={izin:'Izin_Istirahat',kasbon:'Pengajuan_Kasbon',kerusakan:'Kerusakan_Kendala',payroll:'Permintaan_Payroll',setoran:'Setoran',resign:'Resign_PHK'};
  var r=await ambilData(sheetMap[tab]);
  var data=r.ok?r.data:[];
  var bolehAcc=function(item){
    if(!isKepalaToko()&&!isAdmin()&&!isOwner())return false;
    var status=item.status||'menunggu';
    if(status==='ditolak'||status==='disetujui')return false;
    if(isKepalaToko()){
      if(item.jabatan_pengaju==='Karyawan'&&status==='menunggu')return true;
      return false;
    }
    if(isAdmin()){
      if(status==='menunggu'&&item.jabatan_pengaju==='Admin')return false;
      if(status==='menunggu'||status==='disetujui_kt')return true;
      return false;
    }
    if(isOwner()){
      if(status==='menunggu'&&item.jabatan_pengaju==='Owner')return false;
      return true;
    }
    return false;
  };
  var filtered=data.filter(bolehAcc);
  var html='<div class="card"><div class="card-title"><span class="ic">✅</span>Persetujuan '+tab+'</div>';
  if(filtered.length===0)html+='<div class="empty"><div class="em-ic">📭</div><div class="em-txt">Tidak ada yang perlu di-ACC</div></div>';
  else{
    filtered.forEach(function(item){
      html+='<div class="card" style="background:#FAFAFA;padding:12px;margin-bottom:10px">'+
        '<div style="font-weight:700;font-size:13px">'+esc(item.nama||item.id_user||'—')+'</div>'+
        '<div style="font-size:10.5px;color:#6B7280;margin-bottom:6px">'+esc(item.jabatan_pengaju||'—')+' • '+esc(item.kode_cabang||'—')+'</div>'+
        '<div style="font-size:11.5px;margin-bottom:8px">'+esc(item.keterangan||item.alasan||item.judul||item.deskripsi||'—')+'</div>'+
        '<div style="font-size:10.5px;margin-bottom:8px">Status: <span class="badge badge-warning">'+esc(item.status||'menunggu')+'</span></div>'+
        '<div class="btn-row">'+
        '<button class="btn btn-sm btn-primary" onclick="prosesACC(\''+sheetMap[tab]+'\',\''+item.id_kasbon||item.id_izin||item.id_kerusakan||item.id_permintaan||item.id_setoran||item.id_resign+'\',\'acc\')">✅ ACC</button>'+
        '<button class="btn btn-sm btn-danger" onclick="prosesACC(\''+sheetMap[tab]+'\',\''+item.id_kasbon||item.id_izin||item.id_kerusakan||item.id_permintaan||item.id_setoran||item.id_resign+'\',\'tolak\')">❌ Tolak</button>'+
        '</div></div>';
    });
  }
  html+='</div>';
  el.innerHTML=html;
}

  if(jenis==='istirahat'&&selisih<1){showToast('Izin istirahat minimal H-1','error');return}
  var data={
    id_izin:generateSubmissionId('IZ'),submission_id:generateSubmissionId('SUB-IZ'),
    tanggal_pengajuan:todayStr(),tanggal_izin:tgl,id_user:getSession().id_user,
    nama:getSession().nama,jabatan_pengaju:getSession().jabatan,kode_cabang:getSession().kode_cabang,
    jenis:jenis,keterangan:document.getElementById('izinKet').value,
    status:'menunggu',acc_by:'',acc_time:'',createdAt:nowISO()
  };
  paksaIklan(async function(){
    var r=await simpanData('Izin_Istirahat',data);
    if(r.ok){showToast('Izin terkirim','success');navigasi('pengajuan')}
    else showToast(r.pesan||'Gagal','error');
  });
}

async function renderPayrollSaya(el){
  var s=getSession();
  var r=await ambilData('Payroll');
  var data=(r.ok?r.data:[]).filter(function(p){return p.id_user===s.id_user});
  var html='<div class="card"><div class="card-title"><span class="ic">💰</span>Payroll Saya</div>';
  if(data.length===0)html+='<div class="empty"><div class="em-txt">Belum ada payroll</div></div>';
  else{
    data.forEach(function(p){
      html+='<div class="card" style="background:#FAFAFA;padding:12px;margin-bottom:8px">'+
        '<div style="font-weight:700">'+esc(p.periode)+'</div>'+
        '<div class="info-row"><span class="ir-label">Unit</span><span class="ir-val">'+p.total_unit+'</span></div>'+
        '<div class="info-row"><span class="ir-label">Tips</span><span class="ir-val">'+fmtRupiah(p.total_tips)+'</span></div>'+
        '<div class="info-row"><span class="ir-label">Gaji Bersih</span><span class="ir-val" style="color:#059669">'+fmtRupiah(p.gaji_bersih)+'</span></div>'+
        '<span class="badge '+(p.status==='sudah_dibayar'?'badge-success':'badge-warning')+'">'+esc(p.status||'belum')+'</span></div>';
    });
  }
  html+='</div>';
  el.innerHTML=html;
  paksaIklan(function(){});
}
async function renderLihatToken(el){
  var s=getSession();
  var r=await ambilData('Laporan_Token');
  var data=(r.ok?r.data:[]).filter(function(t){return t.id_user===s.id_user||t.kode_cabang===s.kode_cabang});
  var html='<div class="card"><div class="card-title"><span class="ic">🔑</span>Token Saya</div>';
  if(data.length===0)html+='<div class="empty"><div class="em-txt">Belum ada token</div></div>';
  else{
    data.forEach(function(t){
      html+='<div class="card" style="background:#FAFAFA;padding:12px;margin-bottom:10px">'+
        '<div style="font-weight:700">Token '+esc(t.jenis||'—')+' — '+esc(t.nomor_token||'—')+'</div>'+
        '<div style="font-size:10.5px;color:#6B7280">Status: <span class="badge badge-warning">'+esc(t.status||'menunggu')+'</span></div>'+
        (t.kode_pengisian?'<div class="code-box">'+esc(t.kode_pengisian)+'</div><button class="btn btn-sm btn-gold" onclick="salinTeks(\''+esc(t.kode_pengisian)+'\')">📋 Salin</button>':'')+
        '</div>';
    });
  }
  html+='</div>';
  el.innerHTML=html;

function salinTeks(t){navigator.clipboard.writeText(t);showToast('Disalin!','success')}

async function renderProfil(el){
  var s=getSession();
  var note='';
  if(isOwner())note='Owner bebas iklan. Kamu bisa akses semua fitur.';
  else if(isAdmin())note='Admin wajib iklan. Kamu membantu owner mengelola.';
  else if(isKepalaToko())note='Kepala Toko wajib iklan. ACC tahap 1 untuk izin karyawan.';
  else note='Karyawan wajib iklan. Ajukan kasbon, izin, dll.';
  var html='<div class="card"><div class="card-title"><span class="ic">👤</span>Profil</div>'+
    '<div class="info-row"><span class="ir-label">ID</span><span class="ir-val">'+esc(s.id_user)+'</span></div>'+
    '<div class="info-row"><span class="ir-label">Nama</span><span class="ir-val">'+esc(s.nama)+'</span></div>'+
    '<div class="info-row"><span class="ir-label">Jabatan</span><span class="ir-val">'+esc(s.jabatan)+'</span></div>'+
    '<div class="info-row"><span class="ir-label">Cabang</span><span class="ir-val">'+esc(s.kode_cabang)+'</span></div>'+
    '<div class="info-row"><span class="ir-label">Mode</span><span class="ir-val">'+(isDemo()?'Demo':'Asli')+'</span></div>'+
    '<div class="role-note" style="margin-top:12px">'+esc(note)+'</div>'+
    '<button class="btn btn-danger" style="margin-top:12px" onclick="logout()">🚪 Keluar</button></div>';
  el.innerHTML=html;
}

function bukaModal(judul,isi){
  var overlay=document.getElementById('modalOverlay');
  document.getElementById('modalContent').innerHTML=
    '<div class="modal-head"><div class="modal-title">'+esc(judul)+'</div>'+
    '<button class="modal-close" onclick="tutupModal()">✕</button></div>'+isi;
  overlay.classList.add('show');
}
function tutupModal(){document.getElementById('modalOverlay').classList.remove('show')}
function bukaProfil(){navigasi('profil')}

/* ═══════════════════════════════════════════════════════════
   LOGOUT
   ═══════════════════════════════════════════════════════════ */
function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY);
  window.location.href='index.html';
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
function init(){
  var s=getSession();
  if(!s){window.location.href='index.html';return}
  document.getElementById('hdrNama').textContent=s.nama;
  document.getElementById('hdrJabatan').textContent=s.jabatan+' • '+s.kode_cabang+(isDemo()?' (Demo)':'');
  navigasi('home');
}

document.addEventListener('DOMContentLoaded',init);
</script>
