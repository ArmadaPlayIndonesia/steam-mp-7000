<style>
/* ================= RESET ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(160deg, #C8102E 0%, #8B0000 35%, #ffffff 35.1%, #F9FAFB 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #1F2937;
  overflow-x: hidden;
}

/* ================= CARD ================= */
.card {
  background: #ffffff;
  width: 100%;
  max-width: 400px;
  border-radius: 16px;
  padding: 32px 24px 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
  animation: fadeUp 0.6s ease;
  position: relative;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ================= LOGO ================= */
.logo-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-svg {
  animation: glowPulse 2s ease-in-out infinite;
  position: relative;
  z-index: 2;
}
@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 4px 12px rgba(200,16,46,0.3)) drop-shadow(0 0 20px rgba(251,191,36,0.3)); }
  50%      { filter: drop-shadow(0 4px 16px rgba(200,16,46,0.5)) drop-shadow(0 0 32px rgba(251,191,36,0.6)); }
}
.sparkle {
  position: absolute;
  width: 4px; height: 4px;
  background: #FBBF24;
  border-radius: 50%;
  animation: sparkleAnim 2s infinite;
  pointer-events: none;
  z-index: 3;
}
.sparkle:nth-child(1) { top: 8%;  left: 8%;  animation-delay: 0s; }
.sparkle:nth-child(2) { top: 12%; right: 6%; animation-delay: 0.4s; }
.sparkle:nth-child(3) { top: 50%; left: -4%; animation-delay: 0.8s; }
.sparkle:nth-child(4) { bottom: 8%; left: 16%; animation-delay: 1.2s; }
.sparkle:nth-child(5) { bottom: 10%; right: 12%; animation-delay: 1.6s; }
@keyframes sparkleAnim {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1); }
}

/* ================= TITLE ================= */
.title {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #C8102E, #8B0000);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.tagline {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: #B45309;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.tagline-2 {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: #C8102E;
  letter-spacing: 1.5px;
  margin-bottom: 24px;
}

/* ================= FORM ================= */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}
.input-wrap { position: relative; }
.input {
  width: 100%;
  padding: 13px 14px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 500;
  color: #1F2937;
  background: #fff;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  transition: all 0.2s ease;
  outline: none;
}
.input:focus {
  border-color: #C8102E;
  box-shadow: 0 0 0 3px rgba(200,16,46,0.1);
}
.input::placeholder { color: #9CA3AF; font-weight: 400; }
.input-wrap.has-toggle .input { padding-right: 44px; }
.toggle-pass {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  padding: 4px 6px;
  line-height: 1;
  color: #6B7280;
  border-radius: 6px;
  transition: background 0.2s;
}
.toggle-pass:active { background: #F3F4F6; }

/* ================= ERROR ================= */
.error {
  display: none;
  background: #FEF2F2;
  border-left: 3px solid #C8102E;
  color: #991B1B;
  font-size: 12px;
  font-weight: 500;
  padding: 10px 12px;
  border-radius: 6px;
  margin-bottom: 14px;
  animation: shake 0.4s ease;
}
.error.show { display: block; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-6px); }
  75%      { transform: translateX(6px); }
}

/* ================= BUTTON ================= */
.btn {
  width: 100%;
  padding: 14px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 700;
  letter-spacing: 0.5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary {
  background: linear-gradient(135deg, #C8102E, #A00D25);
  color: #fff;
  box-shadow: 0 4px 12px rgba(200,16,46,0.3);
  margin-bottom: 10px;
}
.btn-primary:active:not(:disabled) { transform: scale(0.98); box-shadow: 0 2px 6px rgba(200,16,46,0.3); }
.btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

.btn-outline {
  background: #fff;
  color: #B45309;
  border: 2px solid #F59E0B;
}
.btn-outline:active { transform: scale(0.98); background: #FFFBEB; }

.btn-spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.btn.loading .btn-spinner { display: block; }
.btn.loading .btn-text { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= FOOTER ================= */
.footer {
  text-align: center;
  font-size: 10px;
  color: #9CA3AF;
  margin-top: 20px;
  letter-spacing: 0.3px;
}
.footer strong { color: #C8102E; font-weight: 700; }

/* ================= MODAL DEMO ================= */
.modal-overlay {

  background: rgba(0,0,0,0.6);

  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;

.modal-overlay.show { display: flex; }
@keyframes iklanFadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {

  text-align: center;
  margin-bottom: 6px;

.modal p {

  text-align: center;
  margin-bottom: 18px;

.role-list { display: flex; flex-direction: column; gap: 8px; }
.role-btn {

  padding: 12px 14px;
  background: #F9FAFB;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: #1F2937;
  text-align: left;

.role-btn:active { transform: scale(0.98); }
.role-btn:hover { border-color: #C8102E; background: #FEF2F2; }
.role-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;

.role-icon.owner    { background: linear-gradient(135deg, #FBBF24, #F59E0B); }

.role-icon.karyawan { background: linear-gradient(135deg, #10B981, #047857); color:#fff; }
.role-info { flex: 1; }
.role-info small { display: block; font-weight: 400; font-size: 10px; color: #6B7280; margin-top: 2px; }
.modal-close {

  font-size: 13px;
  font-weight: 600;

/* ============================================================
   SESSION HELPERS
   ============================================================ */
function getSession() {
  try {
    var raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.login_time) { hapusSession(); return null; }
    var age = Date.now() - Number(s.login_time);
    var maxAge = s.is_demo ? (5 * 60 * 1000) : (8 * 60 * 60 * 1000);
    if (age > maxAge) { hapusSession(); return null; }
    return s;
  } catch (e) {
    hapusSession();
    return null;
  }
}

function saveSession(obj) {
  var str = JSON.stringify(obj);
  try { sessionStorage.setItem(SESSION_KEY, str); } catch (e) {}
  try { localStorage.setItem(SESSION_KEY, str); } catch (e) {}
}

function hapusSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.remove('show');
  // force reflow untuk restart animasi
  void el.offsetWidth;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

function setLoading(loading) {
  var btn = document.getElementById('btnMasuk');
  if (loading) {
    btn.classList.add('loading');
    btn.disabled = true;
  } else {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

/* ============================================================
   IKLAN
   ============================================================ */
function getUrlIklanRandom() {
  return Math.random() < 0.5 ? IKLAN_URL_MONETAG : IKLAN_URL_ADSTERRA;
}

function triggerIklan() {
  try {
    var url = getUrlIklanRandom();
    window.open(url, '_blank');
  } catch (e) {}
  try {
    if (window.AndroidAds && typeof window.AndroidAds.showInterstitial === 'function') {
      window.AndroidAds.showInterstitial();
    }
  } catch (e) {}
  try { localStorage.setItem('last_ad_klik', Date.now().toString()); } catch (e) {}
}

function getKataIklanRandom(isAdmin) {
  var arr = isAdmin ? KATA_IKLAN_ADMIN : KATA_IKLAN_UMUM;
  var last = -1;
  try { last = parseInt(localStorage.getItem('last_kata_iklan') || '-1', 10); } catch (e) {}
  var idx = Math.floor(Math.random() * arr.length);
  if (arr.length > 1 && idx === last) {
    idx = (idx + 1) % arr.length;
  }
  try { localStorage.setItem('last_kata_iklan', idx.toString()); } catch (e) {}
  return arr[idx];
}

function tampilkanLoadingIklan(kata) {
  var el = document.getElementById('iklanLoading');
  document.getElementById('iklanKata').textContent = kata;
  el.classList.add('show');
}

function tutupLoadingIklan() {
  var el = document.getElementById('iklanLoading');
  el.classList.remove('show');
  setTimeout(function() {
    // tidak dihapus, hanya disembunyikan
  }, 300);
}

/* ============================================================
   API
   ============================================================ */
async function apiPost(action, data) {
  try {
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    var res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    });
    var text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      return { ok: false, pesan: 'Respon server tidak valid', data: [] };
    }
  } catch (e) {
    return { ok: false, pesan: 'Koneksi gagal: ' + e.message, data: [] };
  }
}

/* ============================================================
   LOGIN
   ============================================================ */
async function prosesLogin() {
  hideError();
  var idVal = document.getElementById('inputId').value.trim();
  var passVal = document.getElementById('inputPass').value.trim();

  if (!idVal) { showError('ID Pengguna wajib diisi'); return; }
  if (!passVal) { showError('Password wajib diisi'); return; }

  setLoading(true);

  var res = await apiPost('baca', { sheet: 'Users' });

  if (!res || !res.ok) {
    setLoading(false);
    showError(res && res.pesan ? res.pesan : 'Gagal terhubung ke server');
    return;
  }
  if (!Array.isArray(res.data)) {
    setLoading(false);
    showError('Respons tidak valid');
    return;
  }

  var found = null;
  for (var i = 0; i < res.data.length; i++) {
    var u = res.data[i];
    if (!u) continue;
    var uid = String(u.id || '').trim();
    var upass = String(u.password || '').trim();
    var ustatus = String(u.status || '').toLowerCase();
    var udel = u.dihapus;
    var isDeleted = (udel === true) || (String(udel).toLowerCase() === 'true');

    if (uid === idVal && upass === passVal && ustatus === 'aktif' && !isDeleted) {
      found = u;
      break;
    }
  }

  if (!found) {
    setLoading(false);
    showError('ID atau Password salah');
    return;
  }

  var session = {
    user_id: String(found.id),
    user_nama: String(found.nama || found.id),
    user_jabatan: String(found.jabatan || 'Karyawan'),
    kode_cabang: String(found.kode_cabang || '-'),
    is_demo: false,
    login_time: Date.now()
  };
  saveSession(session);

  // Owner → langsung dashboard
  if (session.user_jabatan === 'Owner') {
    window.location.href = 'dashboard.html';
    return;
  }

  // Selain Owner → tampil iklan 3 detik
  var kata = getKataIklanRandom(true);
  tampilkanLoadingIklan(kata);
  triggerIklan();

  setTimeout(function() {
    tutupLoadingIklan();
    window.location.href = 'dashboard.html';
  }, IKLAN_DURASI);
}

/* ============================================================
   DEMO
   ============================================================ */
function bukaModalDemo() {
  document.getElementById('modalDemo').classList.add('show');
}
function tutupModalDemo() {
  document.getElementById('modalDemo').classList.remove('show');
}

function pilihRoleDemo(role) {
  var session = {
    user_id: 'demo_' + role.toLowerCase().replace(/\s/g, '_'),
    user_nama: 'Demo ' + role,
    user_jabatan: role,
    kode_cabang: '-',
    is_demo: true,
    login_time: Date.now()
  };
  saveSession(session);
  tutupModalDemo();

  var kata = getKataIklanRandom(false);
  tampilkanLoadingIklan(kata);
  triggerIklan();

  setTimeout(function() {
    tutupLoadingIklan();
    window.location.href = 'dashboard.html';
  }, IKLAN_DURASI);
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  // Cek session — kalau ada & valid, langsung dashboard
  var existing = getSession();
  if (existing && existing.user_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  // Toggle password
  var toggle = document.getElementById('togglePass');
  var inputPass = document.getElementById('inputPass');
  toggle.addEventListener('click', function() {
    if (inputPass.type === 'password') {
      inputPass.type = 'text';
      toggle.textContent = '🙈';
    } else {
      inputPass.type = 'password';
      toggle.textContent = '👁';
    }
  });

  // Enter di ID → focus password
  document.getElementById('inputId').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      inputPass.focus();
    }
  });

  // Enter di password → klik MASUK
  inputPass.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      prosesLogin();
    }
  });

  // Tombol MASUK
  document.getElementById('btnMasuk').addEventListener('click', prosesLogin);

  // Tombol DEMO
  document.getElementById('btnDemo').addEventListener('click', bukaModalDemo);

  // Role demo
  var roleBtns = document.querySelectorAll('.role-btn');
  for (var i = 0; i < roleBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var role = btn.getAttribute('data-role');
        pilihRoleDemo(role);
      });
    })(roleBtns[i]);
  }

  // Close modal
  document.getElementById('btnCloseModal').addEventListener('click', tutupModalDemo);
  document.getElementById('modalDemo').addEventListener('click', function(e) {
    if (e.target === this) tutupModalDemo();
  });
})();
</script>
