<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - STEAM MP 7000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --merah:#C8102E;
    --merah-dark:#9B0C23;
    --emas:#F59E0B;
    --emas-dark:#B45309;
    --putih:#FFFFFF;
    --hitam:#1F2937;
    --abu:#6B7280;
    --abu-bg:#F3F4F6;
  }
  html,body{height:100%}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,#C8102E 0%,#9B0C23 45%,#7A0819 100%);
    color:var(--hitam);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    position:relative;
    overflow-x:hidden;
  }
  /* Ornamen latar */
  body::before{
    content:"";
    position:fixed;
    top:-120px;right:-120px;
    width:320px;height:320px;
    background:radial-gradient(circle, rgba(245,158,11,.35), transparent 70%);
    border-radius:50%;
    pointer-events:none;
  }
  body::after{
    content:"";
    position:fixed;
    bottom:-140px;left:-140px;
    width:360px;height:360px;
    background:radial-gradient(circle, rgba(255,255,255,.15), transparent 70%);
    border-radius:50%;
    pointer-events:none;
  }

  .login-wrap{
    width:100%;
    max-width:400px;
    position:relative;
    z-index:2;
  }
  .login-card{
    background:var(--putih);
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.2);
    padding:28px 22px 22px;
    border-top:5px solid var(--emas);
    animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
  }

  .brand{
    text-align:center;
    margin-bottom:20px;
  }
  .logo-circle{
    width:74px;height:74px;
    border-radius:50%;
    margin:0 auto 12px;
    background:linear-gradient(145deg,#F59E0B,#D97706);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(245,158,11,.45), inset 0 -3px 6px rgba(0,0,0,.12);
    border:3px solid #fff;
  }
  .logo-circle span{
    font-weight:800;
    font-size:26px;
    color:#fff;
    letter-spacing:1px;
    text-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .brand h1{
    font-size:22px;
    font-weight:800;
    color:var(--merah);
    letter-spacing:.5px;
    line-height:1.2;
  }
  .brand .tagline{
    font-size:11.5px;
    color:var(--emas-dark);
    font-weight:600;
    margin-top:6px;
    letter-spacing:.3px;
    line-height:1.45;
  }

  .form-group{
    margin-bottom:14px;
    position:relative;
  }
  .form-group label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--hitam);
    margin-bottom:6px;
  }
  .input-wrap{
    position:relative;
  }
  .input-wrap input{
    width:100%;
    padding:13px 44px 13px 14px;
    border:1.5px solid #E5E7EB;
    border-radius:12px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--hitam);
    background:var(--abu-bg);
    transition:.2s;
    outline:none;
  }
  .input-wrap input:focus{
    border-color:var(--merah);
    background:#fff;
    box-shadow:0 0 0 3px rgba(200,16,46,.12);
  }
  .input-wrap .toggle-pass{
    position:absolute;
    right:6px;top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:none;
    padding:8px 10px;
    cursor:pointer;
    font-size:16px;
    color:var(--abu);
    border-radius:8px;
    line-height:1;
  }
  .input-wrap .toggle-pass:hover{color:var(--merah)}

  .btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    border:none;
    transition:.2s;
    letter-spacing:.4px;
  }
  .btn-primary{
    background:linear-gradient(145deg,var(--merah),var(--merah-dark));
    color:#fff;
    box-shadow:0 6px 16px rgba(200,16,46,.35);
  }
  .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn-primary:active{transform:translateY(0)}
  .btn-primary:disabled{opacity:.65;cursor:not-allowed;transform:none}

  .btn-outline{
    background:transparent;
    color:var(--emas-dark);
    border:2px solid var(--emas);
    margin-top:10px;
  }
  .btn-outline:hover{background:rgba(245,158,11,.1)}

  .error-msg{
    background:#FEE2E2;
    color:#991B1B;
    border:1px solid #FCA5A5;
    border-radius:10px;
    padding:10px 12px;
    font-size:12.5px;
    font-weight:500;
    margin-bottom:12px;
    display:none;
    animation:shake .35s;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
  }

  .footer{
    text-align:center;
    margin-top:18px;
    font-size:11.5px;
    color:rgba(255,255,255,.85);
    font-weight:500;
  }
  .footer strong{color:#fff;font-weight:700}

  /* Modal Demo */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:100;
    backdrop-filter:blur(3px);
  }
  .modal-overlay.show{display:flex}
  .modal{
    background:#fff;
    border-radius:18px;
    padding:22px 20px;
    width:100%;
    max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:fadeUp .3s ease;
  }
  .modal h3{
    color:var(--merah);
    font-size:17px;
    margin-bottom:4px;
    text-align:center;
  }
  .modal p.sub{
    text-align:center;
    color:var(--abu);
    font-size:12.5px;
    margin-bottom:16px;
  }
  .role-list{display:flex;flex-direction:column;gap:9px}
  .role-btn{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    border:1.5px solid #E5E7EB;
    border-radius:12px;
    background:#fff;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--hitam);
    text-align:left;
    transition:.18s;
  }
  .role-btn:hover{
    border-color:var(--emas);
    background:#FFFBEB;
    transform:translateX(3px);
  }
  .role-btn .ico{
    width:34px;height:34px;
    border-radius:9px;
    background:linear-gradient(145deg,var(--merah),var(--merah-dark));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  .modal .close-btn{
    width:100%;
    margin-top:14px;
    padding:10px;
    background:var(--abu-bg);
    border:none;
    border-radius:10px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    color:var(--abu);
    cursor:pointer;
  }
  .modal .close-btn:hover{background:#E5E7EB}

  .spinner{
    display:inline-block;
    width:16px;height:16px;
    border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:-3px;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(min-width:480px){
    .login-card{padding:34px 28px 26px}
    .brand h1{font-size:24px}
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="logo-circle"><span>MP</span></div>
      <h1>STEAM MP 7000</h1>
      <div class="tagline">Jujur Disiplin Tanggung Jawab<br>HARGA MATI !</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="userId">ID Pengguna</label>
        <div class="input-wrap">
          <input type="text" id="userId" placeholder="Masukkan ID" required>
        </div>
      </div>
      <div class="form-group">
        <label for="userPass">Password</label>
        <div class="input-wrap">
          <input type="password" id="userPass" placeholder="Masukkan Password" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btnMasuk">MASUK</button>
      <button type="button" class="btn btn-outline" id="btnDemo">COBA DEMO</button>
    </form>
  </div>
  <div class="footer">© <strong>Steam MP Manajemen</strong> 2026</div>
</div>

<!-- Modal Demo -->
<div class="modal-overlay" id="demoModal">
  <div class="modal">
    <h3>Pilih Mode Demo</h3>
    <p class="sub">Jelajahi aplikasi tanpa login</p>
    <div class="role-list">
      <button class="role-btn" data-role="Owner" data-id="9999">
        <div class="ico">👑</div><div>Owner</div>
      </button>
      <button class="role-btn" data-role="Admin" data-id="9998">
        <div class="ico">🛡️</div><div>Admin</div>
      </button>
      <button class="role-btn" data-role="Kepala Toko" data-id="9997">
        <div class="ico">🏪</div><div>Kepala Toko</div>
      </button>
      <button class="role-btn" data-role="Karyawan" data-id="9996">
        <div class="ico">👤</div><div>Karyawan</div>
      </button>
    </div>
    <button class="close-btn" id="closeDemo">Batal</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwWiWeesEtkkzsbZrEb4I1WYAj8LPVY73H5ZZo1kB8UjWCcL2v5IbH3WvfZqblkEhMu/exec';
  var TOKEN = 'steam-mp-7000-2026';
  var SESSION_KEY = 'steam_mp_session';

  /* ---------- SESSION ---------- */
  function getSession(){
    try{
      var raw = localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      var s = JSON.parse(raw);
      if(!s || !s.user_id) return null;
      return s;
    }catch(e){ return null; }
  }
  function setSession(s){
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){}
  }
  function clearSession(){
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  }

  /* ---------- GUARD: SUDAH LOGIN? ---------- */
  var existing = getSession();
  if(existing){
    window.location.replace('dashboard.html');
    return;
  }

  /* ---------- API ---------- */
  function apiPost(action, data){
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    return fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); });
  }

  /* ---------- DOM ---------- */
  var form = document.getElementById('loginForm');
  var inpId = document.getElementById('userId');
  var inpPass = document.getElementById('userPass');
  var btnMasuk = document.getElementById('btnMasuk');
  var btnDemo = document.getElementById('btnDemo');
  var togglePass = document.getElementById('togglePass');
  var errorMsg = document.getElementById('errorMsg');
  var demoModal = document.getElementById('demoModal');
  var closeDemo = document.getElementById('closeDemo');

  /* ---------- SHOW/HIDE PASSWORD ---------- */
  togglePass.addEventListener('click', function(){
    if(inpPass.type === 'password'){
      inpPass.type = 'text';
      togglePass.textContent = '🙈';
    }else{
      inpPass.type = 'password';
      togglePass.textContent = '👁️';
    }
  });

  /* ---------- ERROR ---------- */
  function showError(msg){
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    setTimeout(function(){ errorMsg.style.display = 'none'; }, 4000);
  }

  /* ---------- LOGIN SUBMIT ---------- */
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var id = String(inpId.value || '').trim();
    var pass = String(inpPass.value || '').trim();

    if(!id || !pass){
      showError('ID dan Password wajib diisi.');
      return;
    }

    btnMasuk.disabled = true;
    btnMasuk.innerHTML = '<span class="spinner"></span>Memeriksa...';

    apiPost('baca', { sheet: 'Users' })
      .then(function(res){
        if(!res || !res.ok){
          throw new Error((res && res.pesan) || 'Gagal membaca data user.');
        }
        var users = Array.isArray(res.data) ? res.data : [];
        var found = null;
        for(var i=0;i<users.length;i++){
          var u = users[i];
          var uid = String(u.id == null ? '' : u.id).trim();
          var upass = String(u.password == null ? '' : u.password).trim();
          var status = String(u.status == null ? '' : u.status).trim().toLowerCase();
          var dihapus = String(u.dihapus == null ? '' : u.dihapus).trim().toLowerCase();
          var isDeleted = (dihapus === 'true' || dihapus === 'ya' || dihapus === '1');
          if(uid === id && upass === pass && status === 'aktif' && !isDeleted){
            found = u;
            break;
          }
        }

        if(!found){
          showError('ID atau Password salah.');
          btnMasuk.disabled = false;
          btnMasuk.textContent = 'MASUK';
          return;
        }

        var session = {
          user_id: String(found.id == null ? '' : found.id),
          user_nama: String(found.nama == null ? '' : found.nama),
          user_jabatan: String(found.jabatan == null ? '' : found.jabatan),
          user_kode_cabang: String(found.kode_cabang == null ? '-' : found.kode_cabang),
          is_demo: false,
          login_time: Date.now()
        };
        setSession(session);
        window.location.replace('dashboard.html');
      })
      .catch(function(err){
        showError(err && err.message ? err.message : 'Terjadi kesalahan jaringan.');
        btnMasuk.disabled = false;
        btnMasuk.textContent = 'MASUK';
      });
  });

  /* ---------- DEMO ---------- */
  btnDemo.addEventListener('click', function(){
    demoModal.classList.add('show');
  });
  closeDemo.addEventListener('click', function(){
    demoModal.classList.remove('show');
  });
  demoModal.addEventListener('click', function(e){
    if(e.target === demoModal) demoModal.classList.remove('show');
  });

  var roleBtns = demoModal.querySelectorAll('.role-btn');
  roleBtns.forEach(function(b){
    b.addEventListener('click', function(){
      var role = b.getAttribute('data-role');
      var demoId = b.getAttribute('data-id');
      var session = {
        user_id: demoId,
        user_nama: 'Demo ' + role,
        user_jabatan: role,
        user_kode_cabang: '-',
        is_demo: true,
        login_time: Date.now()
      };
      setSession(session);
      window.location.replace('dashboard.html');
    });
  });

})();
</script>
</body>
</html>
