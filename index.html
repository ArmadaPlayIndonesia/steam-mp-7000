<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #C8102E 0%, #8B0000 35%, #ffffff 35.1%, #F9FAFB 100%);
    background-attachment: fixed;
    color: #1F2937;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 32px;
    min-height: 100vh;
  }

  /* ============ CARD ============ */
  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18), 0 4px 12px rgba(0,0,0,0.08);
    padding: 28px 22px 24px;
    margin-top: 28px;
    animation: fadeUp 0.6s ease both;
    position: relative;
    z-index: 2;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ LOGO ============ */
  .logo-wrap {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-svg {
    width: 80px; height: 80px;
    display: block;
    animation: glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 4px 12px rgba(200,16,46,0.3)) drop-shadow(0 0 20px rgba(251,191,36,0.3)); }
    50%      { filter: drop-shadow(0 4px 16px rgba(200,16,46,0.5)) drop-shadow(0 0 32px rgba(251,191,36,0.6)); }
  }
  .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    background: #FBBF24;
    border-radius: 50%;
    animation: sparkleAnim 2s infinite;
    pointer-events: none;
    box-shadow: 0 0 6px #FBBF24, 0 0 10px rgba(251,191,36,0.7);
  }
  .sparkle.s1 { top: -2px; left: 50%; margin-left: -2px; animation-delay: 0s; }
  .sparkle.s2 { top: 50%; right: -4px; margin-top: -2px; animation-delay: 0.4s; }
  .sparkle.s3 { bottom: -2px; left: 50%; margin-left: -2px; animation-delay: 0.8s; }
  .sparkle.s4 { top: 50%; left: -4px; margin-top: -2px; animation-delay: 1.2s; }
  .sparkle.s5 { top: -6px; right: -2px; animation-delay: 1.6s; }
  @keyframes sparkleAnim {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50%      { opacity: 1; transform: scale(1); }
  }

  /* ============ JUDUL ============ */
  .judul {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #8B0000;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .tagline {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: #6B7280;
    line-height: 1.4;
    margin-bottom: 22px;
  }
  .tagline b { color: #C8102E; font-weight: 700; }

  /* ============ FORM ============ */
  .field { margin-bottom: 14px; position: relative; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    padding: 12px 44px 12px 14px;
    font-size: 14px;
    font-family: inherit;
    color: #1F2937;
    background: #FFFFFF;
    border: 1.5px solid #E5E7EB;
    border-radius: 10px;
    outline: none;
    transition: all 0.2s ease;
  }
  .input-wrap input:focus {
    border-color: #C8102E;
    box-shadow: 0 0 0 3px rgba(200,16,46,0.12);
  }
  .input-wrap input::placeholder { color: #9CA3AF; }
  .toggle-pass {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    color: #6B7280;
    border-radius: 6px;
  }
  .toggle-pass:active { background: #F3F4F6; }

  /* ============ ERROR ============ */
  #errorMsg {
    display: none;
    background: #FEF2F2;
    border-left: 3px solid #C8102E;
    color: #B91C1C;
    font-size: 12.5px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
    line-height: 1.45;
  }
  #errorMsg.show {
    display: block;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ============ TOMBOL ============ */
  .btn {
    width: 100%;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.65; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #C8102E 0%, #A00D25 100%);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(200,16,46,0.35);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(200,16,46,0.5); }
  .btn-outline {
    background: #FFFFFF;
    border: 2px solid #F59E0B;
    color: #B45309;
    margin-top: 10px;
  }
  .btn-outline:hover:not(:disabled) { background: #FFFBEB; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ FOOTER ============ */
  .footer {
    text-align: center;
    font-size: 11px;
    color: #9CA3AF;
    margin-top: 20px;
    font-weight: 500;
  }

  /* ============ MODAL DEMO ============ */
  #modalDemo {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.25s ease;
  }
  #modalDemo.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: #FFFFFF;
    border-radius: 16px;
    max-width: 380px;
    width: 100%;
    padding: 22px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: fadeUp 0.35s ease both;
  }
  .modal-box h3 {
    font-size: 17px;
    font-weight: 700;
    color: #8B0000;
    text-align: center;
    margin-bottom: 4px;
  }
  .modal-box .sub {
    text-align: center;
    font-size: 12px;
    color: #6B7280;
    margin-bottom: 18px;
  }
  .role-btn {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 8px;
    background: #FEF2F2;
    border: 1.5px solid #FECACA;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: #8B0000;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    transition: all 0.15s ease;
  }
  .role-btn:hover { background: #FEE2E2; border-color: #C8102E; }
  .role-btn .emoji { font-size: 18px; }
  .modal-close {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    background: #F3F4F6;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    cursor: pointer;
  }
  .modal-close:hover { background: #E5E7EB; }

  /* ============ IKLAN LOADING ============ */
  #iklanLoading {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: linear-gradient(135deg, #C8102E, #8B0000);
    display: none;
    align-items: center;
    justify-content: center;
    animation: iklanFadeIn 0.3s ease;
    padding: 28px;
    text-align: center;
  }
  #iklanLoading.show { display: flex; }
  @keyframes iklanFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .iklan-box { max-width: 380px; width: 100%; }
  .iklan-spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #FBBF24;
    border-radius: 50%;
    animation: iklanSpin 0.8s linear infinite;
    margin: 0 auto 18px;
  }
  @keyframes iklanSpin { to { transform: rotate(360deg); } }
  .iklan-title {
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .iklan-kata {
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 14px;
    color: #FFFFFF;
    font-size: 13px;
    font-style: italic;
    line-height: 1.55;
    margin-bottom: 14px;
  }
  .iklan-sub {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    margin-bottom: 8px;
  }
  .iklan-footer {
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    margin-top: 16px;
  }

    .card { padding: 22px 16px 20px; }
    .judul { font-size: 19px; }
    .logo-svg, .logo-wrap { width: 70px; height: 70px; }
  }

</head>

/* ============================================================
   ERROR CATCHER
   ============================================================ */
var _errorList = [];

function _formatWaktu(ts) {
  try {
    var d = new Date(ts);
    var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
    return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() + ', ' +
           pad(d.getHours()) + '.' + pad(d.getMinutes()) + '.' + pad(d.getSeconds());
  } catch (e) { return String(ts); }
}

function _buildErrorReport() {
  var txt = '=== STEAM MP 7000 ERROR REPORT ===\n';
  txt += 'Waktu: ' + _formatWaktu(Date.now()) + '\n';
  txt += 'URL: ' + (window.location ? window.location.href : '-') + '\n';
  txt += 'User Agent: ' + (navigator.userAgent || '-') + '\n';
  txt += '=====================================\n\n';
  for (var i = 0; i < _errorList.length; i++) {
    var e = _errorList[i];
    txt += '--- ERROR #' + (i + 1) + ' ---\n';
    txt += 'Pesan: ' + (e.pesan || '-') + '\n';
    if (e.detail) txt += 'Detail:\n' + e.detail + '\n';
    if (e.file) txt += 'File: ' + e.file + '\n';
    if (e.line) txt += 'Baris: ' + e.line + '\n';
    if (e.stack) txt += 'Stack: ' + e.stack + '\n';
    txt += 'Waktu: ' + _formatWaktu(e.waktu) + '\n\n';
  }
  return txt;
}

function _showErrorPanel(pesan) {
  try {
    var panel = document.getElementById('errorPanel');
    var pesanEl = document.getElementById('errPesan');
    if (!panel || !pesanEl) return;
    pesanEl.textContent = pesan || 'Terjadi error tidak diketahui';
    panel.style.display = 'block';
  } catch (e) { /* abaikan */ }
}

function _catatError(pesan, detail, file, line, stack) {
  var entry = {
    pesan: pesan || 'Unknown error',
    detail: detail || '',
    file: file || '',
    line: line || '',
    stack: stack || '',
    waktu: Date.now()
  };
  _errorList.push(entry);
  _showErrorPanel(pesan);

  // Kirim ke Log_Error (optional, tidak blocking)
  try {
    var sid = 'ERR-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    apiPost('tulis_unik', {
      sheet: 'Log_Error',
      data: {
        id_error: sid,
        timestamp: new Date().toISOString(),
        user_id: '',
        user_nama: '',
        pesan: String(pesan || '').slice(0, 500),
        detail: String(detail || stack || '').slice(0, 1000),
        url: window.location ? window.location.href : '',
        user_agent: navigator.userAgent || '',
        jenis: 'frontend',
        dihapus: false
      }
    }).catch(function(){});
  } catch (e) { /* abaikan */ }
}

window.onerror = function(msg, url, line, col, err) {
  _catatError(
    'JS Error: ' + msg,
    err && err.message ? err.message : '',
    url || '',
    line ? (line + (col ? ':' + col : '')) : '',
    err && err.stack ? err.stack : ''
  );
  return false;
};

window.addEventListener('unhandledrejection', function(ev) {
  var reason = ev.reason;
  var msg = reason && reason.message ? reason.message : String(reason);
  _catatError(
    'Promise Rejection: ' + msg,
    reason && reason.stack ? reason.stack : '',
    '', '', reason && reason.stack ? reason.stack : ''
  );
});

// Override fetch untuk menangkap fetch error
(function() {
  if (typeof window.fetch !== 'function') return;
  var _origFetch = window.fetch;
  window.fetch = function() {
    var args = arguments;
    return _origFetch.apply(this, args).catch(function(err) {
      _catatError('Fetch Error: ' + (err && err.message ? err.message : String(err)), '', '', '', err && err.stack ? err.stack : '');
      throw err;
    });
  };
})();

// Handler panel error
document.addEventListener('DOMContentLoaded', function() {
  var panel = document.getElementById('errorPanel');
  var btnCopy = document.getElementById('errCopy');
  var btnDetail = document.getElementById('errDetail');
  var btnWA = document.getElementById('errWA');
  var btnTutup = document.getElementById('errTutup');
  var detailBox = document.getElementById('errDetailBox');

  if (btnCopy) {
    btnCopy.addEventListener('click', function() {
      var teks = _buildErrorReport();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(teks).then(function(){
            btnCopy.textContent = '✅ Tersalin!';
            setTimeout(function(){ btnCopy.textContent = '📋 Salin Detail Error'; }, 1500);
          }).catch(function(){
            _fallbackCopy(teks);
          });
        } else {
          _fallbackCopy(teks);
        }
      } catch (e) {
        _fallbackCopy(teks);
      }
    });
  }

  function _fallbackCopy(teks) {
    try {
      var ta = document.createElement('textarea');
      ta.value = teks;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      if (btnCopy) {
        btnCopy.textContent = '✅ Tersalin!';
        setTimeout(function(){ btnCopy.textContent = '📋 Salin Detail Error'; }, 1500);
      }
    } catch (e) { /* abaikan */ }
  }

  if (btnDetail) {
    btnDetail.addEventListener('click', function() {
      if (!detailBox) return;
      if (detailBox.style.display === 'none' || !detailBox.style.display) {
        detailBox.textContent = _buildErrorReport();
        detailBox.style.display = 'block';
        btnDetail.textContent = '🔼 Sembunyikan Detail';
      } else {
        detailBox.style.display = 'none';
        btnDetail.textContent = '🔽 Lihat Detail';
      }
    });
  }

  if (btnWA) {
    btnWA.addEventListener('click', function() {
      var teks = _buildErrorReport();
      var url = 'https://wa.me/' + WA_DEVELOPER + '?text=' + encodeURIComponent(teks);
      try { window.open(url, '_blank'); } catch (e) { window.location.href = url; }
    });
  }

  if (btnTutup) {
    btnTutup.addEventListener('click', function() {
      if (panel) panel.style.display = 'none';
    });
  }
});

/* ============================================================
   HELPER API
   ============================================================ */
async function apiPost(action, data) {
  try {
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    var res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    });
    var text = await res.text();
    try { return JSON.parse(text); }
    catch (e) { return { ok: false, pesan: 'Respon server tidak valid', data: [] }; }
  } catch (e) {
    return { ok: false, pesan: 'Koneksi gagal: ' + e.message, data: [] };
  }
}

/* ============================================================
   SESSION
   ============================================================ */
function getSession() {
  var raw = null;
  try { raw = sessionStorage.getItem(SESSION_KEY); } catch (e) { /* abaikan */ }
  if (!raw) {
    try { raw = localStorage.getItem(SESSION_KEY); } catch (e) { /* abaikan */ }
  }
  if (!raw) return null;
  var s = null;
  try { s = JSON.parse(raw); } catch (e) { return null; }
  if (!s || typeof s !== 'object') return null;
  if (!s.login_time) return null;
  var batas = s.is_demo ? (5 * 60 * 1000) : (8 * 60 * 60 * 1000);
  if (Date.now() - s.login_time > batas) {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    return null;
  }
  return s;
}

function saveSession(obj) {
  var raw = JSON.stringify(obj);
  try { sessionStorage.setItem(SESSION_KEY, raw); } catch (e) { /* abaikan */ }
  try { localStorage.setItem(SESSION_KEY, raw); } catch (e) { /* abaikan */ }
}

/* ============================================================
   UI HELPER
   ============================================================ */
function showError(msg) {
  var el = document.getElementById('errorMsg');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  el.classList.remove('show');
  // trigger reflow untuk re-animasi
  void el.offsetWidth;
  el.classList.add('show');
}

function hideError() {
  var el = document.getElementById('errorMsg');
  if (el) el.classList.remove('show');
}

function getUrlIklanRandom() {
  return Math.random() < 0.5 ? IKLAN_URL_MONETAG : IKLAN_URL_ADSTERRA;
}

function triggerIklan() {
  try { window.open(getUrlIklanRandom(), '_blank'); } catch (e) { /* abaikan */ }
  try {
    if (window.AndroidAds && typeof window.AndroidAds.showInterstitial === 'function') {
      window.AndroidAds.showInterstitial();
    }
  } catch (e) { /* abaikan */ }
  try { localStorage.setItem('last_ad_klik', Date.now().toString()); } catch (e) {}
}

function getKataIklanRandom(isAdmin) {
  var arr = isAdmin ? KATA_IKLAN_ADMIN : KATA_IKLAN_UMUM;
  var idx = Math.floor(Math.random() * arr.length);
  try {
    var last = parseInt(localStorage.getItem('last_kata_iklan') || '-1', 10);
    var tries = 0;
    while (idx === last && arr.length > 1 && tries < 5) {
      idx = Math.floor(Math.random() * arr.length);
      tries++;
    }
    localStorage.setItem('last_kata_iklan', String(idx));
  } catch (e) { /* abaikan */ }
  return arr[idx];
}

function tampilkanLoadingIklan(kata) {
  var el = document.getElementById('iklanLoading');
  var kataEl = document.getElementById('iklanKata');
  if (kataEl) kataEl.textContent = kata || 'Memuat...';
  if (el) el.classList.add('show');
}

function tutupLoadingIklan() {
  var el = document.getElementById('iklanLoading');
  if (el) el.classList.remove('show');
}

/* ============================================================
   LOGIKA LOGIN
   ============================================================ */
async function prosesLogin() {
  hideError();
  var inputId = document.getElementById('inputId');
  var inputPass = document.getElementById('inputPass');
  var btnMasuk = document.getElementById('btnMasuk');
  var btnText = document.getElementById('btnMasukText');

  var idVal = (inputId.value || '').trim();
  var passVal = (inputPass.value || '').trim();

  if (!idVal) { showError('ID tidak boleh kosong'); inputId.focus(); return; }
  if (!passVal) { showError('Password tidak boleh kosong'); inputPass.focus(); return; }

  btnMasuk.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Memeriksa...';

  var res = await apiPost('baca', { sheet: 'Users' });

  if (!res || !res.ok) {
    showError((res && res.pesan) ? res.pesan : 'Gagal menghubungi server');
    btnMasuk.disabled = false;
    btnText.textContent = 'MASUK';
    return;
  }
  if (!Array.isArray(res.data)) {
    showError('Respons tidak valid');
    btnMasuk.disabled = false;
    btnText.textContent = 'MASUK';
    return;
  }

  var found = null;
  for (var i = 0; i < res.data.length; i++) {
    var u = res.data[i];
    if (!u) continue;
    var uid = String(u.id === undefined || u.id === null ? '' : u.id).trim();
    var upass = String(u.password === undefined || u.password === null ? '' : u.password).trim();
    var ustatus = String(u.status === undefined || u.status === null ? '' : u.status).toLowerCase().trim();
    var udel = String(u.dihapus === undefined || u.dihapus === null ? '' : u.dihapus).toLowerCase().trim();
    if (uid === idVal && upass === passVal && ustatus === 'aktif' && udel !== 'true') {
      found = u;
      break;
    }
  }

  if (!found) {
    showError('ID atau Password salah');
    btnMasuk.disabled = false;
    btnText.textContent = 'MASUK';
    return;
  }

  // Buat session dengan FIELD WAJIB
  var session = {
    user_id: String(found.id || ''),
    user_nama: String(found.nama || found.id || ''),
    user_jabatan: String(found.jabatan || 'Karyawan'),
    kode_cabang: String(found.kode_cabang || '-'),
    is_demo: false,
    login_time: Date.now()
  };
  saveSession(session);

  var jabatan = session.user_jabatan.toLowerCase();
  if (jabatan === 'owner') {
    // Langsung redirect tanpa iklan
    window.location.href = 'dashboard.html';
    return;
  }

  // Non-owner → loading iklan 3 detik
  var isAdmin = (jabatan === 'admin');
  tampilkanLoadingIklan(getKataIklanRandom(isAdmin));
  triggerIklan();

  setTimeout(function() {
    tutupLoadingIklan();
    window.location.href = 'dashboard.html';
  }, IKLAN_DURASI);
}

/* ============================================================
   LOGIKA DEMO
   ============================================================ */
function buatSessionDemo(role) {
  var session = {
    user_id: 'demo_' + role.toLowerCase().replace(/\s/g, '_'),
    user_nama: 'Demo ' + role,
    user_jabatan: role,
    kode_cabang: '-',
    is_demo: true,
    login_time: Date.now()
  };
  saveSession(session);

  tampilkanLoadingIklan(getKataIklanRandom(false));
  triggerIklan();

  setTimeout(function() {
    tutupLoadingIklan();
    window.location.href = 'dashboard.html';
  }, IKLAN_DURASI);
}

/* ============================================================
   INISIALISASI
   ============================================================ */
document.addEventListener('DOMContentLoaded', function() {
  // Cek session existing
  var s = getSession();
  if (s && s.user_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  var inputId = document.getElementById('inputId');
  var inputPass = document.getElementById('inputPass');
  var btnMasuk = document.getElementById('btnMasuk');
  var btnDemo = document.getElementById('btnDemo');
  var togglePass = document.getElementById('togglePass');
  var modalDemo = document.getElementById('modalDemo');
  var modalClose = document.getElementById('modalClose');

  // Enter di ID → focus ke password
  if (inputId) {
    inputId.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (inputPass) inputPass.focus();
      }
    });
  }

  // Enter di Password → klik MASUK
  if (inputPass) {
    inputPass.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        prosesLogin();
      }
    });
  }

  // Klik MASUK
  if (btnMasuk) {
    btnMasuk.addEventListener('click', prosesLogin);
  }

  // Toggle password
  if (togglePass && inputPass) {
    togglePass.addEventListener('click', function() {
      if (inputPass.type === 'password') {
        inputPass.type = 'text';
        togglePass.textContent = '🙈';
      } else {
        inputPass.type = 'password';
        togglePass.textContent = '👁';
      }
    });
  }

  // Buka modal demo
  if (btnDemo && modalDemo) {
    btnDemo.addEventListener('click', function() {
      modalDemo.classList.add('show');
    });
  }

  // Tutup modal demo
  if (modalClose && modalDemo) {
    modalClose.addEventListener('click', function() {
      modalDemo.classList.remove('show');
    });
  }
  if (modalDemo) {
    modalDemo.addEventListener('click', function(e) {
      if (e.target === modalDemo) modalDemo.classList.remove('show');
    });
  }

  // Klik role demo
  var roleBtns = document.querySelectorAll('.role-btn');
  for (var i = 0; i < roleBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var role = btn.getAttribute('data-role');
        if (modalDemo) modalDemo.classList.remove('show');
        if (role) buatSessionDemo(role);
      });
    })(roleBtns[i]);
  }

  // Offline / online
  window.addEventListener('offline', function() {
    showError('Tidak ada koneksi internet');
  });
  window.addEventListener('online', function() {
    hideError();
  });
});
</script>
