function getSession() {
  try {
    var raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.login_time) return null;
    var maxAge = s.is_demo ? (5 * 60 * 1000) : (8 * 60 * 60 * 1000);
    if (Date.now() - s.login_time > maxAge) {
      sessionStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s;
  } catch(e) { return null; }
}
function saveSession(obj) {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(obj));
    localStorage.setItem(SESSION_KEY, JSON.stringify(obj));
  } catch(e) {}
}
function hapusSession() {
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY);
}
function isDemo()       { var s=getSession(); return s && s.is_demo === true; }
function isOwner()      { var s=getSession(); return s && s.user_jabatan === 'Owner'; }
function isAdmin()      { var s=getSession(); return s && s.user_jabatan === 'Admin'; }
function isKepalaToko() { var s=getSession(); return s && s.user_jabatan === 'Kepala Toko'; }
function isKaryawan()   { var s=getSession(); return s && s.user_jabatan === 'Karyawan'; }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function todayStr() { var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowISO() { return new Date().toISOString(); }
function fmtRupiah(n) { n=Number(n)||0; return 'Rp '+n.toLocaleString('id-ID'); }
function fmtAngka(n) { return (Number(n)||0).toLocaleString('id-ID'); }
function generateSubmissionId(prefix) { return (prefix||'SUB')+'-'+Date.now()+'-'+Math.floor(Math.random()*9000+1000); }
function showToast(msg, type) {
  var t = document.getElementById('toastBox');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast-box show ' + (type||'');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

async function apiPost(action, data) {
  try {
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    var res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    });
    var text = await res.text();
    try { return JSON.parse(text); } catch(e) { return { ok:false, pesan:'Respons server tidak valid', data:[] }; }
  } catch(e) { return { ok:false, pesan:'Koneksi gagal: '+e.message, data:[] }; }
}
async function ambilData(sheet, forceRefresh) {
  if (isDemo()) return { ok:true, data: DUMMY_DATA[sheet] || [] };
  var now = Date.now();
  if (!forceRefresh && CACHE[sheet] && (now - CACHE[sheet].time) < CACHE_TTL) return CACHE[sheet].result;
  var r = await apiPost('baca', { sheet: sheet });
  CACHE[sheet] = { result: r, time: now };
  return r;
}
function clearCache(sheet) { if (sheet) delete CACHE[sheet]; else CACHE = {}; }
async function simpanData(sheet, data) {
  if (isDemo()) { showToast('Mode demo tidak bisa menyimpan', 'warning'); return { ok:false }; }
  return apiPost('tulis_unik', { sheet: sheet, data: data });

function bisaIklan() { return !isOwner(); }
function bolehIklan() { if (!bisaIklan()) return false; return (Date.now() - iklanState.lastShow) >= IKLAN_COOLDOWN; }
function getUrlIklanRandom() { return Math.random() < 0.5 ? IKLAN_URL_MONETAG : IKLAN_URL_ADSTERRA; }
function getKataIklanRandom() {
  var isAdminAsli = isAdmin() && !isDemo();
  var list = isAdminAsli ? KATA_IKLAN_ADMIN : KATA_IKLAN_UMUM;
  var idx;
  do { idx = Math.floor(Math.random() * list.length); } while (idx === lastKataIklan && list.length > 1);
  lastKataIklan = idx;
  return list[idx];
}
function paksaIklan(callback) {
  if (!bolehIklan()) { if (callback) callback(); return; }
  var loading = document.getElementById('loadingIklan');
  var teks = document.getElementById('iklanTeks');
  if (teks) teks.textContent = getKataIklanRandom();
  if (loading) loading.classList.add('show');
  try {
    window.open(getUrlIklanRandom(), '_blank');
    if (typeof window.AndroidAds !== 'undefined') window.AndroidAds.showInterstitial();
  } catch(e) {}
  iklanState.lastShow = Date.now();
  setTimeout(function() {
    if (loading) loading.classList.remove('show');
    if (callback) callback();
  }, IKLAN_DURASI);
}
function sedekahIklan() {
  var loading = document.getElementById('loadingIklan');
  var teks = document.getElementById('iklanTeks');
  if (teks) teks.textContent = getKataIklanRandom();
  if (loading) loading.classList.add('show');
  try {
    window.open(getUrlIklanRandom(), '_blank');
    if (typeof window.AndroidAds !== 'undefined') window.AndroidAds.showInterstitial();
  } catch(e) {}
  setTimeout(function() {
    if (loading) loading.classList.remove('show');
    showToast('Terima kasih sudah dukung mimin! 💛', 'success');
  }, IKLAN_DURASI);
}

async function cobaLogin() {
  var id = (document.getElementById('loginId').value || '').trim();
  var pass = (document.getElementById('loginPass').value || '').trim();
  var errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  if (!id) { errBox.textContent = 'ID tidak boleh kosong'; errBox.style.display = 'block'; return; }
  if (!pass) { errBox.textContent = 'Password tidak boleh kosong'; errBox.style.display = 'block'; return; }
  var btn = document.getElementById('btnMasuk');
  btn.disabled = true; btn.textContent = 'Memeriksa...';
  var r = await apiPost('baca', { sheet: 'Users' });
  if (!r.ok) {
    btn.disabled = false; btn.textContent = 'MASUK';
    errBox.textContent = r.pesan || 'Gagal terhubung ke server';
    errBox.style.display = 'block'; return;
  }
  var users = Array.isArray(r.data) ? r.data : [];
  var found = null;
  for (var i=0; i<users.length; i++) {
    var u = users[i];
    if (String(u.id).trim() === id && String(u.password).trim() === pass
        && String(u.status).toLowerCase() === 'aktif'
        && String(u.dihapus).toLowerCase() !== 'true') { found = u; break; }
  }
  if (!found) {
    btn.disabled = false; btn.textContent = 'MASUK';
    errBox.textContent = 'ID atau Password salah';
    errBox.style.display = 'block'; return;
  }
  var session = {
    user_id: String(found.id),
    user_nama: String(found.nama || found.id),
    user_jabatan: String(found.jabatan || 'Karyawan'),
    kode_cabang: String(found.kode_cabang || '-'),
    is_demo: false,
    login_time: Date.now()
  };
  saveSession(session);
  if (session.user_jabatan === 'Owner') tampilkanDashboard();
  else paksaIklan(function(){ tampilkanDashboard(); });
}

function cobaDemo(role) {
  var session = {
    user_id: 'demo_' + role.toLowerCase().replace(/\s/g,'_'),
    user_nama: 'Demo ' + role,
    user_jabatan: role,
    kode_cabang: (role === 'Karyawan' || role === 'Kepala Toko') ? 'GROBOGAN' : '-',
    is_demo: true,
    login_time: Date.now()
  };
  saveSession(session);
  paksaIklan(function(){ tampilkanDashboard(); });
}

function tampilkanDashboard() {

async function navigasi(pageId) {

    paksaIklan(function(){ lanjutNavigasi(pageId, main); });

}

async function lanjutNavigasi(pageId, main) {
  main.innerHTML = '<div class="empty"><div class="em-ic">⏳</div>Memuat...</div>';
  try {
    switch(pageId) {
      case 'home': await renderHome(main); break;
      case 'input': await renderInput(main); break;
      case 'payroll': await renderPayroll(main); break;
      case 'payroll_saya': await renderPayrollSaya(main); break;
      case 'rekap': await renderRekap(main); break;
      case 'kelola': await renderKelola(main); break;
      case 'profil': await renderProfil(main); break;
      default: main.innerHTML = '<div class="empty"><div class="em-ic">🚧</div>Halaman belum tersedia</div>';
    }
  } catch(e) {
    console.error('Render error:', e);
    main.innerHTML = '<div class="empty"><div class="em-ic">⚠️</div>Terjadi kesalahan: ' + esc(e.message) + '</div>';
  }
  window.scrollTo(0, 0);
}

async function previewInput() {
  var s = getSession();
  var karyawan = window._inputKaryawan || [];
  var list = document.querySelectorAll('#listKaryawan [data-idx]');
  var inputData = [];
  list.forEach(function(w, i) {
    var k = karyawan[i];
    if (!k) return;
    var masuk = w.querySelector('.inp-masuk').value;
    var unit = Number(w.querySelector('.inp-unit').value || 0);
    var tips = Number(w.querySelector('.inp-tips').value || 0);
    var kasbon = Number(w.querySelector('.inp-kasbon').value || 0);
    if (masuk === 'tidak') { unit = 0; tips = 0; }
    inputData.push({
      id_karyawan: k.id, nama_karyawan: k.nama, jabatan: k.jabatan,
      kode_cabang: k.kode_cabang, unit: unit, tips: tips, kasbon: kasbon,
      wifi: 1000, status_masuk: masuk
    });
  });
  if (inputData.length === 0) return showToast('Tidak ada data', 'error');
  var jumlahMasuk = inputData.filter(function(d) { return d.status_masuk === 'ya'; }).length;
  var totalUnit = inputData.reduce(function(a, d) { return a + d.unit; }, 0);
  var totalTips = inputData.reduce(function(a, d) { return a + d.tips; }, 0);
  if (jumlahMasuk === 0) return showToast('Minimal 1 orang masuk', 'error');
  var unitPer = Math.floor(totalUnit / jumlahMasuk);
  var tipsPer = Math.floor(totalTips / jumlahMasuk);
  var sisaUnit = totalUnit - (unitPer * jumlahMasuk);
  var sisaTips = totalTips - (tipsPer * jumlahMasuk);
  var targetHarian = 30;
  var rt = await ambilData('Target_Cabang');
  if (rt.ok) rt.data.forEach(function(t) { if (t.kode_cabang === s.kode_cabang) targetHarian = Number(t.target_harian || 30); });
  var tembus = totalUnit >= targetHarian;
  inputData.forEach(function(d) {
    if (d.status_masuk === 'ya') {
      if (d.jabatan === 'Kepala Toko') { d.unit = unitPer + sisaUnit; d.tips = tipsPer + sisaTips; d.bonus = tembus ? 10000 : 0; }
      else { d.unit = unitPer; d.tips = tipsPer; d.bonus = tembus ? 5000 : 0; }
    } else { d.unit = 0; d.tips = 0; d.bonus = 0; }
    d.tembus_target = tembus ? 'ya' : 'tidak';
  });
  var html = '<div class="card"><div class="card-title">🔍 Preview</div>';
  html += '<div class="info-row"><span class="ir-label">Total Unit</span><span class="ir-val">' + fmtAngka(totalUnit) + '</span></div>';
  html += '<div class="info-row"><span class="ir-label">Total Tips</span><span class="ir-val">' + fmtRupiah(totalTips) + '</span></div>';
  html += '<div class="info-row"><span class="ir-label">Masuk</span><span class="ir-val">' + jumlahMasuk + ' orang</span></div>';
  html += '<div class="info-row"><span class="ir-label">Tembus Target</span><span class="ir-val">' + (tembus ? '✅ Ya' : '❌ Tidak') + '</span></div>';
  html += '<div class="divider"></div>';
  html += '<div class="tbl-wrap"><table><thead><tr><th>Nama</th><th>Unit</th><th>Tips</th><th>Bonus</th><th>Kasbon</th></tr></thead><tbody>';
  inputData.forEach(function(d) {
    html += '<tr><td>' + esc(d.nama_karyawan) + '</td><td>' + d.unit + '</td><td>' + fmtRupiah(d.tips) + '</td><td>' + fmtRupiah(d.bonus) + '</td><td>' + fmtRupiah(d.kasbon) + '</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="divider"></div>';
  html += '<button class="btn btn-gold" onclick="simpanInput()">✅ Konfirmasi & Simpan</button>';
  html += '<button class="btn btn-gray" style="margin-top:8px" onclick="navigasi(\'input\')">Batal</button>';
  html += '</div>';
  var main = document.getElementById('mainContent');
  if (main) main.innerHTML = html;
  window._previewData = inputData;
  window._previewTanggal = document.getElementById('inpTanggal').value;
}

async function simpanInput() {
  var data = window._previewData;
  var tanggal = window._previewTanggal;
  if (!data) return showToast('Preview hilang', 'error');
  paksaIklan(function() {
    (async function() {
      var s = getSession();
      var subBase = generateSubmissionId('PH');
      var totalUnit = data.reduce(function(a, x) { return a + x.unit; }, 0);
      var totalTips = data.reduce(function(a, x) { return a + x.tips; }, 0);
      var ok = 0;
      for (var i = 0; i < data.length; i++) {
        var d = data[i];
        var row = Object.assign({}, d, {
          tanggal: tanggal,
          total_unit_cabang: totalUnit,
          total_tips_cabang: totalTips,
          input_by: s.user_nama,
          submission_id: subBase + '-' + i,
          created_at: nowISO()
        });
        var r = await simpanData('Pendapatan_Harian', row);
        if (r.ok) ok++;
      }
      if (ok > 0) {
        clearCache('Pendapatan_Harian');
        showToast('Berhasil simpan ' + ok + ' data', 'success');
        navigasi('home');
      } else showToast('Gagal menyimpan', 'error');
    })();
  });
}

  var data = (r.ok ? r.data : []).filter(function(p) { return String(p.id_karyawan) === String(s.user_id); });
  var html = '<div class="card"><div class="card-title">💰 Payroll Saya</div>';
  if (data.length === 0) {
    html += '<div class="empty"><div class="em-ic">📭</div>Belum ada payroll</div>';
  } else {
    data.forEach(function(p) {
      html += '<div class="card" style="background:#F9FAFB;padding:12px;margin-bottom:10px">';
      html += '<div style="font-weight:700;font-size:13px;margin-bottom:6px">' + esc(p.periode) + '</div>';
      html += '<div class="info-row"><span class="ir-label">Unit</span><span class="ir-val">' + p.total_unit + '</span></div>';
      html += '<div class="info-row"><span class="ir-label">Tips</span><span class="ir-val">' + fmtRupiah(p.total_tips) + '</span></div>';
      html += '<div class="info-row"><span class="ir-label">Bonus</span><span class="ir-val">' + fmtRupiah(p.total_bonus) + '</span></div>';
      html += '<div class="info-row"><span class="ir-label">Kasbon</span><span class="ir-val">−' + fmtRupiah(p.total_kasbon) + '</span></div>';
      html += '<div class="info-row"><span class="ir-label">Wifi</span><span class="ir-val">−' + fmtRupiah(p.total_wifi) + '</span></div>';
      html += '<div class="info-row"><span class="ir-label"><b>Gaji</b></span><span class="ir-val" style="color:#059669"><b>' + fmtRupiah(p.total_payroll) + '</b></span></div>';
      html += '</div>';
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// RENDER REKAP (Owner/Admin)
// ═══════════════════════════════════════════════════════════════
async function renderRekap(el) {
  if (!el) return;
  var r = await ambilData('Pendapatan_Harian');
  var data = r.ok ? r.data : [];
  var perCabang = {};
  var totalUnit = 0;
  data.forEach(function(d) {
    var k = d.kode_cabang || '—';
    if (!perCabang[k]) perCabang[k] = { unit: 0, tips: 0, bonus: 0, kasbon: 0 };
    perCabang[k].unit += Number(d.unit || 0);
    perCabang[k].tips += Number(d.tips || 0);
    perCabang[k].bonus += Number(d.bonus || 0);
    perCabang[k].kasbon += Number(d.kasbon || 0);
    totalUnit += Number(d.unit || 0);
  });
  var hakOwner = totalUnit * 4000;
  var html = '<div class="card"><div class="card-title">📊 Rekap Pendapatan</div>';
  html += '<div class="stat-grid">';
  html += '<div class="stat-card"><div class="st-label">Total Unit</div><div class="st-val">' + fmtAngka(totalUnit) + '</div></div>';
  html += '<div class="stat-card"><div class="st-label">Hak Owner</div><div class="st-val gold">' + fmtRupiah(hakOwner) + '</div></div>';
  html += '</div>';
  html += '<div class="divider"></div>';
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:8px">Per Cabang</div>';
  if (Object.keys(perCabang).length === 0) {
    html += '<div class="empty"><div class="em-ic">📭</div>Belum ada data</div>';
  } else {
    html += '<div class="tbl-wrap"><table><thead><tr><th>Cabang</th><th>Unit</th><th>Hak Owner</th></tr></thead><tbody>';
    Object.keys(perCabang).forEach(function(k) {
      html += '<tr><td><strong>' + esc(k) + '</strong></td><td>' + fmtAngka(perCabang[k].unit) + '</td><td>' + fmtRupiah(perCabang[k].unit * 4000) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// RENDER KELOLA (Owner) — Karyawan & Cabang
// ═══════════════════════════════════════════════════════════════
async function renderKelola(el) {
  if (!el) return;
  var html = '<div class="tabs">';
  html += '<button class="tab active" onclick="tabKelola(this,\'karyawan\')">Karyawan</button>';
  html += '<button class="tab" onclick="tabKelola(this,\'cabang\')">Cabang</button>';
  html += '</div><div id="tabKelolaContent"></div>';
  el.innerHTML = html;
  await tabKelola(el.querySelector('.tabs .tab.active'), 'karyawan');
}

async function tabKelola(btn, tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var el = document.getElementById('tabKelolaContent');
  if (!el) return;

  if (tab === 'karyawan') {
    var r = await ambilData('Users', true);
    var users = r.ok ? r.data : [];
    var html = '<div class="card"><div class="card-title">👥 Karyawan</div>';
    html += '<button class="btn btn-gold" onclick="bukaFormUser()">➕ Tambah Karyawan</button>';
    html += '<div class="divider"></div>';
    html += '<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Nama</th><th>Jabatan</th><th>Cabang</th><th>Aksi</th></tr></thead><tbody>';
    users.forEach(function(u) {
      if (String(u.dihapus).toLowerCase() === 'true') return;
      var isOwnerRow = u.jabatan === 'Owner';
      html += '<tr>';
      html += '<td>' + esc(u.id) + '</td>';
      html += '<td>' + esc(u.nama) + '</td>';
      html += '<td>' + esc(u.jabatan) + '</td>';
      html += '<td>' + esc(u.kode_cabang) + '</td>';
      html += '<td style="white-space:nowrap">';
      if (!isOwnerRow) {
        html += '<button class="btn btn-xs btn-outline" onclick="editUser(' + u._row + ')">✏️</button> ';
        html += '<button class="btn btn-xs btn-gray" onclick="naikJabatan(' + u._row + ')">⬆️</button> ';
        html += '<button class="btn btn-xs btn-gray" onclick="turunJabatan(' + u._row + ')">⬇️</button> ';
        html += '<button class="btn btn-xs btn-danger" onclick="hapusUser(' + u._row + ')">🗑️</button>';
      } else {
        html += '<span class="badge badge-warning">MUTLAK</span>';
      }
      html += '</td></tr>';
    });
    html += '</tbody></table></div></div>';
    el.innerHTML = html;
    window._usersCache = users;
  } else {
    var rc = await ambilData('Target_Cabang', true);
    var cabang = rc.ok ? rc.data : [];
    var html = '<div class="card"><div class="card-title">🏪 Cabang</div>';
    html += '<button class="btn btn-gold" onclick="bukaFormCabang()">➕ Tambah Cabang</button>';
    html += '<div class="divider"></div>';
    html += '<div class="tbl-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Target</th><th>Aksi</th></tr></thead><tbody>';
    cabang.forEach(function(c) {
      html += '<tr>';
      html += '<td>' + esc(c.kode_cabang) + '</td>';
      html += '<td>' + esc(c.nama_cabang) + '</td>';
      html += '<td>' + esc(c.target_harian) + '</td>';
      html += '<td style="white-space:nowrap">';
      html += '<button class="btn btn-xs btn-outline" onclick="editCabang(' + c._row + ')">✏️</button> ';
      html += '<button class="btn btn-xs btn-danger" onclick="hapusCabang(' + c._row + ')">🗑️</button>';
      html += '</td></tr>';
    });
    html += '</tbody></table></div></div>';
    el.innerHTML = html;
    window._cabangCache = cabang;
  }
}

function bukaFormUser() {
  bukaModal('Tambah Karyawan',
    '<div class="form-group"><label class="form-label">ID</label><input type="text" class="form-input" id="muId" placeholder="Contoh: 4004"></div>'
    + '<div class="form-group"><label class="form-label">Nama</label><input type="text" class="form-input" id="muNama" placeholder="Nama lengkap"></div>'
    + '<div class="form-group"><label class="form-label">Jabatan</label><select class="form-select" id="muJabatan"><option>Admin</option><option>Kepala Toko</option><option selected>Karyawan</option></select></div>'
    + '<div class="form-group"><label class="form-label">Kode Cabang</label><input type="text" class="form-input" id="muCabang" placeholder="Contoh: GROBOGAN"></div>'
    + '<div class="form-group"><label class="form-label">Password</label><input type="text" class="form-input" id="muPassword" value="123456"></div>'
    + '<button class="btn btn-primary" onclick="simpanUserBaru()">Simpan</button>');
}

async function simpanUserBaru() {
  var data = {
    id: (document.getElementById('muId').value || '').trim(),
    nama: (document.getElementById('muNama').value || '').trim(),
    jabatan: document.getElementById('muJabatan').value,
    kode_cabang: (document.getElementById('muCabang').value || '').trim(),
    password: document.getElementById('muPassword').value || '123456',
    status: 'aktif',
    tanggal_masuk: todayStr(),
    dihapus: false,
    created_at: nowISO()
  };
  if (!data.id || !data.nama) return showToast('ID & Nama wajib', 'error');
  var r = await simpanData('Users', data);
  if (r.ok) { clearCache('Users'); showToast('Ditambahkan', 'success'); tutupModal(); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

function editUser(row) {
  var users = window._usersCache || [];
  var u = users.find(function(x) { return x._row === row; });
  if (!u) return;
  bukaModal('Edit Karyawan',
    '<div class="form-group"><label class="form-label">ID</label><input type="text" class="form-input" id="euId" value="' + esc(u.id) + '"></div>'
    + '<div class="form-group"><label class="form-label">Nama</label><input type="text" class="form-input" id="euNama" value="' + esc(u.nama) + '"></div>'
    + '<div class="form-group"><label class="form-label">Password</label><input type="text" class="form-input" id="euPass" value="' + esc(u.password) + '"></div>'
    + '<button class="btn btn-primary" onclick="simpanEditUser(' + row + ')">Simpan</button>');
}

async function simpanEditUser(row) {
  var data = {
    id: (document.getElementById('euId').value || '').trim(),
    nama: (document.getElementById('euNama').value || '').trim(),
    password: document.getElementById('euPass').value
  };
  if (!data.id || !data.nama) return showToast('ID & Nama wajib', 'error');
  var r = await updateData('Users', row, data);
  if (r.ok) { clearCache('Users'); showToast('Diperbarui', 'success'); tutupModal(); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

async function naikJabatan(row) {
  var users = window._usersCache || [];
  var u = users.find(function(x) { return x._row === row; });
  if (!u) return;
  if (u.jabatan === 'Owner') return showToast('Owner mutlak', 'error');
  var next = { 'Karyawan': 'Kepala Toko', 'Kepala Toko': 'Admin' }[u.jabatan];
  if (!next) return showToast('Mentok di Admin', 'error');
  var r = await updateData('Users', row, { jabatan: next });
  if (r.ok) { clearCache('Users'); showToast('Naik ke ' + next, 'success'); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

async function turunJabatan(row) {
  var users = window._usersCache || [];
  var u = users.find(function(x) { return x._row === row; });
  if (!u) return;
  if (u.jabatan === 'Owner') return showToast('Owner mutlak', 'error');
  var prev = { 'Admin': 'Kepala Toko', 'Kepala Toko': 'Karyawan' }[u.jabatan];
  if (!prev) return showToast('Tidak bisa turun lagi', 'error');
  var r = await updateData('Users', row, { jabatan: prev });
  if (r.ok) { clearCache('Users'); showToast('Turun ke ' + prev, 'success'); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

async function hapusUser(row) {
  if (!confirm('Yakin hapus karyawan ini?')) return;
  var r = await updateData('Users', row, { dihapus: true });
  if (r.ok) { clearCache('Users'); showToast('Dihapus', 'success'); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

function bukaFormCabang() {
  bukaModal('Tambah Cabang',
    '<div class="form-group"><label class="form-label">Kode Cabang</label><input type="text" class="form-input" id="mcKode" placeholder="Contoh: GROBOGAN"></div>'
    + '<div class="form-group"><label class="form-label">Nama Cabang</label><input type="text" class="form-input" id="mcNama" placeholder="Contoh: Grobogan"></div>'
    + '<div class="form-group"><label class="form-label">Target Harian (unit)</label><input type="number" class="form-input" id="mcTarget" value="50"></div>'
    + '<button class="btn btn-primary" onclick="simpanCabangBaru()">Simpan</button>');
}

async function simpanCabangBaru() {
  var data = {
    kode_cabang: (document.getElementById('mcKode').value || '').trim().toUpperCase(),
    nama_cabang: (document.getElementById('mcNama').value || '').trim(),
    target_harian: Number(document.getElementById('mcTarget').value || 50),
    status: 'aktif',
    created_at: nowISO()
  };
  if (!data.kode_cabang || !data.nama_cabang) return showToast('Kode & Nama wajib', 'error');
  var r = await simpanData('Target_Cabang', data);
  if (r.ok) { clearCache('Target_Cabang'); showToast('Ditambahkan', 'success'); tutupModal(); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

function editCabang(row) {
  var cabang = window._cabangCache || [];
  var c = cabang.find(function(x) { return x._row === row; });
  if (!c) return;
  bukaModal('Edit Cabang',
    '<div class="form-group"><label class="form-label">Kode</label><input type="text" class="form-input" value="' + esc(c.kode_cabang) + '" disabled></div>'
    + '<div class="form-group"><label class="form-label">Nama</label><input type="text" class="form-input" id="ecNama" value="' + esc(c.nama_cabang) + '"></div>'
    + '<div class="form-group"><label class="form-label">Target Harian</label><input type="number" class="form-input" id="ecTarget" value="' + esc(c.target_harian) + '"></div>'
    + '<button class="btn btn-primary" onclick="simpanEditCabang(' + row + ')">Simpan</button>');
}

async function simpanEditCabang(row) {
  var data = {
    nama_cabang: (document.getElementById('ecNama').value || '').trim(),
    target_harian: Number(document.getElementById('ecTarget').value || 50)
  };
  if (!data.nama_cabang) return showToast('Nama wajib', 'error');
  var r = await updateData('Target_Cabang', row, data);
  if (r.ok) { clearCache('Target_Cabang'); showToast('Diperbarui', 'success'); tutupModal(); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

async function hapusCabang(row) {
  if (!confirm('Yakin hapus cabang ini?')) return;
  var r = await hapusData('Target_Cabang', row);
  if (r.ok) { clearCache('Target_Cabang'); showToast('Dihapus', 'success'); navigasi('kelola'); }
  else showToast(r.pesan || 'Gagal', 'error');
}

async function renderProfil(el) {
  if (!el) return;
  var s = getSession();

  var html = '<div class="card"><div class="card-title">👤 Profil</div>';

  html += '<div class="info-row"><span class="ir-label">Nama</span><span class="ir-val">' + esc(s.user_nama) + '</span></div>';
  html += '<div class="info-row"><span class="ir-label">Jabatan</span><span class="ir-val">' + esc(s.user_jabatan) + '</span></div>';
  html += '<div class="info-row"><span class="ir-label">Cabang</span><span class="ir-val">' + esc(s.kode_cabang) + '</span></div>';

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function init() {
  document.getElementById('btnMasuk').addEventListener('click', cobaLogin);
  document.getElementById('btnDemo').addEventListener('click', bukaModalDemo);
  document.getElementById('togglePass').addEventListener('click', function() {
    var inp = document.getElementById('loginPass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    this.textContent = inp.type === 'password' ? '👁' : '🙈';
  });
  document.getElementById('loginPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') cobaLogin();
  });
  document.getElementById('loginId').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('loginPass').focus();
  });

  var s = getSession();
  if (s) tampilkanDashboard();
  else tampilkanLogin();
}

document.addEventListener('DOMContentLoaded', init);
</script>
