/* ============================================================
   SESSION & ROLE
============================================================ */
function getSession() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.login_time) return null;
    var maxAge = s.is_demo ? (15 * 60 * 1000) : (8 * 60 * 60 * 1000);
    if (Date.now() - s.login_time > maxAge) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s;
  } catch(e) {
    localStorage.removeItem(SESSION_KEY);
    return null;
  }
}

function isDemo() { var s = getSession(); return s && s.is_demo === true; }
function isOwner() { var s = getSession(); return s && s.user_jabatan === 'Owner'; }
function isAdmin() { var s = getSession(); return s && s.user_jabatan === 'Admin'; }
function isKepalaToko() { var s = getSession(); return s && s.user_jabatan === 'Kepala Toko'; }
function isKaryawan() { var s = getSession(); return s && s.user_jabatan === 'Karyawan'; }

function bisaIklan() { return !isOwner() && !isDemo(); }

/* ============================================================
   ROLE-BASED ACCESS — ATURAN FINAL
   - Owner & Admin: TIDAK ajukan izin, TIDAK payroll pribadi, TIDAK ajukan kerusakan
                    TAPI: ACC izin, ACC kerusakan, ACC permintaan payroll
   - Kepala Toko & Karyawan: AJUKAN izin, AJUKAN kerusakan, PUNYA payroll pribadi
                    Kepala Toko: ACC izin tahap 1
============================================================ */
function canAjukanIzin() { return isKepalaToko() || isKaryawan(); }
function canAjukanKerusakan() { return isKepalaToko() || isKaryawan(); }
function canAjukanPayrollReq() { return isKepalaToko() || isKaryawan(); }
function hasPayrollPribadi() { return isKepalaToko() || isKaryawan(); }

function canAccIzinTahap1() { return isKepalaToko(); }
function canAccIzinTahap2() { return isOwner() || isAdmin(); }
function canAccKerusakan() { return isOwner() || isAdmin(); }
function canAccPermintaanPayroll() { return isOwner() || isAdmin(); }

function canAturTarget() { return isOwner(); }
function canAksesPengeluaran() { return isOwner() || isAdmin(); }
function canAksesManusia() { return isOwner(); }
function canInputPendapatan() { return isOwner() || isAdmin() || isKepalaToko(); }
function canModifPayrollAll() { return isOwner(); }

function logout() {
  if (!confirm('Keluar dari aplikasi?')) return;
  localStorage.removeItem(SESSION_KEY);
  window.location.replace('index.html');
}

/* ============================================================
   API WRAPPER
============================================================ */
function apiPost(action, data) {
  return fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ action: action, token: TOKEN }, data)),
    redirect: 'follow'
  })
  .then(function(res){ return res.text(); })
  .then(function(text){
    try { return JSON.parse(text); }
    catch(e){ return { ok:false, pesan:'Respons tidak valid' }; }
  })
  .catch(function(e){ return { ok:false, pesan:'Gagal terhubung ke server' }; });
}

function ambilData(sheet) {
  if (isDemo()) return Promise.resolve({ ok:true, data: DUMMY_DATA[sheet] || [] });
  return apiPost('baca', { sheet: sheet });
}
function simpanData(sheet, data) {
  if (isDemo()) { showToast('Mode demo — tidak bisa menyimpan','warning'); return Promise.resolve({ok:false}); }
  return apiPost('tulis', { sheet: sheet, data: data });
}

function tampilkanIklan(jenis) {
  if (!bisaIklan()) return true;
  if (jenis === 'interstitial') {
    var last = localStorage.getItem('last_ad');
    if (last && Date.now() - parseInt(last) < 120000) return true;
  }
  var isWebView = navigator.userAgent.indexOf('wv') > -1 ||
                  typeof window.AndroidAds !== 'undefined';
  try {
    if (isWebView && window.AndroidAds) {
      if (jenis === 'rewarded') window.AndroidAds.showRewarded();
      else window.AndroidAds.showInterstitial();
    }
    if (jenis === 'interstitial') localStorage.setItem('last_ad', Date.now().toString());
    return true;
  } catch(e) { console.error('Iklan error:', e); return true; }
}

var counterSimpan = parseInt(localStorage.getItem('counter_simpan') || '0');
function incrementCounterSimpan() {
  counterSimpan++;
  localStorage.setItem('counter_simpan', counterSimpan.toString());
  return counterSimpan;
}

/* ============================================================
   UI HELPERS
============================================================ */
function showToast(msg, type) {
  var box = document.getElementById('toastBox');
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }, 3000);
}
function esc(s) {
  if (s === undefined || s === null || s === '') return '-';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function todayStr() {
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}
function fmtRupiah(n) { n = parseInt(n) || 0; return 'Rp ' + n.toLocaleString('id-ID'); }
function nowISO() { return new Date().toISOString(); }

function hitungRekapOwner(pendapatan, target, pengeluaran, dari, sampai) {
  var filtered = pendapatan.filter(function(d){ return d.tanggal >= dari && d.tanggal <= sampai; });
  var perCabang = {};
  filtered.forEach(function(d){
    var k = d.kode_cabang || '-';
    if (!perCabang[k]) perCabang[k] = { kode:k, unit:0, hariSet:{}, tips:0, bonus:0, kasbon:0, wifi:0, totalHari:0 };
    perCabang[k].unit += parseInt(d.unit) || 0;
    perCabang[k].tips += parseInt(d.tips) || 0;
    perCabang[k].bonus += parseInt(d.bonus) || 0;
    perCabang[k].kasbon += parseInt(d.kasbon) || 0;
    perCabang[k].wifi += parseInt(d.wifi) || 0;
    perCabang[k].hariSet[d.tanggal] = true;
  });

  var targetMap = {};
  target.forEach(function(t){ targetMap[t.kode_cabang] = t; });

  var pengeluaranFiltered = pengeluaran.filter(function(p){ return p.tanggal >= dari && p.tanggal <= sampai; });
  var pengeluaranPerCabang = {};
  var totalPengeluaran = 0;
  pengeluaranFiltered.forEach(function(p){
    var k = p.kode_cabang || '-';
    if (!pengeluaranPerCabang[k]) pengeluaranPerCabang[k] = 0;
    var jml = parseInt(p.jumlah) || 0;
    pengeluaranPerCabang[k] += jml;
    totalPengeluaran += jml;
  });

  var totalUnit = 0, totalHakOwner = 0;
  var cabangList = Object.keys(perCabang).map(function(k){
    var c = perCabang[k];
    c.totalHari = Object.keys(c.hariSet).length;
    c.hakOwner = c.unit * HARGA_PER_UNIT;
    c.hakKaryawan = c.tips + c.bonus - c.kasbon - c.wifi;
    var tg = targetMap[k];
    c.targetHarian = tg ? parseInt(tg.target_harian) || 0 : 0;
    c.nama = tg ? (tg.nama_cabang || k) : k;
    c.targetTotal = c.targetHarian * c.totalHari;
    c.tembus = c.targetTotal > 0 && c.unit >= c.targetTotal;
    c.pengeluaran = pengeluaranPerCabang[k] || 0;
    c.bersihOwner = c.hakOwner - c.pengeluaran;
    totalUnit += c.unit;
    totalHakOwner += c.hakOwner;
    return c;
  });
  cabangList.sort(function(a,b){ return b.hakOwner - a.hakOwner; });

  var totalBersihOwner = totalHakOwner - totalPengeluaran;
  var totalHakKaryawan = 0;
  filtered.forEach(function(d){
    totalHakKaryawan += ((parseInt(d.tips)||0) + (parseInt(d.bonus)||0) - (parseInt(d.kasbon)||0) - (parseInt(d.wifi)||0));
  });

  var html = '';
  html += '<div class="total-banner">';
  html += '<div class="tb-lbl">PENDAPATAN BERSIH OWNER</div>';
  html += '<div class="tb-val">' + fmtRupiah(totalBersihOwner) + '</div>';
  html += '<div class="tb-sub">Periode ' + dari + ' s/d ' + sampai + ' • ' + totalUnit.toLocaleString('id-ID') + ' unit</div>';
  html += '</div>';

  html += '<div class="stat-grid">';
  html += '<div class="stat-card"><div class="sc-lbl">Unit Terjual</div><div class="sc-val">' + totalUnit.toLocaleString('id-ID') + '</div><div class="sc-sub">@ ' + fmtRupiah(HARGA_PER_UNIT) + '</div></div>';
  html += '<div class="stat-card gold"><div class="sc-lbl">Hak Owner</div><div class="sc-val">' + fmtRupiah(totalHakOwner) + '</div><div class="sc-sub">unit × 4.000</div></div>';
  html += '<div class="stat-card" style="border-left-color:#DC2626"><div class="sc-lbl">Pengeluaran</div><div class="sc-val" style="color:#DC2626">-' + fmtRupiah(totalPengeluaran) + '</div><div class="sc-sub">Dipotong owner</div></div>';
  html += '<div class="stat-card green"><div class="sc-lbl">Bersih Owner</div><div class="sc-val" style="color:#059669">' + fmtRupiah(totalBersihOwner) + '</div><div class="sc-sub">Hak Owner - Pengeluaran</div></div>';
  html += '</div>';

  html += '<div class="card"><h3>Perhitungan Owner</h3>';
  html += '<div class="info-row"><span class="lbl">Total Unit Semua Cabang</span><span class="val">' + totalUnit.toLocaleString('id-ID') + ' unit</span></div>';
  html += '<div class="info-row"><span class="lbl">Hak Owner (' + totalUnit + ' × ' + fmtRupiah(HARGA_PER_UNIT) + ')</span><span class="val" style="color:#059669">' + fmtRupiah(totalHakOwner) + '</span></div>';
  html += '<div class="info-row"><span class="lbl">Total Pengeluaran</span><span class="val" style="color:#DC2626">-' + fmtRupiah(totalPengeluaran) + '</span></div>';
  html += '<div class="info-row" style="border-top:2px solid #C8102E;margin-top:4px;padding-top:10px"><span class="lbl" style="font-weight:700;color:#1F2937">PENDAPATAN BERSIH OWNER</span><span class="val" style="color:#C8102E;font-size:16px">' + fmtRupiah(totalBersihOwner) + '</span></div>';
  html += '</div>';

  html += '<div class="card" style="background:#F0FDF4;border-left:4px solid #059669">';
  html += '<h3 style="color:#065F46">Hak Karyawan (Tidak Masuk Owner)</h3>';
  html += '<p style="font-size:11px;color:#047857;margin-bottom:8px">Tips, bonus, kasbon, wifi — full milik karyawan.</p>';
  html += '<div class="info-row"><span class="lbl">Total Hak Karyawan</span><span class="val" style="color:#059669">' + fmtRupiah(totalHakKaryawan) + '</span></div>';
  html += '</div>';

  html += '<div class="card"><h3>Rekap Per Cabang (' + cabangList.length + ')</h3>';
  if (cabangList.length === 0) html += '<div class="empty"><div class="ei">📭</div>Belum ada data di periode ini</div>';
  else {
    cabangList.forEach(function(c){
      html += '<div class="cabang-row">';
      html += '<div class="cr-info">';
      html += '<div class="cr-nama">' + esc(c.nama) + ' <span class="badge ' + (c.tembus ? 'badge-gold' : 'badge-gray') + '">' + (c.tembus ? 'TEMBUS' : 'BELUM') + '</span></div>';
      html += '<div class="cr-detail">' + c.unit + ' unit × 4rb = <b>' + fmtRupiah(c.hakOwner) + '</b> • ' + c.totalHari + ' hari</div>';
      if (c.pengeluaran > 0) html += '<div class="cr-detail" style="color:#DC2626">Pengeluaran: -' + fmtRupiah(c.pengeluaran) + '</div>';
      html += '</div>';
      html += '<div><div class="cr-total">' + fmtRupiah(c.bersihOwner) + '</div><div class="cr-unit">bersih owner</div></div>';
      html += '</div>';
    });
  }
  html += '</div>';
  document.getElementById('poHasil').innerHTML = html;
}

    html += '<div class="fgroup"><label>Cabang</label><select id="pdCabang"' + (isKepalaToko() ? ' disabled' : '') + '>';

      var sel = (isKepalaToko() && String(c.kode_cabang) === String(session.kode_cabang)) ? ' selected' : '';
      html += '<option value="' + esc(c.kode_cabang) + '"' + sel + '>' + esc(c.nama_cabang || c.kode_cabang) + '</option>';

    html += '<div class="frow">';
    html += '<div class="fgroup"><label>Unit</label><input type="number" id="pdUnit" value="0" min="0"></div>';

    html += '</div>';

    html += '<div class="fgroup"><label>Kasbon</label><input type="number" id="pdKasbon" value="0" min="0"></div>';
    html += '<div class="fgroup"><label>WiFi</label><input type="number" id="pdWifi" value="1000" disabled></div>';
    html += '</div></div>';

    html += '<div id="pdFieldTidak" style="display:none">';
    html += '<div class="fgroup"><label>Kasbon (max 20.000)</label><input type="number" id="pdKasbonTidak" value="0" min="0" max="20000"></div>';

    html += '<option value="">-- Pilih --</option>';
    html += '<option value="izin">Izin</option>';
    html += '<option value="sakit">Sakit</option>';
    html += '<option value="libur">Libur</option>';
    html += '<option value="lain">Lainnya</option>';
    html += '</select></div></div>';

    html += '<div class="preview-box"><div class="pv-lbl">Pendapatan Karyawan</div><div class="pv-val" id="pdPreview">Rp 0</div></div>';
    html += '<button class="btn btn-primary" id="pdSubmit">Simpan Pendapatan</button>';
    html += '</div>';

    html += '<div class="card"><h3>Pendapatan Hari Ini</h3><div id="pdList"><div class="empty">Memuat...</div></div></div>';
    el.innerHTML = html;

    document.getElementById('pdMasuk').addEventListener('change', function(){
      var isMasuk = this.value === 'ya';
      document.getElementById('pdFieldMasuk').style.display = isMasuk ? 'block' : 'none';
      document.getElementById('pdFieldTidak').style.display = isMasuk ? 'none' : 'block';
      updatePreview();
    });
    ['pdUnit','pdTips','pdKasbon','pdKasbonTidak'].forEach(function(id){
      var inp = document.getElementById(id);
      if (inp) inp.addEventListener('input', updatePreview);
    });
    function updatePreview() {
      var isMasuk = document.getElementById('pdMasuk').value === 'ya';
      var total = 0;
      if (isMasuk) {
        var unit = parseInt(document.getElementById('pdUnit').value) || 0;
        var tips = parseInt(document.getElementById('pdTips').value) || 0;
        var kasbon = parseInt(document.getElementById('pdKasbon').value) || 0;
        total = unit + tips - kasbon - 1000;
      } else {
        var kasbonT = parseInt(document.getElementById('pdKasbonTidak').value) || 0;
        total = -kasbonT - 1000;
      }
      document.getElementById('pdPreview').textContent = fmtRupiah(total);
    }

    document.getElementById('pdSubmit').addEventListener('click', function(){
      if (isDemo()) { showToast('Mode demo — tidak bisa menyimpan','warning'); return; }
      var btn = this;
      btn.disabled = true; btn.innerHTML = 'Menyimpan...';

      var tanggal = document.getElementById('pdTanggal').value;
      var cabangVal = document.getElementById('pdCabang').value;
      var idKar = document.getElementById('pdKaryawan').value;
      var namaKar = document.getElementById('pdKaryawan').options[document.getElementById('pdKaryawan').selectedIndex].text.split(' (')[0];
      var statusMasuk = document.getElementById('pdMasuk').value;

      if (!tanggal || !cabangVal || !idKar) {
        showToast('Lengkapi semua field','error');
        btn.disabled = false; btn.textContent = 'Simpan Pendapatan';
        return;
      }
      if (isKepalaToko() && String(cabangVal) !== String(session.kode_cabang)) {
        showToast('Hanya bisa input cabang Anda sendiri','error');
        btn.disabled = false; btn.textContent = 'Simpan Pendapatan';
        return;
      }

      var data; var unitVal = 0;
      if (statusMasuk === 'ya') {
        var unit = parseInt(document.getElementById('pdUnit').value) || 0;
        var tips = parseInt(document.getElementById('pdTips').value) || 0;
        var kasbon = parseInt(document.getElementById('pdKasbon').value) || 0;
        unitVal = unit;
        data = {
          tanggal: tanggal, kode_cabang: cabangVal,
          id_karyawan: idKar, nama_karyawan: namaKar,
          status_masuk: 'ya', unit: unit, tips: tips,
          bonus: 0, kasbon: kasbon, wifi: 1000, tembus_target: 'tidak'
        };
      } else {
        var alasan = document.getElementById('pdAlasan').value;
        if (!alasan) { showToast('Pilih alasan tidak masuk','error'); btn.disabled = false; btn.textContent = 'Simpan Pendapatan'; return; }
        var kasbonT = parseInt(document.getElementById('pdKasbonTidak').value) || 0;
        if (kasbonT > 20000) { showToast('Kasbon tidak masuk max 20.000','error'); btn.disabled = false; btn.textContent = 'Simpan Pendapatan'; return; }
        data = {
          tanggal: tanggal, kode_cabang: cabangVal,
          id_karyawan: idKar, nama_karyawan: namaKar,
          status_masuk: 'tidak', unit: 0, tips: 0,
          bonus: 0, kasbon: kasbonT, wifi: 1000, tembus_target: 'tidak',
          alasan: alasan
        };
      }

      simpanData('Pendapatan_Harian', data).then(function(res){
        btn.disabled = false; btn.textContent = 'Simpan Pendapatan';
        if (res && res.ok) {
          var c = incrementCounterSimpan();
          if (c % 3 === 0) tampilkanIklan('interstitial');
          showToast('Pendapatan berhasil disimpan','success');
          cekBonusTembus(tanggal, cabangVal, unitVal, data);
          muatDaftarPendapatan(tanggal, cabangVal);
        } else {
          showToast(res.pesan || 'Gagal menyimpan','error');
        }
      });
    });

    muatDaftarPendapatan(todayStr(), cabang.length ? cabang[0].kode_cabang : '');
  });
}

function muatDaftarPendapatan(tanggal, cabang) {
  ambilData('Pendapatan_Harian').then(function(res){
    var listEl = document.getElementById('pdList');
    if (!listEl) return;
    var data = (res.ok ? res.data : []).filter(function(d){
      return d.tanggal === tanggal && d.kode_cabang === cabang;
    });
    if (data.length === 0) { listEl.innerHTML = '<div class="empty"><div class="ei">📭</div>Belum ada pendapatan</div>'; return; }
    var html = '<div class="table-wrap"><table><thead><tr>';
    html += '<th>Karyawan</th><th>Unit</th><th>Tips</th><th>Bonus</th><th>Kasbon</th><th>Status</th>';
    html += '</tr></thead><tbody>';
    data.forEach(function(d){
      var isBonus = parseInt(d.bonus) > 0;
      html += '<tr' + (isBonus ? ' style="background:#FFFBEB"' : '') + '>';
      html += '<td>' + esc(d.nama_karyawan) + '</td>';
      html += '<td>' + esc(d.unit) + '</td>';
      html += '<td>' + fmtRupiah(d.tips) + '</td>';
      html += '<td>' + fmtRupiah(d.bonus) + '</td>';
      html += '<td>' + fmtRupiah(d.kasbon) + '</td>';
      html += '<td>';
      if (String(d.tembus_target) === 'ya') html += '<span class="badge badge-gold">TEMBUS</span> ';
      html += '<span class="badge ' + (d.status_masuk === 'ya' ? 'badge-green' : 'badge-red') + '">' + (d.status_masuk === 'ya' ? 'Masuk' : 'Tidak') + '</span>';
      html += '</td></tr>';
    });
    html += '</tbody></table></div>';
    listEl.innerHTML = html;
  });
}

function cekBonusTembus(tanggal, cabang, unitBaru, dataBaru) {
  ambilData('Pendapatan_Harian').then(function(res){
    if (!res.ok) return;
    var hariIni = (res.data || []).filter(function(d){
      return d.tanggal === tanggal && d.kode_cabang === cabang && d.status_masuk === 'ya';
    });
    var totalUnit = 0;
    hariIni.forEach(function(d){ totalUnit += parseInt(d.unit) || 0; });
    if (dataBaru && dataBaru.status_masuk === 'ya') totalUnit += unitBaru;

    ambilData('Target_Cabang').then(function(res2){
      if (!res2.ok) return;
      var target = 0;
      (res2.data || []).forEach(function(t){
        if (t.kode_cabang === cabang) target = parseInt(t.target_harian) || 0;
      });
      if (totalUnit >= target && target > 0) {
        ambilData('Pengaturan').then(function(res3){
          var bonusKT = 10000, bonusKar = 5000;
          if (res3.ok) {
            (res3.data || []).forEach(function(p){
              if (p.key === 'bonus_kepala_toko') bonusKT = parseInt(p.value) || 10000;
              if (p.key === 'bonus_karyawan') bonusKar = parseInt(p.value) || 5000;
            });
          }
          hariIni.forEach(function(d){
            if (String(d.tembus_target) !== 'ya') {
              var b = (d.id_karyawan && d.id_karyawan.indexOf('1001') === 0) ? bonusKT : bonusKar;
              updateData('Pendapatan_Harian', d._row, { bonus: b, tembus_target: 'ya' });
            }
          });
          showToast('🎉 Target tembus! Bonus ke karyawan','success');
        });
      }
    });
  });
}

function renderRiwayatPendapatan(session) {
  var el = document.getElementById('appContent');
  var isFullAccess = isOwner() || isAdmin();
  var isKTRestricted = isKepalaToko();
  var isKarRestricted = isKaryawan();

  el.innerHTML = '<div class="page-title">📋 Unit Cabang</div>' +
    '<div class="page-sub">Total unit cabang per hari</div>' +
    '<div class="note-box warn">' +
    (isFullAccess
      ? '<b>Mode Full Access:</b> Anda dapat melihat semua data.'
      : '<b>Privasi Rekan Terjaga:</b> Anda hanya bisa melihat <b>total unit cabang</b> per hari. Untuk pendapatan pribadi → lihat <b>Payroll Saya</b>.') +
    '</div>' +
    '<div id="rpList"><div class="empty"><div class="ei">⏳</div>Memuat...</div></div>';

  ambilData('Pendapatan_Harian').then(function(res){
    var data = res.ok ? res.data : [];

    if (isKTRestricted || isKarRestricted) {
      data = data.filter(function(d){ return String(d.kode_cabang) === String(session.kode_cabang); });
      var perHari = {};
      data.forEach(function(d){
        var t = d.tanggal;
        if (!perHari[t]) perHari[t] = { tanggal: t, unit: 0, orangHadir: {} };
        perHari[t].unit += parseInt(d.unit) || 0;
        if (d.status_masuk === 'ya') perHari[t].orangHadir[d.id_karyawan] = true;
      });
      var hariArr = Object.keys(perHari).map(function(k){
        var h = perHari[k];
        h.totalOrang = Object.keys(h.orangHadir).length;
        return h;
      }).sort(function(a,b){ return b.tanggal.localeCompare(a.tanggal); });

      var listEl = document.getElementById('rpList');
      if (hariArr.length === 0) {
        listEl.innerHTML = '<div class="empty"><div class="ei">📭</div>Belum ada data</div>';
        return;
      }
      var html = '<div class="card" style="padding:12px">';
      html += '<h3>Total Unit Cabang ' + esc(session.kode_cabang) + '</h3>';
      html += '<div class="table-wrap"><table><thead><tr>';
      html += '<th>Tanggal</th><th>Total Unit</th><th>Nilai</th><th>Orang Hadir</th>';
      html += '</tr></thead><tbody>';
      hariArr.slice(0, 60).forEach(function(h){
        html += '<tr><td>' + esc(h.tanggal) + '</td><td><b>' + h.unit + '</b></td><td>' + fmtRupiah(h.unit * HARGA_PER_UNIT) + '</td><td>' + h.totalOrang + ' orang</td></tr>';
      });
      html += '</tbody></table></div></div>';
      html += '<div class="card"><h3>Butuh Riwayat Pribadi?</h3>';
      html += '<p style="font-size:12px;color:#6B7280;margin-bottom:10px;line-height:1.5">Untuk melihat pendapatan lengkap Anda, buka <b>Payroll Saya</b>.</p>';
      html += '<button class="btn btn-gold btn-block" id="rpKePayroll">💵 Buka Payroll Saya</button></div>';
      listEl.innerHTML = html;
      document.getElementById('rpKePayroll').addEventListener('click', function(){ navigasi('payroll'); });
      return;
    }

    data.sort(function(a,b){ return String(b.tanggal).localeCompare(String(a.tanggal)); });
    var listEl = document.getElementById('rpList');
    if (data.length === 0) { listEl.innerHTML = '<div class="empty"><div class="ei">📭</div>Belum ada riwayat</div>'; return; }
    var html = '<div class="table-wrap"><table><thead><tr>';
    html += '<th>Tanggal</th><th>Cabang</th><th>Karyawan</th><th>Unit</th><th>Nilai Unit</th><th>Tips</th><th>Bonus</th><th>Kasbon</th>';
    html += '</tr></thead><tbody>';
    data.slice(0, 100).forEach(function(d){
      html += '<tr><td>' + esc(d.tanggal) + '</td><td>' + esc(d.kode_cabang) + '</td><td>' + esc(d.nama_karyawan) + '</td><td>' + esc(d.unit) + '</td><td>' + fmtRupiah((parseInt(d.unit)||0) * HARGA_PER_UNIT) + '</td><td>' + fmtRupiah(d.tips) + '</td><td>' + fmtRupiah(d.bonus) + '</td><td>' + fmtRupiah(d.kasbon) + '</td></tr>';
    });
    html += '</tbody></table></div>';
    listEl.innerHTML = html;
  });
}

function renderKasbon(session) {

  html += '<div class="card"><h3>Ajukan Kasbon</h3>';
  html += '<div class="fgroup"><label>Jumlah Kasbon</label><input type="number" id="ksJumlah" value="0" min="0"></div>';

  html += '</div>';
  html += '<div class="card"><h3>Riwayat Kasbon Saya</h3><div id="ksList"><div class="empty">Memuat...</div></div></div>';

  ambilData('Pengajuan_Kasbon').then(function(res){
    var data = res.ok ? res.data : [];
    data = data.filter(function(d){ return String(d.id_karyawan) === String(session.user_id); });
    var listEl = document.getElementById('ksList');
    if (data.length === 0) { listEl.innerHTML = '<div class="empty"><div class="ei">📭</div>Belum ada kasbon</div>'; return; }
    var h = '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Tanggal</th><th>Jumlah</th><th>Status</th></tr></thead><tbody>';
    data.forEach(function(d){
      var st = String(d.status || '').toLowerCase();
      var bc = st === 'disetujui' || st === 'auto_disetujui' ? 'badge-green' : st === 'ditolak' ? 'badge-red' : 'badge-yellow';
      h += '<tr><td>' + esc(d.id_pengajuan) + '</td><td>' + esc(d.tanggal_pengajuan) + '</td><td>' + fmtRupiah(d.jumlah_kasbon) + '</td><td><span class="badge ' + bc + '">' + esc(d.status) + '</span></td></tr>';
    });
    h += '</tbody></table></div>';
    listEl.innerHTML = h;
  });

  document.getElementById('ksSubmit').addEventListener('click', function(){
    if (isDemo()) { showToast('Mode demo','warning'); return; }
    var jumlah = parseInt(document.getElementById('ksJumlah').value) || 0;
    if (jumlah <= 0) { showToast('Masukkan jumlah kasbon','error'); return; }
    tampilkanIklan('rewarded');
    var btn = this;
    btn.disabled = true; btn.textContent = 'Mengajukan...';
    var data = {
      id_pengajuan: 'KSB-' + Date.now(),
      tanggal_pengajuan: todayStr(),
      id_karyawan: session.user_id,
      nama_karyawan: session.user_nama,
      jumlah_kasbon: jumlah,
      status: jumlah <= 20000 ? 'auto_disetujui' : 'menunggu'
    };
    simpanData('Pengajuan_Kasbon', data).then(function(res){
      btn.disabled = false; btn.textContent = 'Ajukan Kasbon';
      if (res && res.ok) { showToast('Kasbon berhasil diajukan','success'); renderKasbon(session); }
      else showToast(res.pesan || 'Gagal','error');
    });
  });
}

/* ============================================================

function renderIzin(session) {
  var el = document.getElementById('appContent');
  var canAjukan = canAjukanIzin();
  var canAccKT = canAccIzinTahap1();
  var canAccFinal = canAccIzinTahap2();

  var html = '';
  html += '<div class="page-title">📅 Izin</div>';
  html += '<div class="page-sub">';
  if (canAjukan) html += 'Ajukan & lihat status izin';
  else html += 'ACC izin anggota';
  html += '</div>';

  if (canAjukan) {
    html += '<div class="card"><h3>Ajukan Izin</h3>';
    html += '<div class="fgroup"><label>Tanggal Izin</label><input type="date" id="izTanggal" value="' + todayStr() + '"></div>';

    html += '<button class="btn btn-primary" id="izSubmit">Ajukan Izin</button>';
    html += '<p style="font-size:11px;color:#9CA3AF;margin-top:8px">*Rewarded ad akan ditampilkan</p>';
    html += '</div>';
  }

  if (canAccKT || canAccFinal) {
    html += '<div class="note-box">';
    html += '<b>Tahapan ACC Izin:</b><br>';
    html += '1️⃣ Kepala Toko ACC → <span class="badge badge-blue">disetujui_kt</span><br>';
    html += '2️⃣ Admin / Owner ACC final → <span class="badge badge-green">disetujui</span>';
    html += '</div>';
  }

  html += '<div class="card"><h3>Daftar Izin</h3><div id="izList"><div class="empty">Memuat...</div></div></div>';
  el.innerHTML = html;

  ambilData('Izin_Istirahat').then(function(res){
    var data = res.ok ? res.data : [];

    if (isKaryawan()) {
      data = data.filter(function(d){ return String(d.id_karyawan) === String(session.user_id); });
    } else if (isKepalaToko()) {
      data = data.filter(function(d){
        return String(d.kode_cabang) === String(session.kode_cabang) ||
               String(d.id_karyawan) === String(session.user_id);
      });
    }
    // Owner & Admin lihat semua

    var listEl = document.getElementById('izList');
    if (data.length === 0) { listEl.innerHTML = '<div class="empty"><div class="ei">📭</div>Belum ada izin</div>'; return; }

    var h = '';
    data.sort(function(a,b){ return String(b.tanggal_izin).localeCompare(String(a.tanggal_izin)); });
    data.forEach(function(d){
      var st = String(d.status || 'menunggu').toLowerCase();
      var bc = 'badge-yellow';
      if (st === 'disetujui') bc = 'badge-green';
      else if (st === 'disetujui_kt') bc = 'badge-blue';
      else if (st === 'ditolak') bc = 'badge-red';

      h += '<div style="border:1px solid #E5E7EB;border-radius:10px;padding:12px;margin-bottom:10px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">';
      h += '<div style="flex:1;min-width:160px">';
      h += '<div style="font-size:13px;font-weight:700;color:#1F2937">' + esc(d.nama_karyawan || d.id_karyawan) + '</div>';
      h += '<div style="font-size:11px;color:#6B7280;margin-top:2px">' + esc(d.jenis_izin) + ' • ' + esc(d.tanggal_izin) + '</div>';
      if (d.kode_cabang) h += '<div style="font-size:11px;color:#6B7280">Cabang: ' + esc(d.kode_cabang) + '</div>';
      if (d.keterangan) h += '<div style="font-size:11px;color:#374151;margin-top:4px;font-style:italic">"' + esc(d.keterangan) + '"</div>';
      h += '</div>';
      h += '<span class="badge ' + bc + '">' + esc(d.status || 'menunggu') + '</span>';
      h += '</div>';

      var showAccKT = canAccKT && st === 'menunggu';
      var showAccFinal = canAccFinal && st === 'disetujui_kt';
      if (showAccKT || showAccFinal) {
        h += '<div class="btn-row" style="margin-top:10px">';
        if (showAccKT) h += '<button class="btn btn-sm btn-gold" data-acc="' + d._row + '" data-tahap="kt">✅ ACC Kepala Toko</button>';
        if (showAccFinal) h += '<button class="btn btn-sm btn-primary" data-acc="' + d._row + '" data-tahap="final" style="width:auto">✅ ACC Final</button>';
        h += '<button class="btn btn-sm btn-danger" data-rej="' + d._row + '">❌ Tolak</button>';
        h += '</div>';
      }
      h += '</div>';
    });
    listEl.innerHTML = h;

    listEl.querySelectorAll('[data-acc]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (isDemo()) { showToast('Mode demo','warning'); return; }
        var row = parseInt(this.getAttribute('data-acc'));
        var tahap = this.getAttribute('data-tahap');
        var newStatus = tahap === 'kt' ? 'disetujui_kt' : 'disetujui';
        updateData('Izin_Istirahat', row, { status: newStatus, acc_by: session.user_nama, acc_time: nowISO() }).then(function(r){

  el.innerHTML = html;

  ambilData('Kerusakan_Kendala').then(function(res){

    if (isKaryawan()) {
      data = data.filter(function(d){ return String(d.pelapor) === String(session.user_id); });

    listEl.querySelectorAll('[data-rej-rk]').forEach(function(btn){

        if (isDemo()) { showToast('Mode demo','warning'); return; }
        if (!confirm('Tolak laporan ini?')) return;
        var row = parseInt(this.getAttribute('data-rej-rk'));

          else showToast(r.pesan || 'Gagal','error');
        });
      });

      tampilkanIklan('rewarded');
      var data = {
        id_laporan: 'RK-' + Date.now(),
        tanggal: todayStr(),
        kode_cabang: session.kode_cabang,
        pelapor: session.user_id,
        nama_pelapor: session.user_nama,
        jenis: document.getElementById('rkJenis').value,
        judul: judul,
        deskripsi: document.getElementById('rkDesk').value || '-',

        btn.disabled = false; btn.textContent = 'Laporkan';
        if (res && res.ok) { showToast('Laporan dikirim','success'); renderKerusakan(session); }
        else showToast(res.pesan || 'Gagal','error');
      });
    });
  }
}

function muatPayrollOwner() {
  ambilData('Payroll').then(function(res){
    var listEl = document.getElementById('pyoList');
    if (!listEl) return;
    var data = res.ok ? res.data : [];

    var q = (document.getElementById('pyoSearch').value || '').toLowerCase();
    var fs = document.getElementById('pyoFilterStatus').value;

    data = data.filter(function(d){
      if (q && String(d.nama_karyawan || '').toLowerCase().indexOf(q) === -1 && String(d.id_karyawan).indexOf(q) === -1) return false;
      if (fs && d.status !== fs) return false;
      return true;
    });
    data.sort(function(a,b){ return String(b.periode).localeCompare(String(a.periode)); });

    if (data.length === 0) {
      listEl.innerHTML = '<div class="empty"><div class="ei">📭</div>Belum ada data payroll</div>';
      return;
    }

    var totalSemua = 0;
    data.forEach(function(d){ totalSemua += parseInt(d.total_payroll) || 0; });

    var h = '<div style="background:#FEF3C7;border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">';
    h += '<span style="font-size:12px;font-weight:600;color:#92400E">TOTAL SEMUA PAYROLL</span>';
    h += '<span style="font-size:16px;font-weight:800;color:#B45309">' + fmtRupiah(totalSemua) + '</span></div>';
    h += '<div class="table-wrap"><table><thead><tr>';
    h += '<th>Periode</th><th>ID</th><th>Nama</th><th>Total</th><th>Status</th><th>Aksi</th>';
    h += '</tr></thead><tbody>';
    data.forEach(function(d){
      h += '<tr>';
      h += '<td>' + esc(d.periode) + '</td>';
      h += '<td>' + esc(d.id_karyawan) + '</td>';
      h += '<td>' + esc(d.nama_karyawan) + '</td>';
      h += '<td><b>' + fmtRupiah(d.total_payroll) + '</b></td>';
      h += '<td><span class="badge ' + (d.status === 'dibayar' ? 'badge-green' : 'badge-yellow') + '">' + esc(d.status) + '</span></td>';
      h += '<td style="white-space:nowrap">';
      h += '<button class="btn btn-sm btn-outline" data-pedit="' + d._row + '">✏️</button> ';
      h += '<button class="btn btn-sm btn-danger" data-pdel="' + d._row + '">🗑️</button>';
      h += '</td></tr>';
    });
    h += '</tbody></table></div>';
    listEl.innerHTML = h;

    listEl.querySelectorAll('[data-pedit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (isDemo()) { showToast('Mode demo','warning'); return; }
        var row = parseInt(this.getAttribute('data-pedit'));
        var item = data.find(function(d){ return d._row === row; });
        if (item) bukaFormPayroll(item);
      });
    });
    listEl.querySelectorAll('[data-pdel]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (isDemo()) { showToast('Mode demo','warning'); return; }
        if (!confirm('Yakin hapus data payroll ini?')) return;
        var row = parseInt(this.getAttribute('data-pdel'));
        hapusData('Payroll', row).then(function(r){
          if (r && r.ok) { showToast('Payroll dihapus','success'); muatPayrollOwner(); }
          else showToast(r.pesan || 'Gagal','error');
        });
      });
    });
  });
}

function bukaFormPayroll(item) {
  var isEdit = !!item;
  var ov = document.createElement('div');
  ov.className = 'modal-overlay show';

  var h = '<div class="modal">';
  h += '<div class="modal-head"><h3>' + (isEdit ? 'Edit' : 'Tambah') + ' Payroll</h3><button class="modal-close" id="pyoClose">✕</button></div>';
  h += '<div class="note-box owner"><b>Akses Owner:</b> Perubahan langsung tersimpan.</div>';
  h += '<div class="fgroup"><label>Periode</label><input type="text" id="pyoPeriode" value="' + (item ? esc(item.periode) : todayStr().slice(0,7) + '-P1') + '"></div>';

  document.getElementById('pyoSimpan').addEventListener('click', function(){

      simpanData('Payroll', data).then(function(r){

function renderPengeluaran(session) {

    html += '<select id="pgCabang">';
    html += '<option value="">-- Pilih Cabang --</option>';
    cabang.forEach(function(c){
      html += '<option value="' + esc(c.kode_cabang) + '">' + esc(c.nama_cabang || c.kode_cabang) + ' (' + esc(c.kode_cabang) + ')</option>';
    });
    html += '</select></div>';
    html += '<div class="fgroup"><label>Kategori</label><select id="pgKategori">';
    html += '<option value="operasional">Operasional</option>';
    html += '<option value="gaji">Gaji</option>';
    html += '<option value="sewa">Sewa</option>';
    html += '<option value="listrik">Listrik / Air</option>';
    html += '<option value="lain">Lainnya</option>';
    html += '</select></div>';
    html += '<div class="fgroup"><label>Jumlah (Rp)</label><input type="number" id="pgJumlah" value="0" min="0"></div>';
    html += '<div class="fgroup"><label>Keterangan</label><input type="text" id="pgKet" placeholder="Keterangan pengeluaran"></div>';
    html += '<button class="btn btn-primary" id="pgSubmit">Simpan Pengeluaran</button></div>';

    html += '<div class="card"><h3>Riwayat Pengeluaran</h3>';
    html += '<div class="search-bar">';
    html += '<select id="pgFilterCabang"><option value="">Semua Cabang</option>';
    cabang.forEach(function(c){
      html += '<option value="' + esc(c.kode_cabang) + '">' + esc(c.nama_cabang || c.kode_cabang) + '</option>';
    });
    html += '</select>';
    html += '<input type="month" id="pgFilterBulan" value="' + todayStr().slice(0,7) + '">';
    html += '</div>';
    html += '<div id="pgList"><div class="empty">Memuat...</div></div></div>';

    document.getElementById('pgBody').innerHTML = html;

    muatRiwayatPengeluaran(pengeluaran, cabang);

    document.getElementById('pgFilterCabang').addEventListener('change', function(){ muatRiwayatPengeluaran(pengeluaran, cabang); });
    document.getElementById('pgFilterBulan').addEventListener('change', function(){ muatRiwayatPengeluaran(pengeluaran, cabang); });

    document.getElementById('pgSubmit').addEventListener('click', function(){
      if (isDemo()) { showToast('Mode demo','warning'); return; }
      var cabangVal = document.getElementById('pgCabang').value;
      var jumlah = parseInt(document.getElementById('pgJumlah').value) || 0;
      if (!cabangVal) { showToast('Pilih cabang terlebih dahulu','error'); return; }
      if (jumlah <= 0) { showToast('Jumlah harus lebih dari 0','error'); return; }
      var btn = this;
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      var data = {
        tanggal: document.getElementById('pgTanggal').value,
        kode_cabang: cabangVal,
        kategori: document.getElementById('pgKategori').value,
        jumlah: jumlah,
        keterangan: document.getElementById('pgKet').value || '-',
        dicatat_oleh: session.user_nama
      };
      simpanData('Pengeluaran', data).then(function(res){
        btn.disabled = false; btn.textContent = 'Simpan Pengeluaran';
        if (res && res.ok) {
          showToast('Pengeluaran disimpan','success');
          document.getElementById('pgJumlah').value = 0;
          document.getElementById('pgKet').value = '';
          ambilData('Pengeluaran').then(function(r2){
            muatRiwayatPengeluaran(r2.ok ? r2.data : [], cabang);
          });
        } else showToast(res.pesan || 'Gagal','error');
      });
    });
  });
}

function muatRiwayatPengeluaran(data, cabang) {
  var listEl = document.getElementById('pgList');
  if (!listEl) return;
  var fCab = document.getElementById('pgFilterCabang') ? document.getElementById('pgFilterCabang').value : '';
  var fBulan = document.getElementById('pgFilterBulan') ? document.getElementById('pgFilterBulan').value : '';
  var filtered = data.filter(function(d){
    if (fCab && d.kode_cabang !== fCab) return false;
    if (fBulan && String(d.tanggal).slice(0,7) !== fBulan) return false;
    return true;
  });
  filtered.sort(function(a,b){ return String(b.tanggal).localeCompare(String(a.tanggal)); });
  if (filtered.length === 0) { listEl.innerHTML = '<div class="empty"><div class="ei">📭</div>Belum ada pengeluaran</div>'; return; }
  var total = 0;
  filtered.forEach(function(d){ total += parseInt(d.jumlah) || 0; });
  var h = '<div style="background:#FEF2F2;border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">';
  h += '<span style="font-size:12px;font-weight:600;color:#991B1B">TOTAL (dipotong dari owner)</span>';
  h += '<span style="font-size:16px;font-weight:800;color:#DC2626">' + fmtRupiah(total) + '</span></div>';
  h += '<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Cabang</th><th>Kategori</th><th>Jumlah</th><th>Keterangan</th></tr></thead><tbody>';
  filtered.slice(0, 100).forEach(function(d){
    h += '<tr><td>' + esc(d.tanggal) + '</td><td><span class="badge badge-blue">' + esc(d.kode_cabang) + '</span></td><td>' + esc(d.kategori) + '</td><td style="color:#DC2626;font-weight:700">' + fmtRupiah(d.jumlah) + '</td><td>' + esc(d.keterangan) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  listEl.innerHTML = h;
}

function muatManusia() {
  ambilData('Users').then(function(res){
    var listEl = document.getElementById('mhList');
    if (!listEl) return;
    var data = res.ok ? res.data : [];
    var cabSet = {};
    data.forEach(function(d){ if (d.kode_cabang) cabSet[d.kode_cabang] = true; });
    var cabSel = document.getElementById('mhFilterCabang');
    if (cabSel && cabSel.options.length <= 1) {
      Object.keys(cabSet).forEach(function(c){
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        cabSel.appendChild(opt);
      });
    }

    var q = (document.getElementById('mhSearch').value || '').toLowerCase();
    var fj = document.getElementById('mhFilterJabatan').value;
    var fc = document.getElementById('mhFilterCabang').value;

    data = data.filter(function(d){
      if (String(d.dihapus).toLowerCase() === 'true') return false;
      if (q && String(d.nama).toLowerCase().indexOf(q) === -1 && String(d.id).indexOf(q) === -1) return false;
      if (fj && d.jabatan !== fj) return false;
      if (fc && d.kode_cabang !== fc) return false;
      return true;
    });

    if (data.length === 0) { listEl.innerHTML = '<div class="empty"><div class="ei">👤</div>Tidak ada anggota</div>'; return; }

    var h = '<div class="table-wrap"><table><thead><tr>';
    h += '<th>ID</th><th>Nama</th><th>Jabatan</th><th>Cabang</th><th>Password</th><th>Status</th><th>Aksi</th>';
    h += '</tr></thead><tbody>';
    data.forEach(function(d){
      var stCls = String(d.status).toLowerCase() === 'aktif' ? 'badge-green' : 'badge-gray';
      var pass = d.password || '-';
      h += '<tr>';
      h += '<td><b>' + esc(d.id) + '</b></td>';
      h += '<td>' + esc(d.nama) + '</td>';
      h += '<td>' + esc(d.jabatan) + '</td>';
      h += '<td>' + esc(d.kode_cabang) + '</td>';
      h += '<td><div class="pass-cell">';
      h += '<span class="pass-mask" data-pid="' + d._row + '">••••••</span>';
      h += '<span class="pass-show" data-pid="' + d._row + '" style="display:none">' + esc(pass) + '</span>';
      h += '<button class="eye-btn" data-toggle="' + d._row + '">👁</button>';
      h += '</div></td>';
      h += '<td><span class="badge ' + stCls + '">' + esc(d.status) + '</span></td>';
      h += '<td style="white-space:nowrap">';
      h += '<button class="btn btn-sm btn-outline" data-edit="' + d._row + '" title="Edit">✏️</button> ';
      h += '<button class="btn btn-sm btn-outline" data-id="' + d._row + '" title="Ubah ID">🆔</button> ';
      h += '<button class="btn btn-sm btn-outline" data-pass="' + d._row + '" title="Reset Password">🔑</button> ';
      h += '<button class="btn btn-sm btn-danger" data-del="' + d._row + '" title="Hapus">🗑️</button>';
      h += '</td></tr>';
    });
    h += '</tbody></table></div>';
    listEl.innerHTML = h;

    // Toggle password
    listEl.querySelectorAll('[data-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = this.getAttribute('data-toggle');
        var mask = listEl.querySelector('.pass-mask[data-pid="' + id + '"]');
        var show = listEl.querySelector('.pass-show[data-pid="' + id + '"]');
        if (!mask || !show) return;
        if (show.style.display === 'none') {
          show.style.display = 'inline-block';
          mask.style.display = 'none';
          this.textContent = '🙈';
        } else {
          show.style.display = 'none';
          mask.style.display = 'inline';
          this.textContent = '👁';
        }
      });
    });

    listEl.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (isDemo()) { showToast('Mode demo','warning'); return; }
        var row = parseInt(this.getAttribute('data-edit'));
        var item = data.find(function(d){ return d._row === row; });
        if (item) bukaFormAnggota(item);
      });
    });
    listEl.querySelectorAll('[data-id]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (isDemo()) { showToast('Mode demo','warning'); return; }
        var row = parseInt(this.getAttribute('data-id'));
        var item = data.find(function(d){ return d._row === row; });
        if (item) bukaFormUbahId(item);
      });
    });
    listEl.querySelectorAll('[data-pass]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (isDemo()) { showToast('Mode demo','warning'); return; }
        var row = parseInt(this.getAttribute('data-pass'));
        var item = data.find(function(d){ return d._row === row; });
        bukaFormPassword(row, item);
      });
    });
    listEl.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (isDemo()) { showToast('Mode demo','warning'); return; }
        var row = parseInt(this.getAttribute('data-del'));
        if (confirm('Yakin hapus anggota ini? (soft delete)')) {
          var alasan = prompt('Alasan hapus:');
          if (!alasan) { showToast('Alasan wajib diisi','error'); return; }
          updateData('Users', row, { dihapus: true, alasan_hapus: alasan }).then(function(res){
            if (res && res.ok) { showToast('Anggota dihapus','success'); muatManusia(); }
            else showToast(res.pesan || 'Gagal','error');
          });
        }
      });
    });
  });
}

function bukaFormAnggota(item) {
  var isEdit = !!item;
  var ov = document.createElement('div');
  ov.className = 'modal-overlay show';
  var h = '<div class="modal">';
  h += '<div class="modal-head"><h3>' + (isEdit ? 'Edit' : 'Tambah') + ' Anggota</h3><button class="modal-close" id="maClose">✕</button></div>';
  h += '<div class="fgroup"><label>ID</label><input type="text" id="maId" value="' + (item ? esc(item.id) : '') + '" ' + (isEdit ? 'readonly style="background:#F3F4F6"' : '') + '>';
  if (isEdit) h += '<p style="font-size:10px;color:#9CA3AF;margin-top:4px">ID tidak bisa diubah di sini — gunakan tombol 🆔</p>';
  h += '</div>';
  if (!isEdit) h += '<div class="fgroup"><label>Password (default 123456)</label><input type="text" id="maPass" value="123456"></div>';
  if (isEdit) h += '<div class="fgroup"><label>Password Saat Ini</label><input type="text" value="' + esc(item.password || '-') + '" readonly style="background:#F0FDF4;font-family:Courier New;font-weight:700;color:#059669"></div>';
  h += '<div class="fgroup"><label>Nama</label><input type="text" id="maNama" value="' + (item ? esc(item.nama) : '') + '"></div>';
  h += '<div class="fgroup"><label>Jabatan</label><select id="maJabatan"><option ' + (item && item.jabatan === 'Owner' ? 'selected' : '') + '>Owner</option><option ' + (item && item.jabatan === 'Admin' ? 'selected' : '') + '>Admin</option><option ' + (item && item.jabatan === 'Kepala Toko' ? 'selected' : '') + '>Kepala Toko</option><option ' + (!item || item.jabatan === 'Karyawan' ? 'selected' : '') + '>Karyawan</option></select></div>';
  h += '<div class="fgroup"><label>Kode Cabang</label><input type="text" id="maCabang" value="' + (item ? esc(item.kode_cabang) : '-') + '"></div>';
  h += '<div class="fgroup"><label>Status</label><select id="maStatus"><option ' + (item && item.status === 'aktif' ? 'selected' : '') + '>aktif</option><option ' + (item && item.status === 'nonaktif' ? 'selected' : '') + '>nonaktif</option></select></div>';
  h += '<button class="btn btn-primary" id="maSimpan">Simpan</button></div>';
  ov.innerHTML = h;
  document.body.appendChild(ov);

  document.getElementById('maClose').addEventListener('click', function(){ ov.remove(); });
  ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });

  document.getElementById('maSimpan').addEventListener('click', function(){
    var id = document.getElementById('maId').value.trim();
    var nama = document.getElementById('maNama').value.trim();
    if (!id || !nama) { showToast('ID dan Nama wajib','error'); return; }

    var data = {
      nama: nama,
      jabatan: document.getElementById('maJabatan').value,
      kode_cabang: document.getElementById('maCabang').value || '-',
      status: document.getElementById('maStatus').value
    };
    if (!isEdit) {
      var pass = document.getElementById('maPass').value;
      if (pass.length < 6) { showToast('Password min 6 karakter','error'); return; }
      data.id = id;
      data.password = pass;
      data.dihapus = false;
      data.tanggal_masuk = todayStr();
    }

    if (isEdit) {
      updateData('Users', item._row, data).then(function(res){
        if (res && res.ok) { showToast('Data diperbarui','success'); ov.remove(); muatManusia(); }
        else showToast(res.pesan || 'Gagal','error');
      });
    } else {
      ambilData('Users').then(function(res){
        var exists = (res.data || []).some(function(u){ return String(u.id) === String(id); });
        if (exists) { showToast('ID sudah digunakan','error'); return; }
        simpanData('Users', data).then(function(r){
          if (r && r.ok) { showToast('Anggota ditambahkan','success'); ov.remove(); muatManusia(); }
          else showToast(r.pesan || 'Gagal','error');
        });
      });
    }
  });
}

function bukaFormUbahId(item) {
  var ov = document.createElement('div');
  ov.className = 'modal-overlay show';
  ov.innerHTML = '<div class="modal">' +
    '<div class="modal-head"><h3>Ubah ID</h3><button class="modal-close" id="miClose">✕</button></div>' +
    '<div class="note-box warn"><b>Perhatian:</b> Mengubah ID dapat memutus sesi login user tersebut.</div>' +
    '<div class="fgroup"><label>ID Lama</label><input type="text" value="' + esc(item.id) + '" disabled></div>' +
    '<div class="fgroup"><label>ID Baru</label><input type="text" id="miNewId" placeholder="ID baru unik"></div>' +
    '<button class="btn btn-primary" id="miSimpan">Simpan ID Baru</button></div>';
  document.body.appendChild(ov);

  document.getElementById('miClose').addEventListener('click', function(){ ov.remove(); });
  ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });

  document.getElementById('miSimpan').addEventListener('click', function(){
    var newId = document.getElementById('miNewId').value.trim();
    if (!newId) { showToast('ID baru wajib diisi','error'); return; }
    ambilData('Users').then(function(res){
      var exists = (res.data || []).some(function(u){ return String(u.id) === String(newId); });
      if (exists) { showToast('ID sudah digunakan','error'); return; }
      updateData('Users', item._row, { id: newId, id_lama: item.id }).then(function(r){
        if (r && r.ok) { showToast('ID diubah','success'); ov.remove(); muatManusia(); }
        else showToast(r.pesan || 'Gagal','error');
      });
    });
  });
}

function bukaFormPassword(row, item) {
  var ov = document.createElement('div');
  ov.className = 'modal-overlay show';
  ov.innerHTML = '<div class="modal">' +
    '<div class="modal-head"><h3>Reset Password</h3><button class="modal-close" id="mpClose">✕</button></div>' +
    '<div class="fgroup"><label>Password Lama</label><input type="text" value="' + esc(item && item.password || '-') + '" readonly style="background:#F3F4F6;font-family:Courier New"></div>' +
    '<div class="note-box warn"><b>Perhatian:</b> Password lama langsung tidak valid setelah disimpan.</div>' +
    '<div class="fgroup"><label>Password Baru (min 6)</label><input type="text" id="mpPass1"></div>' +
    '<div class="fgroup"><label>Konfirmasi Password</label><input type="text" id="mpPass2"></div>' +
    '<button class="btn btn-primary" id="mpSimpan">Simpan Password Baru</button></div>';
  document.body.appendChild(ov);

  document.getElementById('mpClose').addEventListener('click', function(){ ov.remove(); });
  ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });
  document.getElementById('mpSimpan').addEventListener('click', function(){
    var p1 = document.getElementById('mpPass1').value;
    var p2 = document.getElementById('mpPass2').value;
    if (p1.length < 6) { showToast('Password min 6 karakter','error'); return; }
    if (p1 !== p2) { showToast('Password tidak sama','error'); return; }
    updateData('Users', row, { password: p1 }).then(function(res){
      if (res && res.ok) { showToast('Password direset','success'); ov.remove(); muatManusia(); }
      else showToast(res.pesan || 'Gagal','error');
    });
  });
}

/* ============================================================
   HALAMAN: PENGATURAN (Owner)
============================================================ */
function renderPengaturan(session) {
  if (!isOwner()) { showToast('Hanya Owner','error'); navigasi('home'); return; }
  var el = document.getElementById('appContent');
  var html = '';
  html += '<div class="page-title">⚙️ Pengaturan</div>';
  html += '<div class="page-sub">Bonus, WiFi, dan target cabang</div>';
  html += '<div class="card"><h3>Pengaturan Global</h3><div id="stGlobal"><div class="empty">Memuat...</div></div></div>';
  el.innerHTML = html;

  ambilData('Pengaturan').then(function(res){
    var data = res.ok ? res.data : [];
    var globalEl = document.getElementById('stGlobal');
    if (data.length === 0) { globalEl.innerHTML = '<div class="empty">Belum ada pengaturan</div>'; return; }
    var h = '';
    data.forEach(function(d){
      h += '<div class="fgroup"><label>' + esc(d.key).replace(/_/g,' ').toUpperCase() + '</label>';
      h += '<input type="number" value="' + esc(d.value) + '" data-key="' + esc(d.key) + '" data-row="' + d._row + '"></div>';
    });
    h += '<button class="btn btn-primary" id="stSimpan">Simpan Pengaturan</button>';
    globalEl.innerHTML = h;

    document.getElementById('stSimpan').addEventListener('click', function(){
      if (isDemo()) { showToast('Mode demo','warning'); return; }
      var inputs = globalEl.querySelectorAll('input[data-key]');
      var promises = [];
      inputs.forEach(function(inp){
        promises.push(updateData('Pengaturan', parseInt(inp.getAttribute('data-row')), {
          key: inp.getAttribute('data-key'), value: inp.value
        }));
      });
      Promise.all(promises).then(function(){ showToast('Pengaturan disimpan','success'); });
    });
  });
}

/* ============================================================
   HALAMAN: TARGET CABANG (OWNER)
============================================================ */
function renderTarget(session) {
  if (!canAturTarget()) {
    showToast('Hanya Owner yang bisa atur target','error');
    navigasi('home'); return;
  }
  var el = document.getElementById('appContent');
  var html = '';
  html += '<div class="page-title">🎯 Target Cabang</div>';
  html += '<div class="page-sub">Atur target harian per cabang (unit) — khusus Owner</div>';
  html += '<div class="card"><div id="tgList"><div class="empty">Memuat...</div></div></div>';
  el.innerHTML = html;

  ambilData('Target_Cabang').then(function(res){
    var data = res.ok ? res.data : [];
    var listEl = document.getElementById('tgList');
    if (data.length === 0) { listEl.innerHTML = '<div class="empty">Belum ada target</div>'; return; }
    var h = '';
    data.forEach(function(d){
      h += '<div class="fgroup"><label>' + esc(d.nama_cabang || d.kode_cabang) + '</label>';
      h += '<input type="number" value="' + esc(d.target_harian) + '" data-kode="' + esc(d.kode_cabang) + '" data-row="' + d._row + '"></div>';
    });
    h += '<button class="btn btn-primary" id="tgSimpan">Simpan Target</button>';
    listEl.innerHTML = h;

    document.getElementById('tgSimpan').addEventListener('click', function(){
      if (isDemo()) { showToast('Mode demo','warning'); return; }
      var inputs = listEl.querySelectorAll('input[data-kode]');
      var promises = [];
      inputs.forEach(function(inp){
        promises.push(updateData('Target_Cabang', parseInt(inp.getAttribute('data-row')), {
          kode_cabang: inp.getAttribute('data-kode'),
          target_harian: parseInt(inp.value) || 0
        }));
      });
      Promise.all(promises).then(function(){ showToast('Target disimpan','success'); });
    });
  });
}

  html += '<div class="info-row"><span class="lbl">Cabang</span><span class="val">' + esc(session.kode_cabang) + '</span></div>';
  html += '<div class="info-row"><span class="lbl">Mode</span><span class="val">' + (session.is_demo ? 'Demo' : 'Aktif') + '</span></div>';

  }

  html += '<button class="btn btn-outline btn-block" id="prLogout">🚪 Keluar</button>';
  el.innerHTML = html;
  document.getElementById('prLogout').addEventListener('click', logout);
}

  renderDashboard(session);
  window.addEventListener('resize', function(){

    if (s) renderBottomNav(s, currentPage);

});
