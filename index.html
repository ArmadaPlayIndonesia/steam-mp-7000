<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEAM MP 7000 — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    background:linear-gradient(160deg,#C8102E 0%,#e05a6e 45%,#ffffff 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; color:#1F2937;
  }
  .brand-circle {
    width:88px; height:88px; border-radius:50%;
    background:linear-gradient(135deg,#FBBF24,#F59E0B);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:30px; color:#C8102E;
    box-shadow:0 8px 24px rgba(0,0,0,.25), inset 0 -3px 8px rgba(0,0,0,.15);
    margin:0 auto 16px; letter-spacing:-1px;
  }
  .card {
    width:100%; max-width:400px;
    background:#fff; border-radius:20px;
    padding:32px 26px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,.22);
    position:relative; z-index:2;
  }
  h1 { text-align:center; color:#C8102E; font-size:23px; font-weight:800; letter-spacing:-.5px; }
  .tagline {
    text-align:center; font-size:11px; color:#6B7280;
    margin-top:6px; margin-bottom:24px; font-weight:500; line-height:1.5;
    padding:0 4px;
  }
  .tagline b { color:#F59E0B; }
  label { display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:6px; }
  .field { margin-bottom:16px; }
  .input-wrap { position:relative; }
  input[type=text], input[type=password] {
    width:100%; padding:13px 44px 13px 14px;
    border:1.5px solid #E5E7EB; border-radius:10px;
    font-family:inherit; font-size:14px; color:#1F2937;
    background:#F9FAFB; transition:.18s; outline:none;
  }
  input:focus { border-color:#C8102E; background:#fff; box-shadow:0 0 0 3px rgba(200,16,46,.1); }
  .toggle-eye {
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; font-size:18px; cursor:pointer;
    padding:8px; line-height:1; border-radius:8px;
  }
  .toggle-eye:active { background:#F3F4F6; }
  .btn {
    width:100%; padding:14px; border-radius:10px;
    font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer; transition:.18s; border:none;
    letter-spacing:.3px;
  }
  .btn-primary { background:#C8102E; color:#fff; box-shadow:0 4px 12px rgba(200,16,46,.3); }
  .btn-primary:hover:not(:disabled) { background:#A00D25; }
  .btn-primary:disabled { opacity:.65; cursor:not-allowed; }
  .btn-outline {
    background:#fff; color:#C8102E;
    border:2px solid #F59E0B; margin-top:10px;
  }
  .btn-outline:hover { background:#FFFBEB; }
  .alert {
    display:none; padding:11px 14px; border-radius:10px;
    font-size:12.5px; font-weight:500; margin-bottom:16px;
    background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA;
  }
  .alert.show { display:block; }
  .footer {
    margin-top:22px; text-align:center; font-size:11px;
    color:#ffffff; font-weight:500; text-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  /* MODAL */
  .overlay {
    display:none; position:fixed; inset:0; z-index:50;
    background:rgba(17,24,39,.62); backdrop-filter:blur(3px);
    align-items:center; justify-content:center; padding:20px;
  }
  .overlay.show { display:flex; }
  .modal {
    width:100%; max-width:360px; background:#fff;
    border-radius:18px; padding:24px 22px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:pop .2s ease-out;
  }
  @keyframes pop { from{transform:scale(.92);opacity:0} to{transform:scale(1);opacity:1} }
  .modal h2 { font-size:17px; color:#1F2937; margin-bottom:4px; }
  .modal p { font-size:12px; color:#6B7280; margin-bottom:18px; }
  .role-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .role-btn {
    padding:16px 8px; border-radius:12px; border:1.5px solid #E5E7EB;
    background:#F9FAFB; cursor:pointer; font-family:inherit;
    font-size:12.5px; font-weight:700; color:#374151;
    transition:.16s; display:flex; flex-direction:column;
    align-items:center; gap:6px;
  }
  .role-btn span.ic { font-size:22px; }
  .role-btn:hover { border-color:#F59E0B; background:#FFFBEB; color:#C8102E; }
  .modal-close {
    width:100%; margin-top:14px; padding:11px;
    background:#F3F4F6; border:none; border-radius:10px;
    font-family:inherit; font-size:13px; font-weight:600;
    color:#4B5563; cursor:pointer;
  }
  .modal-close:hover { background:#E5E7EB; }
  @media(max-width:400px){ .card{padding:26px 18px 20px} h1{font-size:20px} }
</style>
</head>
<body>

  <div class="brand-circle">MP</div>

  <div class="card">
    <h1>STEAM MP 7000</h1>
    <p class="tagline">Jujur Disiplin Tanggung Jawab <b>HARGA MATI !</b></p>

    <div id="alertBox" class="alert"></div>

    <div class="field">
      <label for="inpId">ID Pengguna</label>
      <div class="input-wrap">
        <input type="text" id="inpId" placeholder="Masukkan ID" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label for="inpPass">Password</label>
      <div class="input-wrap">
        <input type="password" id="inpPass" placeholder="Masukkan password" autocomplete="current-password">
        <button type="button" class="toggle-eye" id="btnEye">👁</button>
      </div>
    </div>

    <button class="btn btn-primary" id="btnMasuk">MASUK</button>
    <button class="btn btn-outline" id="btnDemo">COBA DEMO</button>

    <div class="footer">Steam MP Manajemen</div>
  </div>

  <!-- MODAL DEMO -->
  <div class="overlay" id="demoOverlay">
    <div class="modal">
      <h2>Pilih Role Demo</h2>
      <p>Mode demo hanya untuk melihat fitur (read-only).</p>
      <div class="role-grid">
        <button class="role-btn" data-role="owner"><span class="ic">👑</span>Owner</button>
        <button class="role-btn" data-role="admin"><span class="ic">🛠️</span>Admin</button>
        <button class="role-btn" data-role="kepala_toko"><span class="ic">🏪</span>Kepala Toko</button>
        <button class="role-btn" data-role="karyawan"><span class="ic">👷</span>Karyawan</button>
      </div>
      <button class="modal-close" id="btnCloseDemo">Batal</button>
    </div>
  </div>

<script>
(function(){
  'use strict';

  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwWiWeesEtkkzsbZrEb4I1WYAj8LPVY73H5ZZo1kB8UjWCcL2v5IbH3WvfZqblkEhMu/exec';
  const TOKEN = 'steam-mp-7000-2026';
  const SESSION_KEY = 'steam_mp_session';

  // ---------- SESSION HELPERS ----------
  function saveSession(obj){
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch(e){}
  }

  // ---------- API ----------
  async function apiPost(action, data){
    try {
      const res = await fetch(BACKEND_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain' },
        body: JSON.stringify({ action, token:TOKEN, ...data }),
        redirect:'follow'
      });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ return { ok:false, pesan:'Respons tidak valid' }; }
    } catch(e){
      return { ok:false, pesan:'Gagal terhubung ke server' };
    }
  }

  // ---------- UI HELPERS ----------
  const $ = id => document.getElementById(id);
  function showAlert(msg){
    const box = $('alertBox');
    box.textContent = msg;
    box.classList.add('show');
  }
  function hideAlert(){
    const box = $('alertBox');
    box.textContent = '';
    box.classList.remove('show');
  }
  function roleLabel(role){
    return { owner:'Owner', admin:'Admin', kepala_toko:'Kepala Toko', karyawan:'Karyawan' }[role] || 'Karyawan';
  }

  // ---------- INIT ----------
  document.addEventListener('DOMContentLoaded', () => {
    // Cek session SEKALI
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.user_id) {
          window.location.replace('dashboard.html');
          return;
        }
      }
    } catch(e){ /* ignore */ }

    // Toggle password
    $('btnEye').addEventListener('click', () => {
      const inp = $('inpPass');
      if (inp.type === 'password'){ inp.type = 'text'; $('btnEye').textContent = '🙈'; }
      else { inp.type = 'password'; $('btnEye').textContent = '👁'; }
    });

    // Enter key submit
    $('inpPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
    $('inpId').addEventListener('keydown', e => { if(e.key==='Enter') $('inpPass').focus(); });

    // MASUK
    $('btnMasuk').addEventListener('click', doLogin);

    // DEMO
    $('btnDemo').addEventListener('click', () => {
      hideAlert();
      $('demoOverlay').classList.add('show');
    });
    $('btnCloseDemo').addEventListener('click', () => {
      $('demoOverlay').classList.remove('show');
    });
    $('demoOverlay').addEventListener('click', e => {
      if (e.target === $('demoOverlay')) $('demoOverlay').classList.remove('show');
    });

    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const role = btn.dataset.role;
        const label = roleLabel(role);
        saveSession({
          user_id: 'demo_' + role,
          user_nama: 'Demo ' + label,
          user_jabatan: label,
          user_kode_cabang: (role === 'kepala_toko' || role === 'karyawan') ? 'GROBOGAN' : '-',
          is_demo: true,
          login_time: Date.now()
        });
        window.location.replace('dashboard.html');
      });
    });
  });

  // ---------- LOGIN ----------
  async function doLogin(){
    hideAlert();
    const id = $('inpId').value.trim();
    const pass = $('inpPass').value;
    if (!id || !pass){
      showAlert('ID dan Password wajib diisi.');
      return;
    }
    const btn = $('btnMasuk');
    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = 'MEMPROSES...';

    const res = await apiPost('baca', { sheet:'Users' });

    if (!res || !res.ok || !Array.isArray(res.data)){
      showAlert(res && res.pesan ? res.pesan : 'Gagal memuat data pengguna.');
      btn.disabled = false; btn.textContent = oldText;
      return;
    }

    const u = res.data.find(x =>
      String(x.id) === id &&
      String(x.password) === pass &&
      String(x.status).toLowerCase() === 'aktif' &&
      x.dihapus !== true
    );

    if (!u){
      showAlert('ID atau Password salah.');
      btn.disabled = false; btn.textContent = oldText;
      return;
    }

    saveSession({
      user_id: String(u.id),
      user_nama: String(u.nama || '-'),
      user_jabatan: String(u.jabatan || '-'),
      user_kode_cabang: String(u.kode_cabang || '-'),
      is_demo: false,
      login_time: Date.now()
    });
    window.location.replace('dashboard.html');
  }
})();
</script>
</body>
</html>
