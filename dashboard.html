    if (s.login_time && (now - s.login_time) > durasi) {
      sessionStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s;
  } catch (e) { return null; }
}

function isDemo() { var s = getSession(); return s && s.is_demo === true; }

/* ============================================================
   API
   ============================================================ */
function apiPost(action, data) {
  var payload = Object.assign({ action: action, token: TOKEN }, data || {});
  return fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(r) { return r.json(); })
    .then(function(res) { return res; })
    .catch(function(e) { return { ok: false, pesan: 'Koneksi gagal: ' + e.message }; });
}

function ambilData(sheet, forceRefresh) {
  if (isDemo()) {
    return Promise.resolve(DUMMY_DATA[sheet] || []);
  }
  if (!forceRefresh) {
    var cached = ambilCache(sheet);
    if (cached) return Promise.resolve(cached);
  }
  return apiPost('baca', { sheet: sheet }).then(function(res) {
    var data = (res && res.ok && res.data) ? res.data : [];
    setCache(sheet, data);
    return data;
  });
}

function simpanData(sheet, data) {
  if (isDemo()) {
    showToast('Mode demo tidak bisa menyimpan data', 'warning');
    return Promise.resolve({ ok: false, pesan: 'Mode demo' });
  }
  return apiPost('tulis_unik', { sheet: sheet, data: data });
}

function updateData(sheet, row, data) {
  if (isDemo()) {
    showToast('Mode demo tidak bisa mengupdate data', 'warning');
    return Promise.resolve({ ok: false, pesan: 'Mode demo' });
  }
  return apiPost('update', { sheet: sheet, row: row, data: data });
}

function hapusData(sheet, row) {
  if (isDemo()) {
    showToast('Mode demo tidak bisa menghapus data', 'warning');
    return Promise.resolve({ ok: false, pesan: 'Mode demo' });
  }
  return apiPost('hapus', { sheet: sheet, row: row });
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function todayStr() {
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}
function nowISO() { return new Date().toISOString(); }
function fmtRupiah(n) {
  if (n === null || n === undefined || isNaN(n)) return 'Rp 0';
  return 'Rp ' + Number(n).toLocaleString('id-ID');
}
function fmtAngka(n) {
  if (n === null || n === undefined || isNaN(n)) return '0';
  return Number(n).toLocaleString('id-ID');
}
function generateSubmissionId(prefix) {
  return prefix + '-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6).toUpperCase();
}
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = 'toast'; }, 3000);
}

/* ============================================================

   ============================================================ */
function getAccRoleSekarang(jabatanPengaju, statusSekarang) {
  if (jabatanPengaju === 'Karyawan') {
    if (statusSekarang === 'menunggu') return 'Kepala Toko';
    if (statusSekarang === 'disetujui_kt') return 'Admin';
    if (statusSekarang === 'disetujui_admin') return 'Owner';
  }
  if (jabatanPengaju === 'Kepala Toko') {
    if (statusSekarang === 'menunggu') return 'Admin';
    if (statusSekarang === 'disetujui_admin') return 'Owner';
  }
  if (jabatanPengaju === 'Admin') {
    if (statusSekarang === 'menunggu') return 'Owner';
  }
  if (jabatanPengaju === 'Owner') {
    if (statusSekarang === 'menunggu') return null;
  }
  return null;
}
function bolehAcc(jabatanUser, jabatanPengaju, status) {
  var role = getAccRoleSekarang(jabatanPengaju, status);
  return role === jabatanUser;
}
function getStatusSetelahAcc(status, jabatanYangAcc) {
  if (jabatanYangAcc === 'Kepala Toko') return 'disetujui_kt';
  if (jabatanYangAcc === 'Admin') return 'disetujui_admin';
  if (jabatanYangAcc === 'Owner') return 'disetujui';
  return status;
}
function labelStatus(st) {
  var map = {
    'menunggu': 'Menunggu', 'disetujui_kt': 'Disetujui KT',
    'disetujui_admin': 'Disetujui Admin', 'disetujui': 'Disetujui',
    'ditolak': 'Ditolak'
  };
  return map[st] || st;
}
function badgeStatus(st) {
  var cls = 'badge-gray';
  if (st === 'menunggu') cls = 'badge-warning';
  else if (st === 'disetujui_kt' || st === 'disetujui_admin') cls = 'badge-info';
  else if (st === 'disetujui') cls = 'badge-success';
  else if (st === 'ditolak') cls = 'badge-danger';
  return '<span class="badge ' + cls + '">' + labelStatus(st) + '</span>';
}

  else if (jabatan === 'Admin' && !s.is_demo) donasiText = 'Setiap iklan yang kamu tonton bantu keluarga kami sedikit demi sedikit. Terima kasih 🙏';
  else donasiText = 'Kalau kamu mau bantu mimin, tonton 1 iklan tambahan ya. Nanti mimin beliin bakso (becanda)';
  html += '<div class="donasi-card"><p>' + esc(donasiText) + '</p>' +
    '<button class="btn btn-gold btn-sm" onclick="paksaIklan(function(){showToast(\'Terima kasih sudah menonton iklan! 🙏\',\'success\')})">📺 Tonton Iklan Sebagai Donasi</button></div>';

  // Load data async setelah render
  setTimeout(loadHomeData, 50);
  return html;
}

function loadHomeData() {
  var s = getSession();
  if (!s) return;
  var jabatan = s.user_jabatan;
  var today = todayStr();
  var bulanIni = today.substring(0, 7);

  // Motivasi
  if (jabatan === 'Owner' || jabatan === 'Admin') {
    ambilData('Motivasi').then(function(data) {
      var el = document.getElementById('motivasiCard');
      if (!el) return;
      if (!data || !data.length) { el.innerHTML = ''; return; }
      var idx = new Date().getDate() % data.length;
      var m = data[idx];
      el.innerHTML = '<div class="motivasi-card"><span class="icon">💡</span><span class="text">' + esc(m.kalimat || '') + '</span></div>';
    });

    // Dana Expansi
    ambilData('Dana_Expansi').then(function(data) {
      var el = document.getElementById('danaExpansiCard');
      if (!el) return;
      var saldo = 0;
      (data || []).forEach(function(d) {
        var j = Number(d.jumlah) || 0;
        if (d.jenis === 'masuk') saldo += j; else saldo -= j;
      });
      var target = 50000000;
      // Coba ambil dari Pengaturan
      ambilData('Pengaturan').then(function(pData) {
        var el2 = document.getElementById('danaExpansiCard');
        if (!el2) return;
        (pData || []).forEach(function(p) {
          if (p.key === 'target_cabang_baru') target = Number(p.value) || 50000000;
        });
        var pct = target > 0 ? Math.min(100, Math.round(saldo / target * 100)) : 0;
        el2.innerHTML = '<div class="dana-card"><div class="label">Dana Expansi</div><div class="amount">' + fmtRupiah(saldo) + '</div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="target">Target: ' + fmtRupiah(target) + ' (' + pct + '%)</div></div>';
      });
    });
  }

  // Statistik: Pendapatan hari ini & bulan ini
  ambilData('Pendapatan_Harian').then(function(data) {
    var el = document.getElementById('statsGrid');
    if (!el) return;
    var hariIni = 0, bulanIni = 0;
    (data || []).forEach(function(d) {
      if (d.dihapus) return;
      var unit = Number(d.unit) || 0;
      var tips = Number(d.tips) || 0;
      var bonus = Number(d.bonus) || 0;
      var total = (unit * 3000) + tips + bonus;
      if (d.tanggal === today) hariIni += total;
      if (d.tanggal && d.tanggal.substring(0, 7) === bulanIni) bulanIni += total;
    });
    el.innerHTML = '<div class="stat-card"><div class="label">Hari Ini</div><div class="value">' + fmtRupiah(hariIni) + '</div></div>' +
      '<div class="stat-card"><div class="label">Bulan Ini</div><div class="value green">' + fmtRupiah(bulanIni) + '</div></div>';
  });
}

function switchTab(el, targetId) {
  var parent = el.parentElement;
  parent.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  var container = parent.parentElement;
  container.querySelectorAll('.tab-content').forEach(function(c) { c.classList.add('hidden'); });
  var target = document.getElementById(targetId);
  if (target) target.classList.remove('hidden');
}

function renderACCList(data, sheet, idField) {
  if (!data || !data.length) return '<div class="empty"><div class="icon">📭</div><p>Tidak ada data menunggu ACC</p></div>';
  var html = '';
  data.forEach(function(item) {
    var row = item._row;
    html += '<div class="card">';
    html += '<div class="flex-between mb-2"><span class="font-semibold">' + esc(item[idField] || item.submission_id || '-') + '</span>' + badgeStatus(item.status) + '</div>';
    // Tampilkan field umum
    if (item.nama_karyawan) html += '<div class="text-sm">👤 ' + esc(item.nama_karyawan) + ' (' + esc(item.jabatan_pengaju || '') + ')</div>';
    if (item.nama_pelapor) html += '<div class="text-sm">👤 ' + esc(item.nama_pelapor) + ' (' + esc(item.jabatan_pelapor || '') + ')</div>';
    if (item.nama_pengaju) html += '<div class="text-sm">👤 ' + esc(item.nama_pengaju) + '</div>';
    if (item.tanggal_pengajuan) html += '<div class="text-xs text-muted">📅 ' + esc(item.tanggal_pengajuan) + '</div>';
    if (item.tanggal) html += '<div class="text-xs text-muted">📅 ' + esc(item.tanggal) + '</div>';
    if (item.jumlah_kasbon) html += '<div class="text-sm">💰 ' + fmtRupiah(item.jumlah_kasbon) + '</div>';
    if (item.judul) html += '<div class="text-sm">📌 ' + esc(item.judul) + '</div>';
    if (item.alasan) html += '<div class="text-sm">📝 ' + esc(item.alasan) + '</div>';
    if (item.keterangan) html += '<div class="text-xs text-muted">' + esc(item.keterangan) + '</div>';
    html += '<div class="flex gap-2 mt-3">' +
      '<button class="btn btn-success btn-sm" onclick="accData(\'' + sheet + '\',' + row + ',\'' + idField + '\',\'' + esc(item.status) + '\',true)">✅ Setujui</button>' +
      '<button class="btn btn-danger btn-sm" onclick="accData(\'' + sheet + '\',' + row + ',\'' + idField + '\',\'' + esc(item.status) + '\',false)">❌ Tolak</button></div>';
    html += '</div>';
  });
  return html;
}

function accData(sheet, row, idField, statusSekarang, setuju) {
  var s = getSession();
  var jabatan = s.user_jabatan;
  var newStatus = setuju ? getStatusSetelahAcc(statusSekarang, jabatan) : 'ditolak';
  var update = {
    status: newStatus,
    acc_by: s.user_id,
    acc_time: nowISO(),
    updated_at: nowISO()
  };
  if (!setuju) update.alasan_penolakan = 'Ditolak oleh ' + jabatan;
  updateData(sheet, row, update).then(function(res) {
    if (res && res.ok) {
      showToast(setuju ? 'Disetujui!' : 'Ditolak', setuju ? 'success' : 'warning');
      CACHE = {};
      renderHalaman();
    } else showToast((res && res.pesan) || 'Gagal update', 'error');
  });
}

var _pendapatanRows = 0;
function tambahBarisPendapatan() { showToast('Fitur tambah manual dalam pengembangan', 'warning'); }

function previewPendapatan() {
  var s = getSession();
  var tgl = document.getElementById('pendapatanTanggal').value;
  if (!tgl) { showToast('Pilih tanggal', 'warning'); return; }
  var rows = document.querySelectorAll('#pendapatanKaryawanList .card');
  var data = [];
  rows.forEach(function(row, i) {
    var unit = Number(document.getElementById('unit_' + i).value) || 0;
    var tips = Number(document.getElementById('tips_' + i).value) || 0;
    var kasbon = Number(document.getElementById('kasbon_' + i).value) || 0;
    var status = document.getElementById('status_' + i).value;
    var alasan = document.getElementById('alasan_' + i).value;
    var idK = document.getElementById('idKaryawan_' + i).value;
    var namaK = document.getElementById('namaKaryawan_' + i).value;
    var jabK = document.getElementById('jabatanKaryawan_' + i).value;
    if (kasbon > 20000 && status === 'tidak') kasbon = 20000;
    data.push({ id_karyawan: idK, nama_karyawan: namaK, jabatan: jabK, unit: unit, tips: tips, kasbon: kasbon, status_masuk: status, alasan: alasan });
  });
  var totalUnit = data.reduce(function(a, b) { return a + (b.status_masuk === 'masuk' ? b.unit : 0); }, 0);
  var totalTips = data.reduce(function(a, b) { return a + (b.status_masuk === 'masuk' ? b.tips : 0); }, 0);
  var jumlahMasuk = data.filter(function(d) { return d.status_masuk === 'masuk'; }).length;
  var unitPerOrang = jumlahMasuk > 0 ? Math.floor(totalUnit / jumlahMasuk) : 0;
  var tipsPerOrang = jumlahMasuk > 0 ? Math.floor(totalTips / jumlahMasuk) : 0;
  var sisaUnit = totalUnit - (unitPerOrang * jumlahMasuk);
  var sisaTips = totalTips - (tipsPerOrang * jumlahMasuk);
  var html = '<div class="card"><div class="card-title">Preview Pembagian</div>';
  html += '<div class="total-banner mb-2"><div class="label">Total Unit Cabang</div><div class="value">' + totalUnit + '</div></div>';
  html += '<div class="total-banner mb-2" style="background:linear-gradient(135deg,#059669,#047857)"><div class="label">Total Tips Cabang</div><div class="value">' + fmtRupiah(totalTips) + '</div></div>';
  html += '<table><tr><th>Nama</th><th>Unit</th><th>Tips</th><th>Kasbon</th><th>Wifi</th></tr>';
  data.forEach(function(d) {
    var u = d.status_masuk === 'masuk' ? (d.jabatan === 'Kepala Toko' ? unitPerOrang + sisaUnit : unitPerOrang) : 0;
    var t = d.status_masuk === 'masuk' ? (d.jabatan === 'Kepala Toko' ? tipsPerOrang + sisaTips : tipsPerOrang) : 0;
    html += '<tr><td>' + esc(d.nama_karyawan) + '</td><td>' + u + '</td><td>' + fmtRupiah(t) + '</td><td>' + fmtRupiah(d.kasbon) + '</td><td>1.000</td></tr>';
  });
  html += '</table>';
  html += '<button class="btn btn-primary btn-block mt-3" onclick="simpanPendapatan()">✅ Konfirmasi & Simpan</button></div>';
  document.getElementById('previewPendapatanArea').innerHTML = html;
}

  });
}

function simpanPengeluaran() {

    kode_cabang: s.kode_cabang,

    jumlah: jumlah,
    keterangan: document.getElementById('pengeluaranKeterangan').value,
    dicatat_oleh: s.user_id,
    submission_id: generateSubmissionId('PG'),
    created_at: nowISO()
  };
  simpanData('Pengeluaran', data).then(function(res) {
    if (res && res.ok) { showToast('Pengeluaran tersimpan!', 'success'); navigasi('operasional'); }
