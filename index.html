<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#C8102E">
<title>STEAM MP 7000 — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(160deg, #C8102E 0%, #8B0000 35%, #ffffff 35.1%, #F9FAFB 100%);
  background-attachment: fixed;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  color: #1F2937;
  -webkit-font-smoothing: antialiased;
}

/* ===== CARD ===== */
.card {
  background: #ffffff;
  width: 100%;
  max-width: 400px;
  border-radius: 16px;
  padding: 32px 24px 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  animation: fadeUp .55s cubic-bezier(.22,1,.36,1) both;
  position: relative;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
.card.shake { animation: shake .45s ease; }

/* ===== LOGO ===== */
.logo-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 18px;
}
.logo-svg {
  display: block;
  width: 80px;
  height: 80px;
  animation: glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 4px 12px rgba(200,16,46,0.3)) drop-shadow(0 0 20px rgba(251,191,36,0.3)); }
  50% { filter: drop-shadow(0 4px 16px rgba(200,16,46,0.5)) drop-shadow(0 0 32px rgba(251,191,36,0.6)); }
}
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #FBBF24;
  border-radius: 50%;
  animation: sparkleAnim 2s infinite;
  pointer-events: none;
  box-shadow: 0 0 6px rgba(251,191,36,.8);
}
@keyframes sparkleAnim {
  0%, 100% { opacity: 0; transform: scale(.5); }
  50% { opacity: 1; transform: scale(1); }
}
.sp1 { top: -2px; left: 8px; animation-delay: 0s; }
.sp2 { top: 10px; right: -4px; animation-delay: .4s; }
.sp3 { bottom: 6px; left: -6px; animation-delay: .8s; }
.sp4 { bottom: -4px; right: 10px; animation-delay: 1.2s; }
.sp5 { top: 34px; left: -8px; animation-delay: 1.6s; }

/* ===== TITLE ===== */
h1 {
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  color: #C8102E;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.tagline {
  text-align: center;
  font-size: 11.5px;
  font-weight: 500;
  color: #6B7280;
  line-height: 1.5;
  margin-bottom: 22px;
}
.tagline .gold { color: #B45309; font-weight: 700; }

/* ===== ERROR ===== */
.error-msg {
  display: none;
  background: #FEF2F2;
  border-left: 3px solid #C8102E;
  color: #B91C1C;
  font-size: 12.5px;
  font-weight: 500;
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 14px;
  line-height: 1.45;
  animation: fadeUp .3s ease both;
}
.error-msg.show { display: block; }

/* ===== FORM ===== */
.field {
  margin-bottom: 14px;
  position: relative;
}
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
  letter-spacing: .2px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: #111827;
  background: #fff;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
.field input:focus {
  border-color: #C8102E;
  box-shadow: 0 0 0 3px rgba(200,16,46,0.12);
}
.field input::placeholder { color: #9CA3AF; font-weight: 400; }
.field.pass input { padding-right: 46px; }
.toggle-pass {
  position: absolute;
  right: 8px;
  bottom: 4px;
  width: 38px;
  height: 38px;
  border: none;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
  color: #6B7280;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.toggle-pass:active { background: #F3F4F6; }

/* ===== BUTTONS ===== */
.btn {
  width: 100%;
  padding: 13px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .4px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: transform .12s, box-shadow .2s, opacity .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  -webkit-appearance: none;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .7; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, #C8102E 0%, #A00D25 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(200,16,46,0.35);
  margin-bottom: 10px;
}
.btn-outline {
  background: #fff;
  color: #B45309;
  border: 2px solid #F59E0B;
}
.btn-outline:active { background: #FFFBEB; }

.spinner-sm {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: iklanSpin .7s linear infinite;
}
@keyframes iklanSpin { to { transform: rotate(360deg); } }

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  font-size: 10.5px;
  font-weight: 500;
  color: #9CA3AF;
  margin-top: 20px;
  letter-spacing: .3px;
}

/* ===== MODAL DEMO ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 360px;
  padding: 24px 20px 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
  animation: fadeUp .35s cubic-bezier(.22,1,.36,1) both;
}
.modal h2 {
  font-size: 17px;
  font-weight: 700;
  color: #C8102E;
  text-align: center;
  margin-bottom: 4px;
}
.modal p.sub {
  font-size: 12px;
  color: #6B7280;
  text-align: center;
  margin-bottom: 16px;
}
.role-btn {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 8px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  text-align: left;
  background: #F9FAFB;
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  cursor: pointer;
  color: #1F2937;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all .15s;
  -webkit-appearance: none;
}
.role-btn:active { background: #FEF2F2; border-color: #C8102E; transform: scale(.98); }
.role-btn .role-emoji { font-size: 18px; }
.role-btn .role-info { flex: 1; }
.role-btn .role-info b { display: block; font-size: 13.5px; }
.role-btn .role-info span { font-size: 10.5px; color: #6B7280; font-weight: 400; }
.modal-close {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: #6B7280;
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 8px;
}

/* ===== LOADING IKLAN ===== */
#iklanLoading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: linear-gradient(135deg, #C8102E, #8B0000);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  text-align: center;
  flex-direction: column;
}
#iklanLoading.show { display: flex; }
.iklan-spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(255,255,255,.2);
  border-top-color: #FBBF24;
  border-radius: 50%;
  animation: iklanSpin .8s linear infinite;
  margin: 0 auto 18px;
}
#iklanLoading h3 {
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
}
.iklan-kata-box {
  background: rgba(255,255,255,.15);
  color: #fff;
  font-size: 13px;
  font-style: italic;
  line-height: 1.6;
  padding: 14px 16px;
  border-radius: 12px;
  max-width: 340px;
  margin: 0 auto 14px;
  border: 1px solid rgba(251,191,36,.3);
}
.iklan-sub {
  color: rgba(255,255,255,.8);
  font-size: 12px;
  font-weight: 500;
}
.iklan-footer {
  position: absolute;
  bottom: 24px;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255,255,255,.6);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .3px;
}

/* ===== ERROR CATCHER ===== */
#errorPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(0,0,0,.75);
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  overflow-y: auto;
}
#errorPanel.show { display: flex; }
.error-card {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  padding: 22px 18px 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  animation: fadeUp .3s ease both;
}
.error-card h2 {
  font-size: 17px;
  font-weight: 800;
  color: #C8102E;
  text-align: center;
  margin-bottom: 12px;
}
.error-pesan {
  background: #FEF2F2;
  border-left: 3px solid #C8102E;
  color: #B91C1C;
  font-family: 'Courier New', monospace;
  font-size: 11.5px;
  font-weight: 500;
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  word-break: break-word;
  line-height: 1.5;
  max-height: 200px;
  overflow-y: auto;
}
.error-detail {
  display: none;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  padding: 10px 12px;
  font-family: 'Courier New', monospace;
  font-size: 10.5px;
  color: #374151;
  line-height: 1.5;
  margin-bottom: 12px;
  max-height: 240px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.error-detail.show { display: block; }
.error-actions { display: flex; flex-direction: column; gap: 8px; }
.error-actions .btn { font-size: 12.5px; padding: 11px; }
.btn-wa {
  background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(37,211,102,.3);
}
.btn-copy {
  background: #F3F4F6;
  color: #1F2937;
  border: 1px solid #E5E7EB;
}
.btn-detail {
  background: #FFFBEB;
  color: #B45309;
  border: 1px solid #FDE68A;
}
.btn-close {
  background: #C8102E;
  color: #fff;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 380px) {
  .card { padding: 26px 18px 20px; }
  h1 { font-size: 21px; }
  .logo-wrap, .logo-svg { width: 70px; height: 70px; }
}
</style>

// ============================================================
// ERROR CATCHER
// ============================================================
var errorHistory = [];
var errorPanelOpen = false;

function catatError(pesan, detail, jenis) {
  try {
    errorHistory.push({
      pesan: String(pesan || 'Unknown error'),
      detail: String(detail || ''),
      waktu: new Date().toLocaleString('id-ID'),
      jenis: jenis || 'error'
    });
    if (errorHistory.length > 20) errorHistory.shift();
    tampilkanErrorPanel();
  } catch (e) { /* ignore */ }
}

function tampilkanErrorPanel() {
  try {
    var last = errorHistory[errorHistory.length - 1];
    if (!last) return;
    document.getElementById('errorPanelPesan').textContent = last.pesan;
    document.getElementById('errorPanelDetail').textContent = buildDetailText();
    document.getElementById('errorPanel').classList.add('show');
    errorPanelOpen = true;
  } catch (e) { /* ignore */ }
}

function buildDetailText() {
  var lines = [];
  lines.push('=== STEAM MP 7000 ERROR REPORT ===');
  lines.push('Waktu: ' + new Date().toLocaleString('id-ID'));
  lines.push('URL: ' + (window.location.href || '-'));
  lines.push('User Agent: ' + (navigator.userAgent || '-'));
  lines.push('=====================================');
  for (var i = 0; i < errorHistory.length; i++) {
    var e = errorHistory[i];
    lines.push('--- ERROR #' + (i + 1) + ' ---');
    lines.push('Pesan: ' + e.pesan);
    if (e.detail) lines.push('Detail: ' + e.detail);
    lines.push('Waktu: ' + e.waktu);
    lines.push('');
  }
  return lines.join('\n');
}

window.addEventListener('error', function(ev) {
  catatError(ev.message || 'Script error', (ev.filename || '') + ':' + (ev.lineno || '') + ':' + (ev.colno || ''), 'onerror');
});
window.addEventListener('unhandledrejection', function(ev) {
  var r = ev.reason;
  catatError(r && r.message ? r.message : String(r), r && r.stack ? r.stack : '', 'promise');
});

// Override fetch untuk deteksi error jaringan
(function() {
  var _fetch = window.fetch;
  if (!_fetch) return;
  window.fetch = function() {
    return _fetch.apply(this, arguments).catch(function(err) {
      catatError('Fetch gagal: ' + (err && err.message ? err.message : String(err)), '', 'fetch');
      throw err;
    });
  };
})();

// ============================================================
// HELPER: API
// ============================================================
async function apiPost(action, data) {
  try {
    var body = Object.assign({ action: action, token: TOKEN }, data || {});
    var res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    });
    var text = await res.text();
    try { return JSON.parse(text); }
    catch (e) { return { ok: false, pesan: 'Respon server tidak valid', data: [] }; }
  } catch (e) {
    return { ok: false, pesan: 'Koneksi gagal: ' + e.message, data: [] };
  }
}

// ============================================================
// HELPER: SESSION
// ============================================================
function getSession() {
  try {
    var raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var obj = JSON.parse(raw);
    if (!obj || !obj.login_time) return null;
    var umur = Date.now() - obj.login_time;
    var maxUmur = obj.is_demo ? 5 * 60 * 1000 : 8 * 60 * 60 * 1000;
    if (umur > maxUmur) {
      hapusSession();
      return null;
    }
    return obj;
  } catch (e) {
    return null;
  }
}

function saveSession(obj) {
  try {
    var str = JSON.stringify(obj);
    try { sessionStorage.setItem(SESSION_KEY, str); } catch (e) {}
    try { localStorage.setItem(SESSION_KEY, str); } catch (e) {}
    return true;
  } catch (e) {
    return false;
  }
}

function hapusSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

var lastKataIndex = -1;

function getUrlIklanRandom() {
  return Math.random() < 0.5 ? IKLAN_URL_MONETAG : IKLAN_URL_ADSTERRA;
}

function triggerIklan() {
  try {
    var url = getUrlIklanRandom();
    window.open(url, '_blank');
    if (window.AndroidAds && typeof window.AndroidAds.show === 'function') {
      try { window.AndroidAds.show(); } catch (e) {}
    }
  } catch (e) { /* ignore */ }
}

function getKataIklanRandom(isAdmin) {
  var arr = isAdmin ? KATA_IKLAN_ADMIN : KATA_IKLAN_UMUM;
  if (!arr || arr.length === 0) return 'Mohon tunggu sebentar...';
  var idx = Math.floor(Math.random() * arr.length);
  if (arr.length > 1 && idx === lastKataIndex) {
    idx = (idx + 1) % arr.length;
  }
  lastKataIndex = idx;
  return arr[idx];
}

function tampilkanLoadingIklan(kata) {
  var el = document.getElementById('iklanLoading');
  document.getElementById('iklanKata').textContent = kata || 'Mohon tunggu sebentar...';
  el.classList.add('show');
  triggerIklan();
}

function tutupLoadingIklan() {
  document.getElementById('iklanLoading').classList.remove('show');
}

// ============================================================
// LOGIKA LOGIN
// ============================================================
async function prosesLogin() {
  hideError();
  var inputId = document.getElementById('inputId').value.trim();
  var inputPass = document.getElementById('inputPass').value.trim();
  var btn = document.getElementById('btnMasuk');
  var btnText = document.getElementById('btnMasukText');

  if (!inputId) { showError('ID Pengguna wajib diisi'); return; }
  if (!inputPass) { showError('Password wajib diisi'); return; }

  btn.disabled = true;
  btnText.textContent = 'Memeriksa...';
  btn.innerHTML = '<span class="spinner-sm"></span><span id="btnMasukText">Memeriksa...</span>';

  try {
    var res = await apiPost('baca', { sheet: 'Users' });
    if (!res || !res.ok) {
      showError(res && res.pesan ? res.pesan : 'Gagal memuat data pengguna');
      return;
    }
    if (!Array.isArray(res.data)) {
      showError('Respons tidak valid');
      return;
    }

    var found = null;
    for (var i = 0; i < res.data.length; i++) {
      var u = res.data[i];
      var idOk = String(u.id).trim() === inputId;
      var passOk = String(u.password).trim() === inputPass;
      var statusOk = String(u.status).toLowerCase() === 'aktif';
      var dihapusOk = String(u.dihapus).toLowerCase() !== 'true';
      if (idOk && passOk && statusOk && dihapusOk) {
        found = u;
        break;
      }
    }

    if (!found) {
      showError('ID atau Password salah');
      return;
    }

    var session = {
      user_id: String(found.id),
      user_nama: String(found.nama || found.id),
      user_jabatan: String(found.jabatan || 'Karyawan'),
      kode_cabang: String(found.kode_cabang || '-'),
      is_demo: false,
      login_time: Date.now()
    };
    saveSession(session);

    var jabatan = session.user_jabatan;
    if (jabatan === 'Owner') {
      redirectDashboard();
    } else {
      var kata = getKataIklanRandom(true);
      tampilkanLoadingIklan(kata);
      setTimeout(function() {
        tutupLoadingIklan();
        redirectDashboard();
      }, IKLAN_DURASI);
    }
  } catch (e) {
    showError('Terjadi kesalahan: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'MASUK';
  }
}

function bukaModalDemo() {
  document.getElementById('modalDemo').classList.add('show');
}

function pilihRoleDemo(role) {
  tutupModalDemo();
  var session = {
    user_id: 'demo_' + role.toLowerCase().replace(/\s/g, '_'),
    user_nama: 'Demo ' + role,
    user_jabatan: role,
    kode_cabang: '-',
    is_demo: true,
    login_time: Date.now()
  };
  saveSession(session);
  var kata = getKataIklanRandom(false);
  tampilkanLoadingIklan(kata);
  setTimeout(function() {
    tutupLoadingIklan();
    redirectDashboard();
  }, IKLAN_DURASI);
}

document.getElementById('btnSalinError').addEventListener('click', function() {
  try {
    var teks = buildDetailText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(teks).then(function() {
        alert('Detail error disalin ✅');
      }).catch(function() {
        fallbackCopy(teks);
      });
    } else {
      fallbackCopy(teks);
    }
  } catch (e) { alert('Gagal menyalin: ' + e.message); }
});

function fallbackCopy(teks) {
  try {
    var ta = document.createElement('textarea');
    ta.value = teks;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Detail error disalin ✅');
  } catch (e) { alert('Gagal menyalin'); }
}
